<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天秤図の部屋 v0.1｜濃度ラボ</title>
<style>
*{box-sizing:border-box} :root{--bg:#f7f5ef;--ink:#242424;--salt:#e6c5a8;--water:#a8d8ea;--line:#716f6a}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}main{max-width:1200px;margin:0 auto;padding:15px 28px 26px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px}.back{font-size:15px;color:#5b737b;text-decoration:none;font-weight:800;border:1px solid #d5d1c8;border-radius:12px;padding:10px 16px;background:#fff}h1{font-size:clamp(27px,3vw,39px);margin:0;text-align:center}.ver{font-size:12px;border:1px solid #c8c2b7;border-radius:20px;padding:5px 10px;background:#fff;white-space:nowrap}.question{margin:20px 0 12px;background:#fff;border:1px solid #e5dfd5;border-radius:14px;padding:16px 22px;line-height:1.65;font-size:clamp(17px,2vw,22px);font-weight:700}.question small{display:block;font-size:13px;color:#807a70;font-weight:700;margin-bottom:3px}.panel{background:#fff;border:1px solid #e5dfd5;border-radius:18px;padding:12px 22px 18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head strong{font-size:17px}.hint{font-size:13px;color:#777}.diagram{width:100%;height:auto;display:block;max-height:460px;touch-action:none;user-select:none}.pivot-hit{cursor:grab;touch-action:none}.pivot-hit:active{cursor:grabbing}.weight-text{font-weight:900;fill:#26343a;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.legend{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;margin:6px 0 0;font-size:14px;color:#5f5c57}.legend b{color:#242424}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}.status{font-size:15px;color:#5e5b56;line-height:1.6}.status strong{color:#222}.buttons{display:flex;gap:9px}button{font:inherit;cursor:pointer;border:1px solid #c9c5bd;border-radius:12px;padding:10px 15px;background:#fff;font-weight:800;color:#3c4e54}button.primary{background:#d8eaf0;border-color:#afc9d1}.note{margin:12px 0 0;font-size:13px;color:#7c786f;line-height:1.7}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){main{padding:12px}.question{margin:12px 0;padding:12px 14px}.panel{padding:10px}.hint{font-size:11px}.legend{font-size:12px;gap:10px}.diagram{max-height:390px}}@media(orientation:landscape) and (max-height:760px){.question{margin:10px 0 8px;padding:9px 16px}.panel{padding:6px 18px}.diagram{max-height:340px}.note{margin-top:6px}}
</style></head><body><main><div class="head"><a class="back" href="../">← TOP</a><h1>天秤図の部屋</h1><span class="ver">v0.1</span></div>
<div class="question"><small>問題 03｜食塩水を混ぜる</small>4％の食塩水100gに、10％の食塩水を加えたら6％になりました。何g加えた？</div>
<section class="panel"><div class="panel-head"><strong>支点を左右に動かしてみよう</strong><span class="hint">▲ を指でドラッグ</span></div>
<svg class="diagram" id="diagram" viewBox="0 0 1040 440" role="img" aria-label="4パーセントと10パーセントの食塩水を混ぜる天秤図。支点を左右に動かせます">
<line x1="180" y1="151" x2="860" y2="151" stroke="#62625f" stroke-width="7" stroke-linecap="round"/>
<line x1="180" y1="138" x2="180" y2="164" stroke="#7697a6" stroke-width="4"/><line x1="860" y1="138" x2="860" y2="164" stroke="#b58e6c" stroke-width="4"/>
<g font-size="29" font-weight="800" fill="#343434" text-anchor="middle"><text x="180" y="108">4％</text><text x="860" y="108">10％</text></g>
<line x1="180" y1="151" x2="180" y2="218" stroke="#9e9c96" stroke-width="3"/><line x1="860" y1="151" x2="860" y2="218" stroke="#9e9c96" stroke-width="3"/>
<rect id="leftWeight" x="117" y="218" width="126" height="126" rx="14" fill="#a8d8ea" stroke="#7399aa" stroke-width="2"/>
<text class="weight-text" x="180" y="281" font-size="30">100g</text>
<rect id="rightWeight" x="816" y="218" width="88" height="88" rx="12" fill="#e6c5a8" stroke="#b58e6c" stroke-width="2"/>
<text id="rightText" class="weight-text" x="860" y="262" font-size="27">50g</text>
<g id="pivot" class="pivot-hit" tabindex="0" role="slider" aria-label="混合後の濃度を決める支点" aria-valuemin="4.5" aria-valuemax="8.5" aria-valuenow="6" aria-valuetext="6パーセント">
<rect id="pivotTouch" x="382" y="54" width="76" height="160" fill="transparent"/>
<text id="pivotLabel" x="420" y="102" text-anchor="middle" font-size="32" font-weight="900" fill="#b27e4e">6.0％</text>
<circle id="pivotCircle" cx="420" cy="151" r="10" fill="#d5a16d" stroke="#fff" stroke-width="3"/>
<path id="pivotTriangle" d="M420 163 L397 206 L443 206 Z" fill="#e6c5a8" stroke="#987e65" stroke-width="2"/>
</g>
<g fill="#7a7770" font-size="21" font-weight="700" text-anchor="middle"><text id="leftGap" x="300" y="185">差 2.0</text><text id="rightGap" x="640" y="185">差 4.0</text></g>
<text x="180" y="385" text-anchor="middle" font-size="21" fill="#6c6a65">4％の食塩水</text><text x="860" y="385" text-anchor="middle" font-size="21" fill="#6c6a65">10％の食塩水</text>
</svg>
<div class="legend"><span>左の濃度差 <b id="gapL">2.0</b></span><span>右の濃度差 <b id="gapR">4.0</b></span><span>量の比 <b id="ratio">100：50</b></span></div></section>
<div class="footer"><div class="status" id="status">支点が <strong>6.0％</strong> のとき、加える食塩水は <strong>50g</strong>。</div><div class="buttons"><button id="reset" class="primary">6％に戻す</button></div></div>
<p class="note">濃度差が大きい側ほど、混ぜる量は小さくなります。左の100gは固定。右のおもりは面積が重量に比例して変化します。支点を動かす間は「混合後の濃度を変えて試す」実験です。</p>
</main><script>
(()=>{
const $=id=>document.getElementById(id), svg=$('diagram');
const x0=180,x1=860,min=4,max=10,leftMass=100,leftSide=126;
let conc=6,dragging=false;
const fmt=n=>Number(n.toFixed(1)).toString();
function setConcentration(n){
  conc=Math.max(4.5,Math.min(8.5,Math.round(n*10)/10));
  const x=x0+(conc-min)/(max-min)*(x1-x0);
  const rightMass=leftMass*(conc-min)/(max-conc);
  const side=leftSide*Math.sqrt(rightMass/leftMass);
  const weight=$('rightWeight');
  weight.setAttribute('x',x1-side/2);weight.setAttribute('width',side);weight.setAttribute('height',side);
  weight.setAttribute('y',218);weight.setAttribute('rx',Math.min(14,side/8));
  const label=$('rightText');label.setAttribute('y',218+side/2);label.textContent=fmt(rightMass)+'g';
  label.setAttribute('font-size',Math.max(17,Math.min(30,side*.32)));
  $('pivotTouch').setAttribute('x',x-38);
  $('pivotLabel').setAttribute('x',x);
  $('pivotCircle').setAttribute('cx',x);
  $('pivotTriangle').setAttribute('d',`M${x} 163 L${x-23} 206 L${x+23} 206 Z`);
  $('leftGap').setAttribute('x',(x0+x)/2);$('rightGap').setAttribute('x',(x+x1)/2);
  $('leftGap').textContent='差 '+fmt(conc-min);$('rightGap').textContent='差 '+fmt(max-conc);
  $('gapL').textContent=fmt(conc-min);$('gapR').textContent=fmt(max-conc);
  $('ratio').textContent='100：'+fmt(rightMass);
  $('pivot').setAttribute('aria-valuenow',fmt(conc));$('pivot').setAttribute('aria-valuetext',fmt(conc)+'パーセント');
  $('pivotLabel').textContent=conc.toFixed(1)+'％';
  $('status').innerHTML=`支点が <strong>${conc.toFixed(1)}％</strong> のとき、加える食塩水は <strong>${fmt(rightMass)}g</strong>。`;
}
function positionFromEvent(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();if(!m)return conc;const local=p.matrixTransform(m.inverse());return min+(local.x-x0)/(x1-x0)*(max-min);}
$('pivot').addEventListener('pointerdown',e=>{dragging=true;$('pivot').setPointerCapture(e.pointerId);setConcentration(positionFromEvent(e));e.preventDefault();});
$('pivot').addEventListener('pointermove',e=>{if(dragging)setConcentration(positionFromEvent(e));});
$('pivot').addEventListener('pointerup',()=>dragging=false);$('pivot').addEventListener('pointercancel',()=>dragging=false);
$('pivot').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowDown'){setConcentration(conc-.1);e.preventDefault();}if(e.key==='ArrowRight'||e.key==='ArrowUp'){setConcentration(conc+.1);e.preventDefault();}});
$('reset').addEventListener('click',()=>setConcentration(6));setConcentration(6);
})();
</script></body></html>
