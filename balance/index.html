<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天秤図の部屋 v0.2｜濃度ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f7f5ef;--ink:#2f3437;--ink2:#7b766d;--card:#fff;--edge:#ebe5da;
  --green-d:#3f9b4a;--green-s:#ebfbea;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Hiragino Maru Gothic ProN','M PLUS Rounded 1c',-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:1200px;margin:0 auto;padding:15px 28px 26px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.back{font-size:15px;color:#5b737b;text-decoration:none;font-weight:800;border:2px solid var(--edge);border-radius:999px;padding:9px 18px;background:#fff}
h1{font-size:clamp(27px,3vw,39px);margin:0;text-align:center;font-weight:800;letter-spacing:.04em}
.ver{font-size:12px;border:2px solid var(--edge);border-radius:20px;padding:4px 10px;background:#fff;white-space:nowrap;color:var(--ink2);font-weight:700}
.question{margin:20px 0 12px;background:var(--card);border:2px solid var(--edge);border-radius:22px;padding:26px 26px;line-height:1.7;font-size:clamp(17px,2vw,22px);font-weight:800}
.question small{display:inline-block;font-size:13px;color:var(--green-d);background:var(--green-s);border-radius:999px;padding:2px 12px;font-weight:800;margin-bottom:8px}
.panel{background:var(--card);border:2px solid var(--edge);border-radius:26px;padding:14px 22px 18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head strong{font-size:17px;font-weight:800}
.hint{font-size:13px;color:var(--ink2);font-weight:700}
.hint b{color:var(--green-d)}
.diagram{width:100%;height:auto;display:block;max-height:465px;touch-action:none;user-select:none;-webkit-user-select:none;font-family:inherit}
.pivot-hit{cursor:grab;touch-action:none;outline:none}
.pivot-hit:active{cursor:grabbing}
.pivot-hit:focus-visible .pv-tri{stroke:var(--green-d)}
.wt{font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.panel-foot{display:flex;justify-content:flex-end;margin-top:6px}
button{font:inherit;cursor:pointer;border:2px solid #b9e6b9;border-radius:999px;padding:10px 20px;background:var(--green-s);font-weight:800;color:#2f6f37}
button:active{transform:translateY(1px)}
/* 支点の左右の矢印: 触るまでゆらゆら動いて「動かせる」ことを伝える */
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.ar-r{animation:nudge 1.6s ease-in-out infinite}
.ar-l{animation:nudgeL 1.6s ease-in-out infinite}
.moved .ar-r,.moved .ar-l{display:none}
@media(max-width:760px){main{padding:12px}.question{margin:12px 0;padding:18px 16px}.panel{padding:10px}.hint{font-size:11px}.diagram{max-height:440px}}
@media(orientation:landscape) and (max-height:760px){.question{margin:10px 0 8px;padding:16px 20px}.panel{padding:8px 18px}.diagram{max-height:400px}}
@media(prefers-reduced-motion:reduce){.ar-r,.ar-l{animation:none}}
</style></head><body><main><div class="head"><a class="back" href="../">← TOP</a><h1>天秤図の部屋</h1><span class="ver">v0.2</span></div>
<div class="question"><small>問題 03｜食塩水を混ぜる</small><br>4％の食塩水100gに、10％の食塩水を加えたら6％になりました。何g加えた？</div>
<section class="panel"><div class="panel-head"><strong>支点を左右に動かしてみよう</strong><span class="hint"><b>▲</b> を指でドラッグ</span></div>
<svg class="diagram" id="diagram" viewBox="0 36 1100 500" role="img" aria-label="4パーセントと10パーセントの食塩水を混ぜる天秤図。支点を左右に動かせます">
  <!-- うで（支点の左右で色分け） -->
  <line id="beamL" x1="210" y1="151" x2="437" y2="151" stroke="#add8e6" stroke-width="12" stroke-linecap="round"/>
  <line id="beamR" x1="437" y1="151" x2="890" y2="151" stroke="#ffd1dc" stroke-width="12" stroke-linecap="round"/>
  <!-- 始点・終点の濃度（支点と同じふきだし） -->
  <g id="endL">
    <rect x="-48" y="48" width="96" height="44" rx="22" fill="#e9f5f9" stroke="#add8e6" stroke-width="2"/>
    <text y="70" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#3f7f93">4％</text>
  </g>
  <path id="tailL" d="" fill="#e9f5f9" stroke="#add8e6" stroke-width="2" stroke-linejoin="round"/>
  <g id="endR">
    <rect x="-56" y="48" width="112" height="44" rx="22" fill="#fff0f4" stroke="#ffd1dc" stroke-width="2"/>
    <text y="70" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#b5607a">10％</text>
  </g>
  <path id="tailR" d="" fill="#fff0f4" stroke="#ffd1dc" stroke-width="2" stroke-linejoin="round"/>
  <!-- 濃度の差（うでの上） -->
  <g id="gapLG" style="transition:opacity .15s" transform="translate(320,0)">
    <rect x="-42" y="106" width="84" height="32" rx="16" fill="#e9f5f9"/>
    <text id="leftGap" y="122" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="800" fill="#3f7f93">差 2</text>
  </g>
  <g id="gapRG" style="transition:opacity .15s" transform="translate(660,0)">
    <rect x="-42" y="106" width="84" height="32" rx="16" fill="#fff0f4"/>
    <text id="rightGap" y="122" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="800" fill="#b5607a">差 4</text>
  </g>
  <!-- 濃度の差の比（うでの下） -->
  <g id="ratLG" transform="translate(320,0)">
    <circle cy="196" r="28" fill="#fff" stroke="#7fb8ca" stroke-width="3.5"/>
    <text id="ratL" y="197" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="800" fill="#3f7f93">1</text>
  </g>
  <g id="ratRG" transform="translate(660,0)">
    <circle cy="196" r="28" fill="#fff" stroke="#e9a3b6" stroke-width="3.5"/>
    <text id="ratR" y="197" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="800" fill="#b5607a">2</text>
  </g>
  <!-- おもり（JSで描く） -->
  <g id="weights"></g>
  <!-- 支点 -->
  <g id="pivot" class="pivot-hit" tabindex="0" role="slider" aria-label="混合後の濃度を決める支点" aria-valuemin="4.5" aria-valuemax="8.5" aria-valuenow="6" aria-valuetext="6パーセント" transform="translate(437,0)">
    <rect x="-56" y="44" width="112" height="200" fill="transparent"/>
    <path class="pv-tri" d="M0 161 L-22 203 L22 203 Z" fill="#90ee90" stroke="#90ee90" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="0" cy="151" r="11" fill="#5cbf5c" stroke="#fff" stroke-width="3"/>
    <g fill="#8fcf8f" font-size="26" font-weight="800" text-anchor="middle">
      <text class="ar-l" x="-42" y="194">‹</text><text class="ar-r" x="42" y="194">›</text>
    </g>
    <g id="pvBubble">
      <rect x="-60" y="48" width="120" height="44" rx="22" fill="#90ee90"/>
      <text id="pivotLabel" y="70" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#25642c">6.0％</text>
    </g>
    <path d="M-9 90 L0 101 L9 90 Z" fill="#90ee90"/>
  </g>
</svg>
<div class="panel-foot"><button id="reset">6％に戻す</button></div></section>
</main><script>
(()=>{
const $=id=>document.getElementById(id), svg=$('diagram');
const x0=210,x1=890,min=4,max=10,leftMass=100,leftSide=130,TOP=272;
let conc=6,dragging=false;
const fmt=n=>Number(n.toFixed(1)).toString();
const C={l:{fill:'#add8e6',stroke:'#7fb8ca',ink:'#3f7f93',name:'4％の食塩水'},r:{fill:'#ffd1dc',stroke:'#e9a3b6',ink:'#b5607a',name:'10％の食塩水'}};
/* おもり: ひも＋つり輪＋角丸の箱（面積が重さに比例）＋つや＋名前 */
/* 比を整数にそろえる（0.1きざみ） */
const gcd=(a,b)=>b?gcd(b,a%b):a;
function ratio(a,b){a=Math.round(a*10);b=Math.round(b*10);const g=gcd(a,b)||1;return [a/g,b/g];}
const rfs=n=>String(n).length>1?26:32;
/* 重さの比: おもりの外側（左のおもりは左、右のおもりは右）に置く */
function wRatio(cx,cy,n,c){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="28" fill="'+c.fill+'" stroke="'+c.stroke+'" stroke-width="3.5"/>'+
    '<text x="'+cx+'" y="'+(cy+1)+'" text-anchor="middle" dominant-baseline="central" font-size="'+rfs(n)+'" font-weight="800" fill="'+c.ink+'">'+n+'</text>';
}
function weight(cx,side,mass,c){
  const x=cx-side/2,r=Math.min(18,side/5),fs=Math.max(16,Math.min(30,side*.3));
  return '<line x1="'+cx+'" y1="157" x2="'+cx+'" y2="'+(TOP-16)+'" stroke="#c9c3b8" stroke-width="3" stroke-linecap="round"/>'+
    '<circle cx="'+cx+'" cy="'+(TOP-9)+'" r="8" fill="none" stroke="'+c.stroke+'" stroke-width="4"/>'+
    '<rect x="'+x+'" y="'+TOP+'" width="'+side+'" height="'+side+'" rx="'+r+'" fill="'+c.fill+'" stroke="'+c.stroke+'" stroke-width="3"/>'+
    '<rect x="'+(x+Math.max(6,side*.1))+'" y="'+(TOP+Math.max(5,side*.08))+'" width="'+(side*.32)+'" height="'+Math.max(4,side*.06)+'" rx="3" fill="#fff" opacity=".7"/>'+
    '<text class="wt" x="'+cx+'" y="'+(TOP+side/2+2)+'" font-size="'+fs+'">'+fmt(mass)+'g</text>'+
    '<text x="'+cx+'" y="'+(TOP+side+30)+'" text-anchor="middle" font-size="19" font-weight="700" fill="'+c.ink+'">'+c.name+'</text>';
}
function setConcentration(n){
  conc=Math.max(4.5,Math.min(8.5,Math.round(n*10)/10));
  const x=x0+(conc-min)/(max-min)*(x1-x0);
  const rightMass=leftMass*(conc-min)/(max-conc);
  const side=leftSide*Math.sqrt(rightMass/leftMass);
  const d=ratio(conc-min,max-conc);          // 濃度の差の比（左：右）
  const w=[d[1],d[0]];                        // 重さの比は逆（左：右）
  $('weights').innerHTML=weight(x0,leftSide,leftMass,C.l)+weight(x1,side,rightMass,C.r)+
    wRatio(x0-leftSide/2-44,TOP+leftSide/2,w[0],C.l)+wRatio(x1+side/2+44,TOP+side/2,w[1],C.r);
  $('ratL').textContent=d[0];$('ratR').textContent=d[1];
  $('ratL').setAttribute('font-size',rfs(d[0]));$('ratR').setAttribute('font-size',rfs(d[1]));
  /* 差の比の丸: ふだんは区間のまん中。支点や糸に近すぎるときは外側へよける */
  let rl=(x0+x)/2,rr=(x+x1)/2;
  if(x-rl<56)rl=x-56; if(rl-x0<34)rl=x0-36;
  if(rr-x<56)rr=x+56; if(x1-rr<34)rr=x1+36;
  $('ratLG').setAttribute('transform','translate('+rl+',0)');
  $('ratRG').setAttribute('transform','translate('+rr+',0)');
  /* 始点・終点のふきだし: 支点のふきだしと重なるときは、両方を少しずつ外へずらす */
  let eL=x0,eR=x1,pv=0;
  const ovL=(x0+48+8)-(x-60); if(ovL>0){const s=Math.min(ovL,32);eL-=s;pv+=ovL-s;}
  const ovR=(x+60+8)-(x1-56); if(ovR>0){const s=Math.min(ovR,38);eR+=s;pv-=ovR-s;}
  $('endL').setAttribute('transform','translate('+eL+',0)');
  $('endR').setAttribute('transform','translate('+eR+',0)');
  $('tailL').setAttribute('d','M'+(x0-9)+' 91 L'+x0+' 101 L'+(x0+9)+' 91');
  $('tailR').setAttribute('d','M'+(x1-9)+' 91 L'+x1+' 101 L'+(x1+9)+' 91');
  $('pvBubble').setAttribute('transform','translate('+pv+',0)');
  $('beamL').setAttribute('x2',x);$('beamR').setAttribute('x1',x);
  $('pivot').setAttribute('transform','translate('+x+',0)');
  $('gapLG').setAttribute('transform','translate('+(x0+x)/2+',0)');
  $('gapRG').setAttribute('transform','translate('+(x+x1)/2+',0)');
  /* 区間が短すぎて支点と重なるときは「差」を隠す */
  $('gapLG').style.opacity=(x-x0)<124?0:1;$('gapRG').style.opacity=(x1-x)<124?0:1;
  $('leftGap').textContent='差 '+fmt(conc-min);$('rightGap').textContent='差 '+fmt(max-conc);
  $('pivot').setAttribute('aria-valuenow',fmt(conc));$('pivot').setAttribute('aria-valuetext',fmt(conc)+'パーセント');
  $('pivotLabel').textContent=conc.toFixed(1)+'％';
}
function positionFromEvent(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();if(!m)return conc;const local=p.matrixTransform(m.inverse());return min+(local.x-x0)/(x1-x0)*(max-min);}
const moved=()=>svg.classList.add('moved');
$('pivot').addEventListener('pointerdown',e=>{dragging=true;moved();$('pivot').setPointerCapture(e.pointerId);setConcentration(positionFromEvent(e));e.preventDefault();});
$('pivot').addEventListener('pointermove',e=>{if(dragging)setConcentration(positionFromEvent(e));});
$('pivot').addEventListener('pointerup',()=>dragging=false);$('pivot').addEventListener('pointercancel',()=>dragging=false);
$('pivot').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowDown'){moved();setConcentration(conc-.1);e.preventDefault();}if(e.key==='ArrowRight'||e.key==='ArrowUp'){moved();setConcentration(conc+.1);e.preventDefault();}});
$('reset').addEventListener('click',()=>setConcentration(6));setConcentration(6);
})();
</script></body></html>
