<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>流水算の部屋｜miss maths</title>

<style>
*{box-sizing:border-box}
:root{--bg:#f7f5ef;--ink:#2f3437;--ink2:#7b766d;--card:#fff;--edge:#ebe5da;--green-d:#3f9b4a;--green-s:#ebfbea}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Hiragino Maru Gothic ProN','M PLUS Rounded 1c',-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:1200px;margin:0 auto;padding:15px 28px 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.question{margin:0 0 10px;background:var(--card);border:2px solid var(--edge);border-radius:22px;padding:20px 26px;line-height:1.7;font-size:clamp(17px,2vw,21px);font-weight:800}
.question small{display:inline-block;font-size:13px;color:var(--green-d);background:var(--green-s);border-radius:999px;padding:2px 12px;font-weight:800}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}

button:active{transform:translateY(1px)}

.tabs button.done{background:#f3f0e8;color:#9a9488;border-color:#e2dccf}
.tabs button.done::after{content:"✓";font-size:10px;vertical-align:super;margin-left:1px;color:var(--green-d)}
.tabs button[aria-pressed="true"]{background:var(--green-s);border-color:#9fd99f;color:#2f6f37}
.panel{background:var(--card);border:2px solid var(--edge);border-radius:26px;padding:12px 22px 12px}

.first .q1{font-size:18px;font-weight:800}
.first .opts{display:flex;gap:10px}

@media(prefers-reduced-motion:reduce){.successMark{animation:none;opacity:0}}

.first.ok{background:var(--green-s)}
.first.ok .q1{color:#25642c}
.first .shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

" y="298" text-anchor="start" dominant-baseline="central" font-size="26" font-weight="800" fill="#5b3fb8">上り＝引く</text><line x1="330" y1="348" x2="150.0" y2="348" stroke="#e8a24f" stroke-width="7" stroke-linecap="round"/><path d="M138.0 348 L154.8 337 L154.8 359 Z" fill="#e8a24f"/><text x="234.0" y="330" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#b8741f">静水時 80m</text><line x1="138.0" y1="366" x2="174.0" y2="366" stroke="#3d9cc2" stroke-width="7" stroke-linecap="round"/><path d="M186.0 366 L169.2 355 L169.2 377 Z" fill="#3d9cc2"/><text x="194.0" y="366" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="800" fill="#3d9cc2">流れ 20m</text><line x1="330" y1="400" x2="198.0" y2="400" stroke="#3f9b4a" stroke-width="7" stroke-linecap="round"/><path d="M186.0 400 L202.8 389 L202.8 411 Z" fill="#3f9b4a"/><text x="176.0" y="400" text-anchor="end" dominant-baseline="central" font-size="19" font-weight="800" fill="#25642c">60m</text><rect x="44" y="430" width="322" height="36" rx="18" fill="#fff"/><text x="205" y="448" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#2f3437">上りの速さ ＝ 静水時 － 流れ</text><rect x="420" y="20" width="660" height="222" rx="22" fill="#fff" stroke="#e2dccf" stroke-width="3"/><path d="M421.5 56 V40 a18.5 18.5 0 0 1 18.5 -18.5 H1060 a18.5 18.5 0 0 1 18.5 18.5 V56 Z" fill="#f3f0e8"/><text x="444" y="39" text-anchor="start" dominant-baseline="central" font-size="18" font-weight="800" fill="#5a554c">ことば</text><text x="450" y="89" text-anchor="start" dominant-baseline="central" font-size="19" font-weight="800" fill="#b8741f">静水時の速さ</text><text x="690" y="89" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#2f3437">流れのない所での、船の速さ</text><line x1="440" y1="120" x2="1060" y2="120" stroke="#eee8dc" stroke-width="2"/><text x="450" y="151" text-anchor="start" dominant-baseline="central" font-size="19" font-weight="800" fill="#3d9cc2">流れの速さ</text><text x="690" y="151" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#2f3437">川の水が、1分間に流れる道のり</text><line x1="440" y1="182" x2="1060" y2="182" stroke="#eee8dc" stroke-width="2"/><text x="450" y="213" text-anchor="start" dominant-baseline="central" font-size="19" font-weight="800" fill="#3f9b4a">下りの速さ・上りの速さ</text><text x="690" y="213" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="700" fill="#2f3437">船が、本当に1分間に進む道のり</text><rect x="420" y="258" width="660" height="222" rx="22" fill="#fff" stroke="#e2dccf" stroke-width="3"/><path d="M421.5 294 V278 a18.5 18.5 0 0 1 18.5 -18.5 H1060 a18.5 18.5 0 0 1 18.5 18.5 V294 Z" fill="#f3f0e8"/><text x="444" y="277" text-anchor="start" dominant-baseline="central" font-size="18" font-weight="800" fill="#5a554c">逆に：下りと上りから求める</text><text x="524" y="318" text-anchor="end" dominant-baseline="central" font-size="16" font-weight="800" fill="#25642c">下り 100</text><rect x="540" y="305" width="208.0" height="26" rx="5" fill="#fff1dc" stroke="#e8a24f" stroke-width="2.5"/><text x="644.0" y="319" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="800" fill="#b8741f">静水時</text><rect x="748.0" y="305" width="52.0" height="26" rx="5" fill="#d7eef6" stroke="#3d9cc2" stroke-width="2.5"/><text x="774.0" y="319" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="800" fill="#3d9cc2">流れ</text><text x="524" y="362" text-anchor="end" dominant-baseline="central" font-size="16" font-weight="800" fill="#25642c">上り 60</text><rect x="540" y="349" width="156.0" height="26" rx="5" fill="#fff1dc" stroke="#e8a24f" stroke-width="2.5"/><text x="618.0" y="363" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="800" fill="#b8741f">静水時－流れ</text><rect x="696.0" y="349" width="52.0" height="26" rx="5" fill="#fff" stroke="#3d9cc2" stroke-width="2.5" stroke-dasharray="5 4"/><text x="722.0" y="363" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="800" fill="#3d9cc2">流れ</text><path d="M696.0 384 V392 H800.0 V296" fill="none" stroke="#3d9cc2" stroke-width="0"/><line x1="696.0" y1="386" x2="800.0" y2="386" stroke="#3d9cc2" stroke-width="3"/><line x1="696.0" y1="378" x2="696.0" y2="394" stroke="#3d9cc2" stroke-width="3"/><line x1="800.0" y1="378" x2="800.0" y2="394" stroke="#3d9cc2" stroke-width="3"/><text x="812.0" y="386" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="800" fill="#3d9cc2">差 40 ＝ 流れ×2</text><line x1="800.0" y1="331" x2="800.0" y2="378" stroke="#3d9cc2" stroke-width="2" stroke-dasharray="3 4"/><rect x="444" y="408" width="612" height="56" rx="16" fill="#f7f5ef"/><text x="595" y="436" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#b8741f">静水時 ＝ (下り＋上り)÷2</text><text x="905" y="436" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#3d9cc2">流れ ＝ (下り－上り)÷2</text></svg>

<script>
(()=>{
const $=id=>document.getElementById(id), svg=$('diagram');
/* ===== 問題 =====
   dir 'down' … 下り → 船の速さ ＝ 静水時の速さ ＋ 流れの速さ
   dir 'up'   … 上り → 船の速さ ＝ 静水時の速さ － 流れの速さ
   s … 静水時の速さ　c … 流れの速さ（分速m）　d … 進む道のり（m）
   川は左が上流、右が下流。A＝上流の地点、B＝下流の地点 */
const PROBLEMS=[
  {dir:'down',s:80,c:20,d:2000,text:'流れの速さが分速20mの川を、静水時の速さが分速80mの船が、A地点から2000m下流のB地点まで下ります。何分かかりますか？'},
  {dir:'up',s:80,c:20,d:1200,text:'流れの速さが分速20mの川を、静水時の速さが分速80mの船が、B地点から1200m上流のA地点まで上ります。何分かかりますか？'},
  {dir:'down',s:70,c:30,d:1500,text:'流れの速さが分速30mの川を、静水時の速さが分速70mの船が、A地点から1500m下流のB地点まで下ります。何分かかりますか？'},
  {dir:'up',s:70,c:30,d:1200,text:'流れの速さが分速30mの川を、静水時の速さが分速70mの船が、B地点から1200m上流のA地点まで上ります。何分かかりますか？'},
  {dir:'down',s:90,c:15,d:2100,text:'静水時の速さが分速90mの船で、流れの速さが分速15mの川を2100m下ります。何分かかりますか？'},
  {dir:'up',s:90,c:15,d:1500,text:'静水時の速さが分速90mの船で、流れの速さが分速15mの川を1500m上ります。何分かかりますか？'},
  /* 逆算: 下りの速さ D と上りの速さ U から、静水時（ask:'s'）か流れ（ask:'c'）を求める
     下り＋上り＝静水時×2　下り－上り＝流れ×2 */
  {dir:'rev',ask:'c',D:100,U:60,text:'ある船の下りの速さは分速100m、上りの速さは分速60mです。川の流れの速さは分速何mですか？'},
  {dir:'rev',ask:'s',D:100,U:60,text:'ある船の下りの速さは分速100m、上りの速さは分速60mです。この船の静水時の速さは分速何mですか？'},
  {dir:'rev',ask:'s',D:120,U:80,d:2400,td:20,tu:30,text:'ある船が、2400mの川を下るのに20分、上るのに30分かかりました。この船の静水時の速さは分速何mですか？'},
  {dir:'rev',ask:'c',D:150,U:100,d:1800,td:12,tu:18,text:'ある船が、1800mの川を下るのに12分、上るのに18分かかりました。川の流れの速さは分速何mですか？'}
];
let idx=0,P=PROBLEMS[0],t=0,picked=false,drag=false;
let done={};try{done=JSON.parse(localStorage.getItem('ryusui-done')||'{}')||{};}catch(e){done={};}
const saveDone=()=>{try{localStorage.setItem('ryusui-done',JSON.stringify(done));}catch(e){}};
const down=()=>P.dir==='down';
const v=()=>down()?P.s+P.c:P.s-P.c;          // 船が1分で進む道のり
const rev=()=>P.dir==='rev';
const ans=()=>rev()?(P.ask==='s'?(P.D+P.U)/2:(P.D-P.U)/2):P.d/v();
const tmax=()=>rev()?P.D:Math.ceil(ans()*1.5);
const tstep=()=>rev()?5:1;
const solved=()=>picked&&Math.abs(t-ans())<1e-9;
const fmt=n=>Number(n.toFixed(2)).toString();

const X0=80,X1=1020,RT=165,RB=218;   // 川のはし・水面・川底
const txt=(x,y,s,o={})=>'<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'middle')+'" dominant-baseline="central" font-size="'+(o.fs||20)+'" font-weight="'+(o.fw||800)+'" fill="'+(o.c||'#2f3437')+'">'+s+'</text>';
const tw=(s,fs)=>{let w=0;for(const ch of String(s))w+=/[ -~]/.test(ch)?0.6:1;return w*fs;};
function dim(xa,xb,y,s,col,fs){
  fs=fs||20;const w=tw(s,fs)+16;
  if(xb-xa<4)return '';
  return '<line x1="'+xa+'" y1="'+y+'" x2="'+xb+'" y2="'+y+'" stroke="'+col+'" stroke-width="3"/>'+
    '<line x1="'+xa+'" y1="'+(y-9)+'" x2="'+xa+'" y2="'+(y+9)+'" stroke="'+col+'" stroke-width="3"/><line x1="'+xb+'" y1="'+(y-9)+'" x2="'+xb+'" y2="'+(y+9)+'" stroke="'+col+'" stroke-width="3"/>'+
    '<rect x="'+((xa+xb)/2-w/2)+'" y="'+(y-15)+'" width="'+w+'" height="30" rx="8" fill="#fff"/>'+txt((xa+xb)/2,y+1,s,{fs,c:col});
}
/* 矢印（x1→x2） */
function arrow(x1,x2,y,col,w,lab,lc){
  const d=x2>x1?1:-1,hl=13;if(Math.abs(x2-x1)<2)return '';
  let h='<line x1="'+x1+'" y1="'+y+'" x2="'+(x2-d*hl)+'" y2="'+y+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/>'+
    '<path d="M'+x2+' '+y+' L'+(x2-d*hl*1.4)+' '+(y-w-4)+' L'+(x2-d*hl*1.4)+' '+(y+w+4)+' Z" fill="'+col+'"/>';
  if(lab)h+=txt((x1+x2)/2,y-w/2-13,lab,{fs:15,c:lc||col});
  return h;
}
const BOAT='#e8a24f',BOAT_D='#b8741f',BOAT_S='#fff1dc',WATER='#3d9cc2';
/* 船: dir=1 右向き */
function boat(x,y,dir,big){
  const k=big?1.22:1;
  return '<g transform="translate('+x+','+y+') scale('+(dir*k)+','+k+')">'+
    '<rect x="-18" y="-34" width="28" height="22" rx="6" fill="'+(big?'#c9b8ec':BOAT_S)+'" stroke="'+(big?'#7b62c4':BOAT_D)+'" stroke-width="3"/>'+
    '<path d="M-34 -12 H26 Q44 -12 38 -2 L30 8 H-28 Z" fill="#fff" stroke="'+(big?'#7b62c4':BOAT_D)+'" stroke-width="3" stroke-linejoin="round"/></g>';
}
/* 川（問題ごとに1回だけ描く。流れの線はずっと動く） */
function drawRiver(){
  let h='<rect x="'+(X0-20)+'" y="'+RT+'" width="'+(X1-X0+40)+'" height="'+(RB-RT)+'" rx="10" fill="#dcf0f7"/>';
  h+='<line x1="'+(X0-20)+'" y1="'+(RB+1)+'" x2="'+(X1+20)+'" y2="'+(RB+1)+'" stroke="#b7dbe7" stroke-width="3"/>';
  for(const [y,off] of [[RT+14,0],[RT+30,20],[RT+44,8]])
    h+='<line class="flow" x1="'+(X0-10)+'" y1="'+y+'" x2="'+(X1+10)+'" y2="'+y+'" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 26" stroke-dashoffset="'+off+'" opacity=".9"/>';
  h+=txt(X0-28,(RT+RB)/2,'上流',{a:'end',fs:15,c:'#7b766d'})+txt(X1+28,(RT+RB)/2,'下流',{a:'start',fs:15,c:'#7b766d'});
  $('river').innerHTML=h;
}
function draw(){
  if(rev()){$('art').innerHTML=drawRev()+drawSlider(tmax());return;}
  const T=tmax(),V=v(),L=V*T,k=(X1-X0)/L,ok=solved(),dn=down();
  // 地点: 下りは左から右へ、上りは右から左へ
  const sx=dn?X0:X1, gx=dn?X0+P.d*k:X1-P.d*k, bx=dn?X0+V*t*k:X1-V*t*k;
  let h='';
  // 流れの矢印（川の中）
  h+=arrow(120,250,RB-15,WATER,4)+txt(260,RB-15,'流れ 分速'+P.c+'m',{a:'start',fs:15,c:WATER});
  // 出発と到着の印
  const post=(x,lab,col)=>'<line x1="'+x+'" y1="'+(RT-10)+'" x2="'+x+'" y2="'+(RB+8)+'" stroke="'+col+'" stroke-width="3"/>'+txt(x,RB+22,lab,{fs:17,c:col});
  h+=post(sx,dn?'A':'B','#9a9184');
  h+=post(gx,dn?'B':'A',ok?'#3f9b4a':'#9a5a12');
  // 進んだ道のり（帯）と1分ごとの点
  const BY=RB+44;
  if(t>0){
    h+='<line x1="'+sx+'" y1="'+BY+'" x2="'+bx+'" y2="'+BY+'" stroke="#ffe2b8" stroke-width="10" stroke-linecap="round"/>';
    for(let i=1;i<=Math.floor(t+1e-9);i++)h+='<circle cx="'+(dn?X0+V*i*k:X1-V*i*k)+'" cy="'+BY+'" r="3" fill="'+BOAT+'"/>';
  }
  h+=dim(Math.min(sx,gx),Math.max(sx,gx),RB+76,(dn?'AからB':'BからA')+'まで '+P.d+'m','#7b766d',16);
  // のこり（いちばん大事な量）
  const rem=P.d-V*t,arr=Math.abs(rem)<1e-9;
  if(arr)h+='<rect x="'+(gx-80)+'" y="'+(RT-73)+'" width="160" height="40" rx="20" fill="#90ee90"/>'+txt(gx,RT-52,'着いた！',{fs:22,c:'#25642c'});
  else if(rem>0)h+=dim(Math.min(bx,gx),Math.max(bx,gx),RT-53,'のこり '+rem+'m','#9a5a12',22);
  else h+=dim(Math.min(bx,gx),Math.max(bx,gx),RT-53,'通りすぎ '+(-rem)+'m','#7b766d',18);
  h+=boat(bx,RT+2,dn?1:-1,arr);
  // 1分間に進む道のり（矢印の足し算・引き算）
  h+=drawCompose();
  h+=drawSlider(T);
  $('art').innerHTML=h;
}
/* 逆算: 線分図。つまみで求める速さを動かし、上りをぴったり合わせる */
function drawRev(){
  const D=P.D,U=P.U,k=600/D,bx=270,yd=80,yu=185,bh=34;
  const sv=P.ask==='s'?t:D-t, cv=D-sv, up=sv-cv, ok=solved();
  const bar=(x,y,w,fill,st,lab,lc,dash)=>w<=0.5?'':'<rect x="'+x+'" y="'+(y-bh/2)+'" width="'+w+'" height="'+bh+'" rx="6" fill="'+fill+'" stroke="'+st+'" stroke-width="2.5"'+(dash?' stroke-dasharray="6 5"':'')+'/>'+(w>46&&lab?txt(x+w/2,y+1,lab,{fs:15,c:lc}):'');
  let h='';
  h+=txt(bx-18,yd-10,'下りの速さ',{a:'end',fs:15,c:'#7b766d'})+txt(bx-18,yd+14,'分速'+D+'m',{a:'end',fs:20,c:'#25642c'});
  h+=txt(bx-18,yu-10,'上りの速さ',{a:'end',fs:15,c:'#7b766d'})+txt(bx-18,yu+14,'分速'+U+'m',{a:'end',fs:20,c:'#25642c'});
  // 下り＝静水時＋流れ
  h+=bar(bx,yd,sv*k,BOAT_S,BOAT,'静水時 '+sv,BOAT_D)+bar(bx+sv*k,yd,cv*k,'#d7eef6',WATER,'流れ '+cv,WATER);
  // 上り＝静水時－流れ（流れの分は点線でぬける）
  if(up>0)h+=bar(bx,yu,up*k,BOAT_S,BOAT,'静水時－流れ',BOAT_D);
  if(up>0)h+=bar(bx+up*k,yu,cv*k,'#fff',WATER,'流れ',WATER,1);
  else h+=txt(bx+8,yu,'流れが静水時より速いと、上れない',{a:'start',fs:15,c:'#9a9184'});
  // 上りの速さ（めあて）
  const ux=bx+U*k;
  h+='<line x1="'+ux+'" y1="'+(yu-bh/2-14)+'" x2="'+ux+'" y2="'+(yu+bh/2+14)+'" stroke="#3f9b4a" stroke-width="4" stroke-dasharray="'+(ok?'0':'7 5')+'"/>';
  h+=txt(ux,yu+bh/2+30,'上り '+U+'m',{fs:15,c:'#25642c'});
  // ずれ（いちばん大事な量）
  const gap=up-U;
  if(ok){
    const xa=bx+U*k,xb=bx+D*k,y=yu-bh/2-26;
    h+='<line x1="'+xb+'" y1="'+(yd+bh/2)+'" x2="'+xb+'" y2="'+y+'" stroke="'+WATER+'" stroke-width="2" stroke-dasharray="3 4"/>';
    h+=dim(xa,xb,y,'差 '+(D-U)+' ＝ 流れ×2',WATER,16);
    h+='<rect x="'+(bx+D*k+30)+'" y="'+(yd-20)+'" width="170" height="40" rx="20" fill="#90ee90"/>'+txt(bx+D*k+115,yd+1,'ぴったり！',{fs:21,c:'#25642c'});
  }else if(up>0)h+=dim(Math.min(bx+up*k,ux),Math.max(bx+up*k,ux),yu+bh/2+62,'ずれ '+Math.abs(gap)+'m','#9a5a12',20);
  return h;
}
/* 船の力（静水時）と流れを、矢印でつなぐ */
function drawCompose(){
  const S=P.s,C=P.c,k=Math.min(3,330/(S+C)),dn=down();
  const y1=30,y2=70;let h='';
  h+=txt(X0-20,y2,'1分間に進む',{a:'start',fs:15,c:'#7b766d'});
  if(dn){
    const x0=330;
    h+=arrow(x0,x0+S*k,y1,BOAT,7,'静水時 '+S+'m',BOAT_D);
    h+=arrow(x0+S*k,x0+(S+C)*k,y1,WATER,7,'流れ '+C+'m');
    h+=picked?arrow(x0,x0+(S+C)*k,y2,'#3f9b4a',7)+txt(x0+(S+C)*k+14,y2,'下りの速さ '+(S+C)+'m',{a:'start',fs:17,c:'#25642c'})
             :txt(x0+(S+C)*k/2,y2,'？m',{fs:20,c:'#9a9184'});
  }else{
    const x0=760;
    h+=arrow(x0,x0-S*k,y1,BOAT,7,'静水時 '+S+'m',BOAT_D);
    h+=arrow(x0-S*k,x0-S*k+C*k,y1+15,WATER,7,'');
    h+=txt(x0-S*k+C*k+12,y1+15,'流れ '+C+'m',{a:'start',fs:15,c:WATER});
    h+=picked?arrow(x0,x0-(S-C)*k,y2,'#3f9b4a',7)+txt(x0-(S-C)*k-14,y2,'上りの速さ '+(S-C)+'m',{a:'end',fs:17,c:'#25642c'})
             :txt(x0-(S-C)*k/2,y2,'？m',{fs:20,c:'#9a9184'});
  }
  return h;
}
function drawSlider(T){
  let h='';
  // 時間のつまみ
  const TX0=160,TX1=940,TY=370,tx=TX0+(TX1-TX0)*t/T;
  h+=txt(TX0-20,TY,(rev()?(P.ask==='s'?'静水時':'流れ'):'時間'),{a:'end',fs:18,c:'#7b766d'});
  h+='<line x1="'+TX0+'" y1="'+TY+'" x2="'+TX1+'" y2="'+TY+'" stroke="#e2dccf" stroke-width="10" stroke-linecap="round"/>';
  h+='<line x1="'+TX0+'" y1="'+TY+'" x2="'+tx+'" y2="'+TY+'" stroke="#90ee90" stroke-width="10" stroke-linecap="round"/>';
  for(let i=0;i<=T;i+=tstep()){const x=TX0+(TX1-TX0)*i/T;h+='<line x1="'+x+'" y1="'+(TY+10)+'" x2="'+x+'" y2="'+(TY+16)+'" stroke="#c9c3b8" stroke-width="2"/>';}
  h+='<g class="thandle" id="th"><rect x="'+(tx-40)+'" y="'+(TY-30)+'" width="80" height="60" fill="transparent"/>'+
    '<circle cx="'+tx+'" cy="'+TY+'" r="18" fill="#fff" stroke="#3f9b4a" stroke-width="4"/>'+txt(tx,TY+1,'↔',{fs:18,c:'#3f9b4a'})+'</g>';
  const lb=rev()?'分速'+t+'m':fmt(t)+'分後',lw=tw(lb,19)+28;h+='<rect x="'+(tx-lw/2)+'" y="'+(TY-64)+'" width="'+lw+'" height="34" rx="17" fill="#90ee90"/>'+txt(tx,TY-46,lb,{fs:19,c:'#25642c'});
  return h;
}

/* ===== 効果音（Web Audio） ===== */
let actx=null;
function audio(){
  try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC();}
  if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}
}
// tone(周波数Hz, 長さ秒, 波形, 音量, 開始の遅れ秒)
function tone(f,d,type,vol,delay){
  const c=audio();if(!c)return;
  type=type||'sine';vol=vol==null?.035:vol;delay=delay||0;
  const t0=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02);
}
// 初動の正解音（ピンポン）
const firstSound=()=>{tone(590,.10);tone(790,.13,'sine',.035,.08);};
// 出会った／追いついたときの音（ドミソド↑）
const meetSound=()=>{tone(523,.12,'sine',.034);tone(659,.12,'sine',.034,.09);tone(784,.14,'sine',.034,.18);tone(1047,.32,'sine',.038,.27);tone(1568,.30,'triangle',.012,.27);};
// iPad: 最初のタッチで音を使えるようにする
document.addEventListener('touchstart',function un(){audio();document.removeEventListener('touchstart',un);},{passive:true});
function celebrate(){const el=document.createElement('div');el.className='successMark';el.textContent='○';el.setAttribute('aria-hidden','true');document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());}
function renderFirst(){
  const S=P.s,C=P.c,el=$('first');
  el.classList.toggle('ok',picked);
  if(rev()){
    const pre=P.d?'下り '+P.d+'÷'+P.td+'＝'+P.D+'m、上り '+P.d+'÷'+P.tu+'＝'+P.U+'m。 ':'';
    if(picked){
      $('q1').textContent=P.ask==='s'?'下り＋上り '+P.D+'＋'+P.U+'＝'+(P.D+P.U)+'m は、静水時 2つ分':'下り－上り '+P.D+'－'+P.U+'＝'+(P.D-P.U)+'m は、流れ 2つ分';
      $('opts').innerHTML='';
      $('msg').textContent='つまみを動かして、上りをぴったり合わせよう';
    }else{
      $('q1').textContent=pre+'下りと上りを、どうする？';
      $('opts').innerHTML='<button data-op="add"><span class="no">①</span>'+P.D+'＋'+P.U+'＝'+(P.D+P.U)+'m</button><button data-op="sub"><span class="no">②</span>'+P.D+'－'+P.U+'＝'+(P.D-P.U)+'m</button>';
      $('msg').textContent='';
    }
    svg.classList.toggle('locked',!picked);return;
  }
  if(picked){
    $('q1').textContent=(down()?'下りの速さ ':'上りの速さ ')+(down()?S+'＋'+C:S+'－'+C)+'＝'+v()+'m（1分間）';
    $('opts').innerHTML='';
    $('msg').textContent='時間を進めて、のこりが0mになるところをさがそう';
  }else{
    $('q1').textContent='船は、1分間に何m進む？';
    $('opts').innerHTML='<button data-op="add"><span class="no">①</span>'+S+'＋'+C+'＝'+(S+C)+'m</button><button data-op="sub"><span class="no">②</span>'+S+'－'+C+'＝'+(S-C)+'m</button>';
    $('msg').textContent='';
  }
  svg.classList.toggle('locked',!picked);
}
$('opts').addEventListener('click',e=>{
  const b=e.target.closest('button[data-op]');if(!b)return;
  const right=(b.dataset.op==='add')===(rev()?P.ask==='s':down());
  if(right){picked=true;renderFirst();update();celebrate();firstSound();}
  else{
    b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    $('msg').textContent=rev()?(P.ask==='s'?'足すと、流れが消えて 静水時が2つ分になるよ':'引くと、静水時が消えて 流れが2つ分残るよ'):down()?'下りは、流れが船を押してくれるよ':'上りは、流れに押しもどされるよ';
  }
});
function updateCheck(){
  const el=$('check');
  if(!solved()){el.classList.remove('on');el.innerHTML='';$('nextq').hidden=true;return;}
  if(el.classList.contains('on'))return;
  if(!done[idx]){done[idx]=1;saveDone();renderTabs();}
  if(rev()){
    const nm=P.ask==='s'?'静水時の速さ':'流れの速さ',ex=P.ask==='s'?'('+P.D+'＋'+P.U+')÷2':'('+P.D+'－'+P.U+')÷2';
    el.innerHTML='<b>できた！ 答え '+nm+' 分速'+ans()+'m</b><span>'+ex+' ＝ '+ans()+'m</span>';el.classList.add('on');meetSound();
    $('nextq').hidden=idx>=PROBLEMS.length-1;return;
  }
  const op=down()?'('+P.s+'＋'+P.c+')':'('+P.s+'－'+P.c+')';
  el.innerHTML='<b>できた！ 答え '+fmt(ans())+'分</b><span>'+P.d+' ÷ '+op+' ＝ '+fmt(ans())+'分</span>';el.classList.add('on');meetSound();
  $('nextq').hidden=idx>=PROBLEMS.length-1;
}
function update(){draw();updateCheck();}
function setT(x){if(!picked)return;const st=tstep();t=Math.max(0,Math.min(tmax(),Math.round(x/st)*st));update();}
/* 時間のつまみをドラッグ */
function localPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):null;}
svg.addEventListener('pointerdown',e=>{
  if(!picked)return;
  const l=localPt(e);if(!l||l.y<305)return;
  drag=true;svg.setPointerCapture(e.pointerId);setT((l.x-160)/(940-160)*tmax());e.preventDefault();
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const l=localPt(e);if(l)setT((l.x-160)/(940-160)*tmax());});
const stop=()=>drag=false;svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
svg.setAttribute('tabindex','0');
svg.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){setT(t+tstep());e.preventDefault();}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){setT(t-tstep());e.preventDefault();}});
function renderTabs(){
  $('tabs').innerHTML='<button class="introb" id="introOpen">はじめに</button>'+PROBLEMS.map((q,j)=>'<button data-i="'+j+'" aria-pressed="'+(j===idx)+'"'+(done[j]?' class="done"':'')+'>'+(j+1)+'</button>').join('');
}
function load(i){
  idx=i;P=PROBLEMS[i];picked=false;t=rev()&&P.ask==='s'?P.D:0;  // 逆算は「流れ0」の状態から
  $('qTag').textContent='問題 '+String(i+1).padStart(2,'0')+'｜'+(rev()?(P.ask==='s'?'逆算｜静水時を求める':'逆算｜流れを求める'):down()?'下り':'上り');
  $('qText').textContent=P.text;
  renderTabs();renderFirst();if(rev())$('river').innerHTML='';else drawRiver();
  $('check').classList.remove('on');$('nextq').hidden=true;
  update();
}
$('reset').addEventListener('click',()=>load(idx));
$('nextq').addEventListener('click',()=>{if(idx<PROBLEMS.length-1)load(idx+1);});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)load(+b.dataset.i);});
$('clearRec').addEventListener('click',()=>{if(!confirm('この部屋の記録（クリアした問題の✓）を消して、はじめからにします。\nよろしいですか？'))return;done={};try{localStorage.removeItem('ryusui-done');}catch(e){}load(0);});
/* はじめに: 初回だけ自動で出す。2回目からは「はじめに」ボタンで開く */
const INTRO_KEY='mm-intro-ryusui';
let started=false;
function startRoom(){started=true;const hq=/^#q(\d+)$/.exec(location.hash);load(hq?Math.max(0,Math.min(PROBLEMS.length-1,+hq[1]-1)):0);}
function showIntro(){$('intro').hidden=false;$('roomMain').hidden=true;window.scrollTo(0,0);}
function hideIntro(){$('intro').hidden=true;$('roomMain').hidden=false;try{localStorage.setItem(INTRO_KEY,'1');}catch(e){}if(!started)startRoom();}
$('introGo').addEventListener('click',hideIntro);
$('tabs').addEventListener('click',e=>{if(e.target.closest('#introOpen'))showIntro();});
let seen=false;try{seen=localStorage.getItem(INTRO_KEY)==='1';}catch(e){}
if(seen||/^#q\d+$/.test(location.hash))startRoom();else showIntro();
})();
</script></body></html>
