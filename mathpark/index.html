<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>MATH⚡PARK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Fredoka:wght@600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: 明るい黄色のグラデーションの上に大きな白いパネル。分野ごとに色のちがう大きなカードを並べる。 */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --bg-top:#fff3df;
  --ink:#4a3438;
  --ink2:#8e7770;
  --line:#f1e6dc;
  --card:#ffffff;
  --soft:#fff8f0;
  --grid:#e6cdb8;
  --accent:#d0656d;
  --accent2:#ffa9a9;
  --btn:linear-gradient(135deg,#ffbdbd,#ffddb3);
  --accent-ink:#4a3438;
  --pen:#e0456f;
  --pen-soft:#ffe6e6;
  --miss:var(--ok);
  --ok:#14966a;
  --ok-soft:#e5f6ee;
  --c-f:#ffc9a3;--c-m:#bfeaa8;--c-n:#ffe48a;--c-u:#b3dcf5;--c-z:#d9c6f5;
  --ci-f:#3a2f45;--ci-m:#3a2f45;--ci-n:#3a2f45;--ci-u:#3a2f45;--ci-z:#3a2f45;
  --f-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","ヒラギノ角ゴ ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  --f-disp:var(--f-ui);
  --cs:clamp(40px,9.5vw,60px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 460px);
  background-repeat:no-repeat;
  color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #d0656d;outline-offset:2px}
#app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
small{font-size:12px;color:var(--ink2);letter-spacing:.04em}
h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}

/* マス目 */
.cells{display:flex;flex-wrap:wrap;padding:1px 0 0 1px}
.cell{
  width:var(--cs);height:var(--cs);display:grid;place-items:center;
  border:2px solid var(--grid);margin:0 -2px -2px 0;background:#fff;
  font-weight:700;font-size:calc(var(--cs)*.6);line-height:1;
}
.cell.blank{border:2.5px dashed var(--pen);background:var(--pen-soft);position:relative;z-index:1}
.cell.blank.filled{border-style:solid;color:var(--pen);animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}

/* ホーム: 見出し */
/* 見出し: 入試カウントは右上、タイトルは中央 */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.hrow{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hrow>*{pointer-events:auto}
.plaza{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 12px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--ink2);font-size:13px;font-weight:800;text-decoration:none;letter-spacing:.02em}
.plaza:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bwrap{position:static;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ver{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.04em;margin-right:8px}
.badge{display:inline-flex;align-items:baseline;gap:8px;background:#fff;border:2.5px solid #e6cdb8;color:#a8454d;font-weight:700;font-size:13px;border-radius:999px;padding:2px 16px}
.badge b{font-size:18px;color:var(--accent);font-weight:800}
.title{margin:0;font-family:'Trajan Pro','Trajan Pro 3',Trajan,'Cinzel','Times New Roman',Times,serif;font-size:clamp(28px,6vw,50px);font-weight:800;line-height:1.15;letter-spacing:.04em}
.lead{margin:0;font-weight:700;color:var(--ink2);font-size:clamp(13px,2.4vw,17px);letter-spacing:.06em}

.status{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.panel.zk{flex-direction:row;align-items:center;gap:10px;padding:8px 14px}
.zk .fz{flex:none;width:52px}
.zk .zt{min-width:0;flex:1}
.zk .zn{font-size:14px;font-weight:700;color:var(--ink)}
.zk .zc b{font-size:22px;color:var(--accent)}
.zk .zc small{font-size:12px;color:var(--ink2);font-weight:700}
.zk .bar{margin-top:3px}
.panel{background:#fff;border-radius:16px;padding:8px 16px;min-width:0;box-shadow:0 4px 18px rgba(200,140,100,.16);display:flex;flex-direction:column;gap:2px}
.l1{display:flex;align-items:baseline;gap:12px}
.l2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.l2 .bar{flex:1 1 90px;margin:0}
.panel b{font-size:20px;font-weight:800;line-height:1.4}
.bar{display:block;height:8px;background:#f6ede4;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent2);border-radius:4px}

.stage{background:#fff;border-radius:26px;padding:clamp(14px,3vw,24px);box-shadow:0 10px 36px rgba(200,140,100,.2);display:flex;flex-direction:column;gap:16px}
.stage h2.big{text-align:center;font-size:clamp(20px,3.6vw,28px);font-weight:800;color:var(--ink);letter-spacing:.02em}
.lab{font-size:14px;font-weight:700;color:var(--ink2);margin:0 0 8px}
.seg{display:flex;gap:10px}
.seg button{flex:1;min-height:50px;border:2px solid var(--line);background:#fff;border-radius:14px;font-weight:700}
.seg button[aria-pressed="true"]{background:#fff0e3;color:#a8454d;border-color:#e6cdb8}

.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.card{
  grid-column:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;
  color:var(--ci);border:0;border-radius:20px;padding:14px 14px 12px;
  box-shadow:0 8px 18px rgba(30,30,60,.16);transition:transform .15s ease;
}
.card .hd{display:flex;align-items:center;justify-content:center;gap:10px;flex:1}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.98)}
.g-k{--ci:var(--ci-k);background:linear-gradient(145deg,#ffd6d6,#ffbdbd)}
.g-g{--ci:var(--ci-g);background:linear-gradient(145deg,#ddd6f2,#c4b8e6)}
.g-t{--ci:var(--ci-t);background:linear-gradient(145deg,#cdeaf6,#a8d8ec)}
.g-w{--ci:var(--ci-w);background:linear-gradient(145deg,#d3f1bf,#b3e394)}
.g-b{--ci:var(--ci-b);background:linear-gradient(145deg,#fffde0,#f8f3b0)}
.g-y{--ci:var(--ci-y);background:linear-gradient(145deg,#ffe9cf,#ffd9a8)}
.fic{width:.95em;height:.95em;display:block}
.card .ic{font-size:40px;line-height:1.1;flex:none}
.card .nm{font-size:20px;font-weight:800;line-height:1.35;text-align:left}
.card .mm{width:100%;display:block;font-size:12px;font-weight:700}
.card .bar{background:rgba(42,27,77,.16);margin:0 0 4px}
.card .bar i{background:currentColor}

.primary{
  background:var(--btn);color:var(--accent-ink);border:0;border-radius:18px;padding:16px 22px;
  font-weight:800;font-size:19px;min-height:56px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  box-shadow:0 6px 14px rgba(255,170,150,.42);
}
.ghost{
  background:#fff;border:2px dashed #e6cdb8;border-radius:18px;padding:14px 18px;min-height:64px;width:100%;
  display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;text-align:left
}
.ghost:disabled{opacity:.55;cursor:default}
.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}
.tools .ghost{height:100%;padding:10px 14px;min-height:0;flex-wrap:wrap}
.tools .ghost .gl{gap:10px}
.tools .ghost small{font-size:11px;line-height:1.4;display:block;margin-top:2px}
.tools .seg{gap:6px}
.tools .seg button{padding:0 4px}
.gl{display:flex;align-items:center;gap:14px;min-width:0}
.nicon{width:56px;height:42px;flex:none}
.ghost b{color:var(--pen);font-size:22px;font-weight:800;white-space:nowrap}
.note{font-size:12px;color:var(--ink2);text-align:center;margin:0}

/* クイズ */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:46px;padding:0 16px;font-weight:700}
/* コンボゲージ: 正解の丸が点灯し、続けて正解した丸どうしを線でつなぐ */
.pips{display:flex;gap:8px;flex:1;min-width:140px;flex-wrap:wrap;align-items:center}
.pips i{position:relative;width:20px;height:20px;border:2px solid #ecd5c0;background:#fff;display:block;border-radius:50%}
.pips i.ok{background:var(--ok);border-color:var(--ok)}
.pips i.ng{border-color:var(--pen);background:var(--pen-soft)}
.pips i.now{border-color:var(--ink)}
.pips i.lk::before{content:"";position:absolute;right:100%;top:50%;width:12px;height:4px;margin-top:-2px;margin-right:0;background:var(--ok);border-radius:2px}
.pips i.lit{animation:pop .35s ease-out}
.pips i.lit.lk::before{transform-origin:left;animation:link .3s ease-out}
@keyframes link{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.chip{font-size:15px;font-weight:900;color:var(--ok);white-space:nowrap}
/* コンボ演出 */
.combo{position:absolute;left:50%;top:-6px;z-index:6;pointer-events:none;white-space:nowrap;font-weight:900;line-height:1;color:var(--ok);
  -webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 4px 10px rgba(40,90,60,.25);opacity:0;transform:translate(-50%,0);animation:combo 1.9s cubic-bezier(.2,.8,.3,1) forwards}
.combo.c3{font-size:40px}
.combo.c5{font-size:52px;color:#e0456f;text-shadow:0 4px 12px rgba(224,69,111,.3)}
.combo.c8{font-size:58px;color:#7b5cd6;text-shadow:0 4px 14px rgba(123,92,214,.35)}
.combo.c10{font-size:72px;letter-spacing:.04em;color:#ff7a59;background:linear-gradient(90deg,#ff6b8b,#ffa34d,#ffd84d,#5fd38d,#4db8ff,#9b7bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 5px 10px rgba(120,80,200,.35))}
@keyframes combo{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}14%{opacity:1;transform:translate(-50%,-22px) scale(1.15)}24%{transform:translate(-50%,-18px) scale(1) rotate(-3deg)}34%{transform:translate(-50%,-18px) scale(1) rotate(2deg)}44%{transform:translate(-50%,-18px) rotate(0)}80%{opacity:1;transform:translate(-50%,-18px) scale(1)}100%{opacity:0;transform:translate(-50%,-34px) scale(1.04)}}
.qcard.glow5{box-shadow:0 0 0 4px #ffbdbd,0 10px 36px rgba(224,69,111,.28)}
.qcard.glow8{box-shadow:0 0 0 5px #cec4e9,0 10px 40px rgba(123,92,214,.32)}
.qcard.glow10{box-shadow:0 0 0 6px #ffddb3,0 0 0 10px #ffbdbd,0 12px 44px rgba(255,140,90,.4)}
.best{font-size:13px;font-weight:800;color:var(--ink2);margin-left:auto;white-space:nowrap}
.best b{color:var(--ok);font-size:16px}
.newbest{display:inline-block;margin-left:4px;padding:1px 10px;border-radius:999px;background:var(--btn);color:var(--ink);font-weight:900;font-size:13px;animation:settle .5s ease-out .3s both}
.qcard{position:relative;background:#fff;border-radius:26px;padding:clamp(18px,3.4vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 36px rgba(200,140,100,.2)}
.tag{align-self:flex-start;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--tci,#fff);border:2px solid var(--tc,var(--accent));border-radius:999px;padding:0 12px;background:var(--tc,var(--accent))}
.ins{margin:0;color:var(--ink2);font-size:14px;line-height:1.6}
.body{font-weight:800;font-size:clamp(22px,4.6vw,30px);line-height:1.7;margin:0;text-wrap:balance}
.qs{font-size:.62em;font-weight:700;color:var(--ink2)}
.yomi{display:inline-block;white-space:nowrap;font-size:.58em;font-weight:500;color:var(--ink2);margin-left:1px;letter-spacing:0}
.body .u{text-decoration:underline;text-decoration-color:var(--pen);text-decoration-thickness:3px;text-underline-offset:6px}
.body .blank{display:inline-block;min-width:3.6em;border-bottom:3px solid var(--ink);text-align:center;color:var(--pen);line-height:1.3;margin:0 4px}
.body .wd{font-size:clamp(28px,6vw,40px)}
.mean{margin:0;padding:10px 14px;background:var(--soft);border-radius:12px;font-size:15px}
.mean b{color:var(--accent)}
.choices{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{
  position:relative;display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 16px;text-align:left;
  background:#fff;border:2px solid var(--line);border-radius:16px;color:var(--ink);line-height:1.5;font-weight:500;
}
.choice:not(:disabled):hover{border-color:#e6cdb8}
.choice:not(:disabled):active{transform:scale(.99)}
.choice:disabled{cursor:default;color:var(--ink)}
.choice .mk{flex:none;width:32px;height:32px;border:2px solid #ecd5c0;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink2)}
.choice .tx{min-width:0;overflow-wrap:anywhere}
.choices.two .choice .tx{font-weight:800;font-size:24px}
.choice.dim{opacity:.5}
.choice.right{background:var(--pen-soft);border-color:var(--pen)}
.choice.wrong{border:2px dashed var(--miss);opacity:.8}
.choice .bt{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:34px;line-height:1;color:var(--pen);font-weight:700;animation:pop .3s ease-out}
.maru{position:absolute;inset:-4px;border:4.5px solid var(--pen);border-radius:19px;pointer-events:none;clip-path:inset(-8px 100% -8px -8px);animation:draw .5s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes draw{to{clip-path:inset(-8px -8px -8px -8px)}}
.fb{border-top:2px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.fb .h{font-weight:900;font-size:28px;color:var(--pen);line-height:1.3}
.fb .h.ng{color:var(--ink);font-size:24px}
.fb .h.ng span{color:var(--pen)}
.fb p{margin:0}
.fb .done{font-weight:800;font-size:20px}
.fb .ex{color:var(--ink);font-size:15px}
.next{align-self:flex-end;min-width:210px;min-height:58px;border:0;border-radius:16px;background:var(--btn);color:var(--accent-ink);font-weight:800;font-size:18px;padding:0 26px;box-shadow:0 6px 14px rgba(255,170,150,.42)}

/* 結果・復習ノート */
.res{align-items:center;text-align:center;gap:14px}
.score{display:flex;align-items:baseline;justify-content:center;gap:10px;color:var(--pen);font-weight:900}
.score b{font-size:80px;line-height:1;border-bottom:5px double var(--pen);padding:0 8px 2px}
.score span{font-size:22px}
.msg{margin:0;font-weight:700;font-size:17px}
.res .pips{flex:none;justify-content:center;min-width:0}
.pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-flex;align-items:baseline;gap:6px;background:var(--soft);border-radius:999px;padding:2px 16px;font-weight:700;font-size:14px}
.pill b{color:var(--accent);font-size:18px;font-weight:800}
.up{width:100%;background:var(--btn);color:var(--ink);border-radius:18px;padding:12px 16px;font-weight:800;font-size:18px;box-shadow:0 6px 14px rgba(255,170,150,.42)}
.perfect{background:linear-gradient(145deg,#def7ea,#b5e8d0);color:var(--ink);border-radius:22px;padding:18px;text-align:center;font-weight:900;font-size:24px;box-shadow:0 8px 18px rgba(30,30,60,.16)}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sb{min-height:44px;padding:0 16px;border-radius:14px;border:2px solid var(--ink);background:#fff;font-weight:800;font-size:15px;color:var(--ink)}
.sb.fill{background:var(--btn);border:0;color:var(--accent-ink);box-shadow:0 4px 10px rgba(255,170,150,.42)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec h2{font-size:clamp(18px,3.2vw,22px);font-weight:800;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.miss{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.miss .tag{font-size:12px}
.miss .q{font-weight:800;font-size:19px;line-height:1.5}
.miss .hl{color:var(--pen)}
.miss .a{font-size:15px}
.miss .a b{color:var(--pen)}
.miss .e{font-size:14px;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>button{flex:1 1 200px}
.btn{min-height:58px;border-radius:18px;font-weight:800;font-size:17px;border:2px solid var(--ink);background:#fff;padding:0 20px}
.btn.fill{background:var(--btn);border:0;color:var(--accent-ink);box-shadow:0 6px 14px rgba(255,170,150,.42)}
.sticky{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.hero.sm .title{font-size:clamp(26px,5.6vw,40px)}
.empty{color:var(--ink);padding:28px 20px;text-align:center;border:2px dashed #e6cdb8;border-radius:22px;background:#fff;font-weight:700;line-height:1.8}

/* 問題カードの上段: 左に分野と本文、右に〇・おしい！ */
.qtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.qmain{display:flex;flex-direction:column;gap:12px;min-width:0}
.trow{display:flex;align-items:center;gap:12px}
.prog{font-size:18px;font-weight:800;color:var(--ink2);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.slot{min-width:0;display:flex;justify-content:flex-end;align-items:flex-start;padding:4px 6px 0 0}
/* 「おしい！」はまちがいが続くほど大きくなる（1回目→3回目）。「正解！」は3段階目と同じ大きさ */
.oshii,.seikai{font-weight:900;color:var(--pen);line-height:1.2;white-space:nowrap;transform:rotate(-7deg);transform-origin:center;animation:shake .5s ease-out}
.oshii.l1{font-size:24px}
.oshii.l2{font-size:38px}
.oshii.l3,.seikai{font-size:54px}
/* 正解のときに中央へポンと出て、消えていく大きな〇 */
.bigmaru{position:absolute;left:50%;top:50%;height:min(120%,530px);aspect-ratio:1/1;z-index:5;pointer-events:none;opacity:0;transform:translate(-50%,-50%);animation:maru 2.1s ease-out forwards}
.bigmaru svg{width:100%;height:100%;display:block;overflow:visible}
.bigmaru circle{fill:none;stroke:var(--pen);stroke-width:3.6;opacity:.75}
@keyframes maru{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}11%{transform:translate(-50%,-50%) scale(1.08);opacity:1}17%{transform:translate(-50%,-50%) scale(1);opacity:1}79%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.05);opacity:0}}
/* 「正解！」はまっすぐ（安定）。ぽんと出て落ち着く */
.seikai{transform:none;animation:settle .45s ease-out}
@keyframes settle{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%{transform:rotate(-7deg) scale(.6);opacity:0}40%{transform:rotate(-12deg) scale(1.1);opacity:1}70%{transform:rotate(-4deg)}100%{transform:rotate(-7deg)}}

button.panel.zk{border:0;width:100%;font:inherit;text-align:left;cursor:pointer;color:inherit}
.zk .zgo{flex:none;font-size:22px;font-weight:800;color:var(--accent)}
.reset{margin-top:6px;background:none;border:0;color:var(--ink2);font-size:11px;text-decoration:underline;padding:6px 10px}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const sample=(a,n)=>shuffle(a).slice(0,n);
const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const RANKS=[[0,'算数の見習い'],[100,'算数の戦士'],[300,'算数の勇者'],[600,'算数の賢者'],[1000,'算数の英雄'],[1600,'算数の伝説']];
function rankOf(xp){let r=0;RANKS.forEach((x,i)=>{if(xp>=x[0])r=i;});return r;}
function daysLeft(){
  const now=new Date();const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((new Date(2027,1,1)-t0)/864e5);
}
const stat=id=>store.st[id];
const mastered=it=>{const s=stat(it.id);return !!(s&&s.r>=2&&!s.w);};
const inNote=it=>{const s=stat(it.id);return !!(s&&s.w);};
/* 図鑑: 一度覚えた語は消えない。col は獲得順 */
if(!Array.isArray(store.col))store.col=[];
ITEMS.forEach(it=>{if(mastered(it)&&store.col.indexOf(it.id)<0)store.col.push(it.id);});
const collected=it=>store.col.indexOf(it.id)>=0;
const lvl=it=>{const s=stat(it.id);const r=s?s.r:0;return r>=6?3:r>=4?2:r>=2?1:0;};
const starsHTML=n=>'★'.repeat(n)+'☆'.repeat(3-n);

function weight(it){
  const s=stat(it.id);let w=1;
  if(!s||!s.s)w+=1.5;else{w+=(1-s.c/s.s)*2;if(s.r>=2)w-=0.6;}
  if(s&&s.w)w+=3;
  if(BOOST.has(it.id))w*=3;
  return Math.max(w,0.3);
}
let BOOST=new Set();
function pickWeighted(pool,n){
  const arr=pool.map(it=>({it,w:weight(it)}));const out=[];
  while(out.length<n&&arr.length){
    const sum=arr.reduce((t,x)=>t+x.w,0);let r=Math.random()*sum,k=0;
    for(;k<arr.length;k++){r-=arr[k].w;if(r<=0)break;}
    if(k>=arr.length)k=arr.length-1;
    out.push(arr.splice(k,1)[0].it);
  }
  return out;
}
function makeQ(it){
  const rv=it.r&&Math.random()<.5;
  const q=rv?it.r.q:it.q,a=rv?it.r.a:it.a,d=rv?it.r.d:it.d,p=rv?(it.r.p||''):(it.p||'');
  return {it,rv,q,a,p,choices:shuffle([a].concat(d)),first:null,done:false,wrong:[],ok:false};
}

function plainStem(it){return plain(it.q)+(it.p&&it.p!=='＝ ？'?' '+it.p:'')+' → '+plain(it.a);}
function bodyHTML(q){

function startRound(key){
  let pool;
  if(key==='review')pool=ITEMS.filter(inNote);
  else if(key==='all')pool=ITEMS;
  else if(key.slice(0,2)==='v:'){const p=key.split(':');pool=VOLS[p[1]][+p[2]];}
  else pool=ITEMS.filter(i=>i.type===key);
  if(!pool.length)return;
  const n=Math.min(store.len,pool.length);
  // いまの巻の、まだ覚えていない語を出やすくする
  BOOST=new Set();ORDER.forEach(k=>{const v=curVol(k);if(v>=0)VOLS[k][v].forEach(it=>{if(!collected(it))BOOST.add(it.id);});});
  state.cv=null;
  state.round={key,qs:pickWeighted(pool,n).map(makeQ),i:0,score:0,streak:0,maxStreak:0,best0:store.best||0,xp:0,rank0:rankOf(store.xp),newCards:[]};
  state.screen='quiz';
  render(true);
}
/* コンボ演出: 連続正解数 → [表示, 段階] */
const COMBO={3:'c3',5:'c5',8:'c8',10:'c10'};
const COMBO_TXT={c3:'3連続！',c5:'すごい！',c8:'8連続！！',c10:'SUPER！！'};
function comboLv(n){return n>=10?10:n>=8?8:n>=5?5:0;}
/* ゲージ: 正解の丸は点灯、直前も正解なら線でつなぐ */
function gauge(qs,cur,litIdx){
  return qs.map((x,i)=>{
    const st=x.first===null?null:x.first;
    let c=st===null?(i===cur?'now':''):(st?'ok':'ng');
    if(st&&i>0&&qs[i-1].first===true)c+=' lk';
    if(i===litIdx&&st)c+=' lit';
    return '<i class="'+c+'"></i>';
  }).join('');
}
/* ===== 効果音（Web Audio） ===== */
let actx=null;
function audio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC();}
  if(actx.state==='suspended')actx.resume();
  return actx;
}
// tone(周波数Hz, 長さ秒, 波形, 音量, 開始の遅れ秒)
function tone(f,d,type,vol,delay){
  const c=audio();if(!c)return;
  type=type||'sine';vol=vol==null?.035:vol;delay=delay||0;
  const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+d+.02);
}
// 正解音
const correctSound=()=>{
  tone(590,.10);
  tone(790,.13,'sine',.035,.08);
};
// 不正解音（おしい音）
const closeSound=()=>{
  tone(660,.07,'triangle',.025);
  tone(760,.08,'triangle',.022,.065);
};
// iPad: 最初のタッチで音声を有効にする
document.addEventListener('touchstart',function un(){audio();document.removeEventListener('touchstart',un);},{passive:true});

function choose(j){
  const R=state.round,q=R.qs[R.i];
  if(!q||q.done||q.wrong.indexOf(j)>=0)return;
  const ok=q.choices[j]===q.a;
  if(q.first===null){
    // 1回目の答えだけを成績にする
    q.first=ok;q.ok=ok;
    const s=store.st[q.it.id]||(store.st[q.it.id]={s:0,c:0,r:0,w:0});
    s.s++;
    if(ok){s.c++;s.r++;if(s.r>=2)s.w=0;}else{s.r=0;s.w=1;}
    if(ok&&s.r>=2&&!s.w&&store.col.indexOf(q.it.id)<0){store.col.push(q.it.id);R.newCards.push(q.it);}
    const d=todayStr();if(store.day.d!==d)store.day={d:d,n:0,c:0};
    store.day.n++;if(ok)store.day.c++;
    if(ok){R.score++;R.streak++;const g=10+2*Math.min(R.streak-1,5);R.xp+=g;store.xp+=g;
      if(R.streak>R.maxStreak)R.maxStreak=R.streak;
      if(R.streak>(store.best||0))store.best=R.streak;
      q.combo=COMBO[R.streak]||0;
    }else R.streak=0;
    save();
  }
  if(ok){q.done=true;correctSound();}else{q.wrong.push(j);closeSound();}
  render(false);
}
function next(){
  const R=state.round;
  if(R.i+1>=R.qs.length){state.screen='result';checkAwards();render(true);}
  else{R.i++;render(true);}
}

function viewQuiz(){
  const R=state.round,q=R.qs[R.i],it=q.it;
  const pips=gauge(R.qs,R.i,q.done&&q.first?R.i:-1);
  const maxLen=Math.max.apply(null,q.choices.map(c=>Array.from(plain(c)).length));
  const two=maxLen<=9;
  const ch=q.choices.map((c,j)=>{
    let cls='choice',extra='',dis='';
    const bad=q.wrong.indexOf(j)>=0;
    if(q.done){
      dis=' disabled';
      if(c===q.a){cls+=' right';extra='<span class="maru"></span>';}
      else if(bad){cls+=' wrong';extra='<span class="bt" aria-hidden="true">×</span>';}
      else cls+=' dim';
    }else if(bad){cls+=' wrong';dis=' disabled';extra='<span class="bt" aria-hidden="true">×</span>';}
    return '<button class="'+cls+'" data-a="choose" data-i="'+j+'"'+dis+'><span class="mk">'+MARKS[j]+'</span><span class="tx">'+fmt(c)+'</span>'+extra+'</button>';
  }).join('');
  let stamp='';
  if(q.done)stamp='<div class="seikai" role="status">'+BOLT+'正解！</div>';
  else if(q.wrong.length)stamp='<div class="oshii l'+Math.min(q.wrong.length,3)+'" role="status">おしい！</div>';
  const maru=q.done?'<div class="bigmaru" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42"/></svg></div>':'';
  let fb='';
  if(q.done){
    const last=R.i+1>=R.qs.length;
    const done='';
    fb='<div class="fb" id="fb" aria-live="polite">'+
      done+'<p class="ex">'+fmt(it.e)+'</p>'+
      '<button class="next" data-a="next">'+(last?'結果を見る':'次へ')+'</button></div>';
  }
  const mean='';
  return '<div class="qbar"><button class="back" data-a="home">もどる</button><div class="pips" aria-label="'+(R.i+1)+'問目 / '+R.qs.length+'問">'+pips+'</div>'+
    (R.streak>=2?'<span class="chip">'+R.streak+'連続</span>':'')+'</div>'+
    '<article class="qcard'+(comboLv(R.streak)?' glow'+comboLv(R.streak):'')+'">'+maru+
    (q.done&&q.combo?'<div class="combo '+q.combo+'" role="status">'+COMBO_TXT[q.combo]+'</div>':'')+'<div class="qtop"><div class="qmain">'+
    '<div class="trow"><span class="tag" style="--tc:var(--c-'+it.type+');--tci:var(--ci-'+it.type+')">'+(R.key==='review'?'復習　':'')+TYPES[it.type].name+'</span>'+
    '<span class="prog" aria-hidden="true">'+(R.i+1)+'/'+R.qs.length+'</span></div>'+
    bodyHTML(q)+'</div><div class="slot">'+stamp+'</div></div>'+mean+
    '<div class="choices'+(two?' three':'')+'">'+ch+'</div>'+fb+'</article>';
}

/* ===== 巻と賞状 =====
   各分野を10問ずつの「巻」に分ける。巻の問題をすべて覚える（図鑑に入る）と賞状。
   賞状のid … 'v:分野:巻番号'（巻）、'f:分野'（分野制覇）、'r:称号番号'（称号）、'all'（皆伝） */
const VOL_SIZE=10;
const VOLS={};
ORDER.forEach(k=>{
  const pool=ITEMS.filter(i=>i.type===k),n=Math.ceil(pool.length/VOL_SIZE),vols=[];let s=0;
  for(let v=0;v<n;v++){const sz=Math.floor(pool.length/n)+(v<pool.length%n?1:0);vols.push(pool.slice(s,s+sz));s+=sz;}
  VOLS[k]=vols;
});
const volOf={};ORDER.forEach(k=>VOLS[k].forEach((vs,v)=>vs.forEach(it=>volOf[it.id]=v)));
const volGot=(k,v)=>VOLS[k][v].filter(collected).length;
const curVol=k=>{for(let v=0;v<VOLS[k].length;v++)if(volGot(k,v)<VOLS[k][v].length)return v;return -1;};
const KD='〇一二三四五六七八九';
function kan(n){
  if(n<10)return KD[n];
  if(n<100)return (n>=20?KD[Math.floor(n/10)]:'')+'十'+(n%10?KD[n%10]:'');
  const h=Math.floor(n/100),r=n%100;return (h>1?KD[h]:'')+'百'+(r?kan(r):'');
}
const volName=v=>'第'+kan(v+1)+'巻';
const AWARD_IDS=[];
ORDER.forEach(k=>{VOLS[k].forEach((_,v)=>AWARD_IDS.push('v:'+k+':'+v));AWARD_IDS.push('f:'+k);});
for(let i=1;i<RANKS.length;i++)AWARD_IDS.push('r:'+i);
AWARD_IDS.push('all');
if(!store.aw||typeof store.aw!=='object')store.aw={};
Object.keys(store.aw).forEach(id=>{if(AWARD_IDS.indexOf(id)<0||(id[0]==='v'&&!earned(id)))delete store.aw[id];});
function earned(id){
  const p=id.split(':');
  if(p[0]==='v')return volGot(p[1],+p[2])===VOLS[p[1]][+p[2]].length;
  if(p[0]==='f')return VOLS[p[1]].every((_,v)=>volGot(p[1],v)===VOLS[p[1]][v].length);
  if(p[0]==='r')return rankOf(store.xp)>=+p[1];
  return store.col.length>=ITEMS.length;
}
/* まだもらっていない賞状を調べて、授与の列に入れる */
function checkAwards(){
  const d=todayStr(),nw=AWARD_IDS.filter(id=>!store.aw[id]&&earned(id));
  nw.forEach(id=>store.aw[id]=d);
  if(nw.length){save();state.cer=(state.cer||[]).concat(nw);}
}
function awardInfo(id){
  const p=id.split(':');
  if(p[0]==='v'){const k=p[1],v=+p[2],n=VOLS[k][v].length;
    return {kind:'v',k,v,frame:ZC[k],thumb:volName(v),
      body:['あなたは　'+TYPES[k].name+'　'+volName(v)+'の'+kan(n)+'問を','見事に覚えました','よってここにこれを賞します']};}
  if(p[0]==='f'){const k=p[1],n=ITEMS.filter(i=>i.type===k).length;
    return {kind:'f',k,frame:'#e3b23c',thumb:'制覇',
      body:['あなたは　'+TYPES[k].name+'の全'+kan(n)+'問を覚え','この分野を制覇しました','その努力をたたえ　これを賞します']};}
  if(p[0]==='r'){const r=+p[1];
    return {kind:'r',r,frame:SPCOL[r],thumb:RANKS[r][1].replace('ことばの',''),
      body:['あなたは日々の努力をかさね','「'+RANKS[r][1]+'」の称号を得ました','よってここにこれを賞します']};}
  return {kind:'all',frame:'#e3b23c',thumb:'皆伝',
    body:['あなたは全'+kan(ITEMS.length)+'問をすべて覚え','算数の皆伝となりました','心からこれを賞します']};
}
const wordLabel=it=>plain(it.q)+(it.q==='素数はどれ？'?'':' → ')+(it.q==='素数はどれ？'?' '+plain(it.a):plain(it.a));

/* --- 賞状を canvas にかく（たて書き） --- */
const CW=900,CH=640;
const MINCHO='"Hiragino Mincho ProN","ヒラギノ明朝 ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif';
const ROT='ー－―～〜…‥（）「」『』〔〕【】-~()';
function vtext(ctx,s,x,y,size,gap){
  // 1文字ずつ下へ。のばす音やかっこは90度回す。全角スペースは半分あける
  ctx.font='700 '+size+'px '+MINCHO;ctx.textAlign='center';ctx.textBaseline='middle';
  const step=size*(gap||1.08);
  for(const ch of s){
    if(ch==='　'){y+=step*.5;continue;}
    if(ROT.indexOf(ch)>=0){ctx.save();ctx.translate(x,y+step/2);ctx.rotate(Math.PI/2);ctx.fillText(ch,0,0);ctx.restore();}
    else if('、。'.indexOf(ch)>=0)ctx.fillText(ch,x+size*.6,y+step/2-size*.6);
    else ctx.fillText(ch,x,y+step/2);
    y+=step;
  }
  return y;
}
const vlen=(s,size,gap)=>{let n=0;for(const ch of s)n+=ch==='　'?.5:1;return n*size*(gap||1.08);};
function frame(ctx,col,gold){
  ctx.fillStyle='#fffdf6';ctx.fillRect(0,0,CW,CH);
  // 和紙の風合い
  for(let i=0;i<260;i++){ctx.fillStyle='rgba(190,160,110,'+(Math.random()*.07)+')';ctx.fillRect(Math.random()*CW,Math.random()*CH,Math.random()*28+4,1.2);}
  ctx.lineWidth=16;ctx.strokeStyle=col;ctx.strokeRect(22,22,CW-44,CH-44);
  ctx.lineWidth=3;ctx.strokeStyle=gold?'#b8860b':'#c9a24a';ctx.strokeRect(10,10,CW-20,CH-20);ctx.strokeRect(38,38,CW-76,CH-76);
  // 枠の飾り（ひし形の列）
  ctx.fillStyle=gold?'#fff3c4':'rgba(255,255,255,.75)';
  for(let x=46;x<CW-30;x+=26){dia(ctx,x,30,4);dia(ctx,x,CH-30,4);}
  for(let y=46;y<CH-30;y+=26){dia(ctx,30,y,4);dia(ctx,CW-30,y,4);}
  // 四すみの飾り
  [[54,54],[CW-54,54],[54,CH-54],[CW-54,CH-54]].forEach(([x,y])=>{ctx.fillStyle=gold?'#d4a017':'#c9a24a';dia(ctx,x,y,10);ctx.fillStyle='#fffdf6';dia(ctx,x,y,4);});
}
function dia(ctx,x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();ctx.fill();}
function reiwa(d){const p=d.split('-').map(Number);return '令和'+kan(p[0]-2018)+'年'+kan(p[1])+'月'+kan(p[2])+'日';}
function drawCert(cv,id,withHanko){
  const A=awardInfo(id),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=CW*dpr;cv.height=CH*dpr;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const gold=A.kind==='f'||A.kind==='all';
  frame(ctx,A.frame,gold);
  const put=(t,x,y,size,align,col,w)=>{ctx.font=(w||700)+' '+size+'px '+MINCHO;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillStyle=col||'#2b2220';ctx.fillText(t,x,y);};
  // 題（中央）
  put('賞　　状',CW/2,122,74,'center','#2b2220',900);
  if(A.kind==='r'||A.kind==='all'||A.kind==='f'){ // 格の高い賞状は、題の両わきに紋章
    [CW/2-200,CW/2+200].forEach(cx=>{
      ctx.save();ctx.translate(cx,122);
      ctx.fillStyle=A.kind==='r'?SPCOL[A.r]:'#f2c94c';ctx.strokeStyle='#7a5a12';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(28,-24);ctx.lineTo(28,2);ctx.quadraticCurveTo(26,26,0,38);ctx.quadraticCurveTo(-26,26,-28,2);ctx.lineTo(-28,-24);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();put(A.kind==='r'?kan(A.r+1):A.kind==='f'?'覇':'極',cx,124,26,'center','#fff',900);
    });
  }
  // 名前
  const nick=(store.nick||'').trim()||'なまえ';
  put(nick,120,222,44);
  ctx.font='700 44px '+MINCHO;const nw=ctx.measureText(nick).width;
  put('殿',120+nw+22,224,38);
  ctx.strokeStyle='#c9a24a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(116,252);ctx.lineTo(120+nw+70,252);ctx.stroke();
  // 本文（横書き）
  let y=316;
  A.body.forEach(line=>{
    ctx.font='700 32px '+MINCHO;const w=ctx.measureText(line).width,max=CW-300;
    put(line,160,y,w>max?Math.floor(32*max/w):32);y+=54;
  });
  // 日付・発行
  put(reiwa(store.aw[id]||todayStr()),160,y+22,24,'left','#4a3a30');
  ctx.font='700 30px "Cinzel",'+MINCHO;ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#2b2220';ctx.fillText('MATH PARK',HX-HR+14,HY+4);
  return withHanko?hankoImg().then(img=>{ctx.drawImage(img,HX-HR,HY-HR,HR*2,HR*2);}):Promise.resolve();
}

const HR=54,HX=CW-128,HY=CH-118;
let hankoCache={};
function hankoImg(){
  const st=rankOf(store.xp)+1;
  if(hankoCache[st])return Promise.resolve(hankoCache[st]);
  return new Promise(res=>{
    const body=petInner(st).replace(/#7a4a12/g,'#d23a2a').replace(/fill="#(?!d23a2a)[0-9a-fA-F]{3,6}"/g,'fill="#fffdf6"').replace(/opacity="[^"]*"/g,'');
    const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">'+body+'</svg>';
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=240;const g=c.getContext('2d');
      g.fillStyle='#fffdf6';g.beginPath();g.arc(120,120,104,0,Math.PI*2);g.fill();
      g.drawImage(im,24,26,192,192);
      g.strokeStyle='#d23a2a';g.lineWidth=12;g.beginPath();g.arc(120,120,110,0,Math.PI*2);g.stroke();
      g.lineWidth=4;g.beginPath();g.arc(120,120,96,0,Math.PI*2);g.stroke();
      // かすれ
      g.globalCompositeOperation='destination-out';
      for(let i=0;i<90;i++){g.fillStyle='rgba(0,0,0,'+(Math.random()*.5)+')';g.beginPath();g.arc(Math.random()*240,Math.random()*240,Math.random()*3+.5,0,Math.PI*2);g.fill();}
      g.globalCompositeOperation='source-over';
      const out=new Image();out.onload=()=>{hankoCache[st]=out;res(out);};out.src=c.toDataURL();
    };
    im.onerror=()=>{const c=document.createElement('canvas');c.width=c.height=240;const g=c.getContext('2d');g.strokeStyle='#d23a2a';g.lineWidth=12;g.beginPath();g.arc(120,120,110,0,Math.PI*2);g.stroke();g.fillStyle='#d23a2a';g.font='900 90px '+MINCHO;g.textAlign='center';g.textBaseline='middle';g.fillText('賞',120,124);const out=new Image();out.onload=()=>res(out);out.src=c.toDataURL();};
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function saveCert(id){

}

const SJ_ICON='<svg class="fz" viewBox="0 0 80 88" aria-hidden="true"><rect x="12" y="6" width="56" height="76" rx="3" fill="#fffdf6" stroke="#c9a24a" stroke-width="4"/><rect x="19" y="13" width="42" height="62" fill="none" stroke="#ffbdbd" stroke-width="4"/><text x="50" y="34" text-anchor="middle" font-size="14" font-weight="900" fill="#4a3438">賞</text><text x="50" y="52" text-anchor="middle" font-size="14" font-weight="900" fill="#4a3438">状</text><path d="M28 30v30M34 30v22" stroke="#d8c7b4" stroke-width="2.5" stroke-linecap="round"/><circle cx="30" cy="66" r="7" fill="none" stroke="#d23a2a" stroke-width="2.5"/></svg>';
function render(top){
  app.innerHTML=state.screen==='home'?viewHome():state.screen==='quiz'?viewQuiz():state.screen==='result'?viewResult():state.screen==='zukan'?viewZukan():state.screen==='shojo'?viewShojo():viewNotebook();
  if(state.cer&&state.cer.length&&state.screen!=='quiz')app.insertAdjacentHTML('beforeend',cerHTML());
  paintCer();
  if(top){window.scrollTo(0,0);}
  else{const fb=document.getElementById('fb');if(fb)fb.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.getAttribute('data-a');
  if(a==='start')startRound(b.getAttribute('data-t'));
  else if(a==='choose')choose(+b.getAttribute('data-i'));
  else if(a==='next')next();
  else if(a==='home'){state.screen='home';render(true);}
  else if(a==='len'){store.len=+b.getAttribute('data-n');save();render(false);}
  else if(a==='notebook'){state.screen='notebook';render(true);}
  else if(a==='review')startRound('review');
  else if(a==='zukan'){state.screen='zukan';state.zOpen=-1;const last=store.col.length?itemAt(store.col[store.col.length-1]):null;if(last)state.zTab=last.type;render(true);}
  else if(a==='ztab'){state.zTab=b.getAttribute('data-t');state.zOpen=-1;render(false);}
  else if(a==='zopen'){state.zOpen=+b.getAttribute('data-i');render(false);}
  else if(a==='zclose'){state.zOpen=-1;render(false);}
  else if(a==='shojo'){state.cer=[];state.screen='shojo';state.cv=null;render(true);}
  else if(a==='cernext'){state.cer.shift();render(false);}
  else if(a==='cerclose'){state.cer=[];render(false);}
  else if(a==='nickset'||a==='nick2'){const el=document.getElementById(a==='nickset'?'nick':'nick2');const v=(el&&el.value||'').trim().slice(0,8);if(!v){if(el)el.focus();return;}store.nick=v;save();render(false);}
  else if(a==='cview'){state.cv=b.getAttribute('data-id');state.cvWords=false;render(false);}
  else if(a==='cvclose'){state.cv=null;render(false);}
  else if(a==='cwords'){state.cvWords=!state.cvWords;render(false);}
  else if(a==='csave'){saveCert(state.cv);}
  else if(a==='reset'){
    if(window.confirm('すべての記録（ポイント・覚えたカード・スパーク図鑑・復習ノート）を消して、はじめからにします。\nよろしいですか？')){store=blank();save();state.screen='home';state.zOpen=-1;render(true);}
  }
});

checkAwards();
render(true);
})();
</script>
</body>
