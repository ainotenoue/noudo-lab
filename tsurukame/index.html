<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つるかめ算の部屋｜miss maths</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#2f3437;font-family:'Hiragino Maru Gothic ProN',-apple-system,sans-serif;font-weight:700}main{max-width:1100px;margin:auto;padding:16px 24px}.question,.panel{background:white;border:2px solid #ebe5da;border-radius:24px;padding:20px;margin-bottom:12px}.question{font-size:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:13px;color:#9a5a12;background:#fff1dc;padding:6px 12px;border-radius:20px}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:0;justify-content:flex-end}.top{flex-wrap:wrap}.question #question{margin-top:14px}.tabs button{padding:8px 12px}.tabs button.active{background:#ffe7c4;border-color:#d6a65b}.tabs button.done:after{content:' ✓';color:#3f9b4a}button,.back{font:inherit;font-size:14px;background:#fff;border:2px solid #e1d9cc;border-radius:30px;padding:10px 16px;cursor:pointer;color:#51483d;text-decoration:none}button:disabled{opacity:.35;cursor:default}button,.animal{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.primary{background:#ffe7c4;border-color:#e8b66b}.stage{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.animals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:16px;background:#f3faef;border-radius:18px}.animal{background:white;border:2px solid #e5eddf;border-radius:14px;text-align:center;padding:8px 2px;cursor:pointer;touch-action:manipulation}.animal svg{width:100%;max-width:75px;height:58px}.animal small{display:block;font-size:11px}.stats{display:flex;justify-content:space-around;margin:14px 0}.count{font-size:18px}.target{text-align:center;background:#fff7e9;border-radius:18px;padding:22px 10px}.big{font-size:clamp(25px,4vw,43px)}.status{min-height:55px;text-align:center;margin:12px 0;color:#87531c}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}.note{font-size:13px;color:#827b71;line-height:1.7}.bridge{margin-top:18px;border-top:2px dashed #e8dfd1;padding-top:16px}.bridge h2{font-size:18px;margin:0 0 10px}.bars{display:flex;align-items:flex-end;gap:12px;height:120px;background:#fbfaf7;padding:12px;border-radius:14px}.bar{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px}.base{background:#add8e6;flex:2}.extra{background:#ffd1dc;flex:1}.hidden{display:none!important}@media(max-width:700px){main{padding:10px}.stage{grid-template-columns:1fr}.question,.panel{padding:14px}.animals{gap:4px;padding:8px}.animal{padding:5px 0}.animal svg{height:44px}.target{padding:12px}.top{align-items:flex-start}}
</style></head><body><main><section class="question"><div class="top"><span class="tag" id="tag">つるかめ算の部屋｜はじめに</span><div class="tabs" id="tabs"></div></div><div id="question">つるをかめに入れ替えると、何が起きるだろう？</div><span id="counter" class="hidden"></span></section><section class="panel">
<div id="intro"><h2>まずは、全部つるだと考えてみよう</h2><p>つるの足は2本。かめの足は4本。つるを1匹かめに入れ替えると、足は2本増えるよ。</p><p>動物をタップして入れ替えながら、ぴったりの数を探してみよう。</p><button class="primary" id="start">問題へ →</button></div>
<div id="game" class="hidden"><div class="stage"><div><div class="animals" id="animals"></div><div class="stats"><span class="count" id="birds"></span><span class="count" id="turtles"></span></div><div class="actions"><button id="minus">− かめ</button><button class="primary" id="plus">＋ かめ</button></div></div><div><div class="target"><div>いまの足の数 / めあて</div><div class="big" id="legs"></div><div id="difference"></div></div><p class="status" id="status" aria-live="polite"></p></div></div><div class="bridge hidden" id="bridge"><h2>図で見てみよう｜面積図への橋わたし</h2><p class="note">全部つるなら「匹数 × 2本」。かめに入れ替えた分だけ「2本ずつ」増える。</p><div class="bars"><div class="bar base" id="base"></div><div class="bar extra" id="extra"></div></div><p id="formula"></p></div><div class="footer"><a class="back" href="../">← 部屋への扉</a><button id="reset">はじめに戻す</button><button class="primary hidden" id="next">次の問題 →</button></div></div></section><p class="note">クリア記録はこのブラウザに保存されます。 <button id="clear">記録をリセット</button></p></main>
<script>
(()=>{'use strict';
const P=[{"n":10,"legs":28},{"n":8,"legs":24},{"n":12,"legs":34},{"n":15,"legs":42},{"n":9,"legs":26},{"n":14,"legs":40},{"n":20,"legs":56},{"n":18,"legs":48},{"n":16,"legs":44},{"n":25,"legs":70}];
const $=id=>document.getElementById(id);
const bird='<svg viewBox="0 0 80 70" aria-hidden="true"><path d="M34 57V68M45 57V68M29 68h11M40 68h11" fill="none" stroke="#514d47" stroke-width="2.8" stroke-linecap="round"/><path d="M31 37Q20 27 27 16Q30 10 36 10Q45 11 45 20L43 30Q57 30 65 40Q72 49 68 57Q57 63 43 56Q29 55 26 47Z" fill="#fff" stroke="#343638" stroke-width="2.8" stroke-linejoin="round"/><path d="M45 39Q59 39 67 50L68 57Q54 62 46 54Z" fill="#44474a"/><path d="M29 16Q23 13 26 8Q29 3 36 4Q44 5 43 13L39 17Z" fill="#c94853"/><path d="M27 17L7 23L28 24Z" fill="#e7ad35" stroke="#ad7d23" stroke-width="1.4" stroke-linejoin="round"/><circle cx="36" cy="18" r="2.5" fill="#222"/></svg>';
const turtle='<svg viewBox="0 0 80 70" aria-hidden="true"><path d="M18 44L14 59Q15 64 21 62L27 49M40 51L38 62Q43 67 48 62L50 51M56 45L61 60Q67 63 69 58L64 43" fill="#9bd351" stroke="#4c852a" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 47Q17 26 37 19Q61 13 71 39Q73 50 62 53L30 54Z" fill="#76b84d" stroke="#366e34" stroke-width="2.8"/><path d="M38 20L32 32L40 44L56 43L64 31M32 32L21 35M40 44L34 53M56 43L62 52M56 43L64 31" fill="none" stroke="#477f37" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 37Q19 26 9 29Q-1 32 2 45Q5 57 19 53Q28 49 22 37Z" fill="#a6d85b" stroke="#4c852a" stroke-width="2.8"/><circle cx="14" cy="38" r="2.6" fill="#29372a"/><path d="M11 45Q15 48 18 44" stroke="#477f37" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M69 43Q78 44 76 49Q74 54 67 52" fill="#a6d85b" stroke="#4c852a" stroke-width="2.4"/></svg>';
let idx=0,k=0,started=false;let done={};try{done=JSON.parse(localStorage.getItem('tsurukame-done')||'{}')||{}}catch(e){}
function save(){try{localStorage.setItem('tsurukame-done',JSON.stringify(done))}catch(e){}}
function renderTabs(){$('tabs').innerHTML=P.map((p,i)=>'<button data-i="'+i+'" class="'+(idx===i?'active ':'')+(done[i]?'done':'')+'">'+(i+1)+'</button>').join('')+'<button data-i="free">じゆうに試す</button>';}
function render(){const p=P[idx],correct=k*4+(p.n-k)*2===p.legs;$('tag').textContent='つるかめ算の部屋｜問題 '+String(idx+1).padStart(2,'0');$('counter').textContent=(idx+1)+' / '+P.length;$('question').textContent='つるとかめが合わせて'+p.n+'匹。足は全部で'+p.legs+'本。つるとかめは何匹ずつ？';$('intro').classList.toggle('hidden',started);$('game').classList.toggle('hidden',!started);renderTabs();if(!started)return;
$('animals').innerHTML=Array.from({length:p.n},(_,i)=>'<button class="animal" data-a="'+i+'" aria-label="'+(i<k?'かめ':'つる')+'を入れ替える">'+(i<k?turtle:bird)+'<small>'+(i<k?'かめ':'つる')+'</small></button>').join('');
$('birds').textContent='つる '+(p.n-k)+'匹';$('turtles').textContent='かめ '+k+'匹';const actual=2*p.n+2*k;$('legs').textContent=actual+' / '+p.legs+'本';$('difference').textContent=correct?'ぴったり！':Math.abs(p.legs-actual)+'本 '+(actual<p.legs?'足りない':'多い');$('status').textContent=correct?'正解！ つる'+(p.n-k)+'匹・かめ'+k+'匹':'つる1匹をかめに替えると、足が2本増えるよ';$('minus').disabled=k===0;$('plus').disabled=k===p.n;$('bridge').classList.toggle('hidden',!correct);$('next').classList.toggle('hidden',!correct||idx===P.length-1);if(correct){done[idx]=true;save();$('base').textContent='全部つる：'+p.n+' × 2 = '+(p.n*2)+'本';$('extra').textContent='増えた '+(p.legs-p.n*2)+'本';$('formula').textContent='('+p.legs+' − '+p.n*2+') ÷ 2 = '+k+'匹（かめ）';renderTabs();}}
$('start').onclick=()=>{started=true;render()};$('plus').onclick=()=>{k=Math.min(P[idx].n,k+1);render()};$('minus').onclick=()=>{k=Math.max(0,k-1);render()};$('reset').onclick=()=>{k=0;render()};$('next').onclick=()=>{idx=Math.min(P.length-1,idx+1);k=0;render()};$('tabs').onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;if(b.dataset.i==='free'){alert('自由モードは次のバージョンで追加します');return}idx=Number(b.dataset.i);k=0;started=true;render()};$('animals').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;k=Math.max(0,Math.min(P[idx].n,k+(Number(b.dataset.a)<k?-1:1)));render()};$('clear').onclick=()=>{if(confirm('クリア記録をリセットしますか？')){done={};save();render()}};render();
})();
</script></body></html>
