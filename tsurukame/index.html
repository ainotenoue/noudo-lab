<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>つるかめ算の部屋｜miss maths</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#2f3437;font-family:'Hiragino Maru Gothic ProN',-apple-system,sans-serif;font-weight:700}main{max-width:1100px;margin:auto;padding:16px 24px}.question,.panel{background:white;border:2px solid #ebe5da;border-radius:24px;padding:20px;margin-bottom:12px}.question{font-size:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:13px;color:#9a5a12;background:#fff1dc;padding:6px 12px;border-radius:20px}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tabs button{padding:8px 12px}.tabs button.active{background:#ffe7c4;border-color:#d6a65b}.tabs button.done:after{content:' ✓';color:#3f9b4a}button,.back{font:inherit;font-size:14px;background:#fff;border:2px solid #e1d9cc;border-radius:30px;padding:10px 16px;cursor:pointer;color:#51483d;text-decoration:none}button:disabled{opacity:.35;cursor:default}.primary{background:#ffe7c4;border-color:#e8b66b}.stage{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.animals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:16px;background:#f3faef;border-radius:18px}.animal{background:white;border:2px solid #e5eddf;border-radius:14px;text-align:center;padding:8px 2px;cursor:pointer;touch-action:manipulation}.animal svg{width:100%;max-width:75px;height:58px}.animal small{display:block;font-size:11px}.stats{display:flex;justify-content:space-around;margin:14px 0}.count{font-size:18px}.target{text-align:center;background:#fff7e9;border-radius:18px;padding:22px 10px}.big{font-size:clamp(25px,4vw,43px)}.status{min-height:55px;text-align:center;margin:12px 0;color:#87531c}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}.note{font-size:13px;color:#827b71;line-height:1.7}.bridge{margin-top:18px;border-top:2px dashed #e8dfd1;padding-top:16px}.bridge h2{font-size:18px;margin:0 0 10px}.bars{display:flex;align-items:flex-end;gap:12px;height:120px;background:#fbfaf7;padding:12px;border-radius:14px}.bar{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px}.base{background:#add8e6;flex:2}.extra{background:#ffd1dc;flex:1}.hidden{display:none!important}@media(max-width:700px){main{padding:10px}.stage{grid-template-columns:1fr}.question,.panel{padding:14px}.animals{gap:4px;padding:8px}.animal{padding:5px 0}.animal svg{height:44px}.target{padding:12px}.top{align-items:flex-start}}
</style></head><body><main><section class="question"><div class="top"><span class="tag" id="tag">つるかめ算の部屋｜はじめに</span><span id="counter"></span></div><div id="question">つるをかめに入れ替えると、何が起きるだろう？</div><div class="tabs" id="tabs"></div></section><section class="panel">
<div id="intro"><h2>まずは、全部つるだと考えてみよう</h2><p>つるの足は2本。かめの足は4本。つるを1匹かめに入れ替えると、足は2本増えるよ。</p><p>動物をタップして入れ替えながら、ぴったりの数を探してみよう。</p><button class="primary" id="start">問題へ →</button></div>
<div id="game" class="hidden"><div class="stage"><div><div class="animals" id="animals"></div><div class="stats"><span class="count" id="birds"></span><span class="count" id="turtles"></span></div><div class="actions"><button id="minus">− かめ</button><button class="primary" id="plus">＋ かめ</button></div></div><div><div class="target"><div>いまの足の数 / めあて</div><div class="big" id="legs"></div><div id="difference"></div></div><p class="status" id="status" aria-live="polite"></p></div></div><div class="bridge hidden" id="bridge"><h2>図で見てみよう｜面積図への橋わたし</h2><p class="note">全部つるなら「匹数 × 2本」。かめに入れ替えた分だけ「2本ずつ」増える。</p><div class="bars"><div class="bar base" id="base"></div><div class="bar extra" id="extra"></div></div><p id="formula"></p></div><div class="footer"><a class="back" href="../">← 部屋への扉</a><button id="reset">はじめに戻す</button><button class="primary hidden" id="next">次の問題 →</button></div></div></section><p class="note">クリア記録はこのブラウザに保存されます。 <button id="clear">記録をリセット</button></p></main>
<script>
(()=>{'use strict';
const P=[{"n":10,"legs":28},{"n":8,"legs":24},{"n":12,"legs":34},{"n":15,"legs":42},{"n":9,"legs":26},{"n":14,"legs":40},{"n":20,"legs":56},{"n":18,"legs":48},{"n":16,"legs":44},{"n":25,"legs":70}];
const $=id=>document.getElementById(id);
const bird='<svg viewBox="0 0 80 65" aria-hidden="true"><path d="M15 38Q5 24 24 19Q35 4 48 19L60 18 74 24 59 30Q59 49 36 50L25 45Z" fill="#add8e6" stroke="#3f7f93" stroke-width="2"/><path d="M35 45L32 61M44 45L47 61M26 61h12M41 61h12" stroke="#b5607a" stroke-width="3" fill="none"/><circle cx="48" cy="23" r="2.5" fill="#2f3437"/></svg>';
const turtle='<svg viewBox="0 0 80 65" aria-hidden="true"><ellipse cx="39" cy="33" rx="29" ry="21" fill="#90ee90" stroke="#3f9b4a" stroke-width="2"/><path d="M22 20L40 13 57 21 62 35 48 49 28 47 16 34Z" fill="#69c77c" stroke="#3f9b4a" stroke-width="2"/><circle cx="69" cy="30" r="10" fill="#90ee90" stroke="#3f9b4a" stroke-width="2"/><circle cx="72" cy="27" r="2" fill="#2f3437"/><path d="M19 47v13M31 49v11M49 49v11M59 46v14" stroke="#3f9b4a" stroke-width="7" stroke-linecap="round"/></svg>';
let idx=0,k=0,started=false;let done={};try{done=JSON.parse(localStorage.getItem('tsurukame-done')||'{}')||{}}catch(e){}
function save(){try{localStorage.setItem('tsurukame-done',JSON.stringify(done))}catch(e){}}
function renderTabs(){$('tabs').innerHTML=P.map((p,i)=>'<button data-i="'+i+'" class="'+(idx===i?'active ':'')+(done[i]?'done':'')+'">'+(i+1)+'</button>').join('')+'<button data-i="free">じゆうに試す</button>';}
function render(){const p=P[idx],correct=k*4+(p.n-k)*2===p.legs;$('tag').textContent='つるかめ算の部屋｜問題 '+String(idx+1).padStart(2,'0');$('counter').textContent=(idx+1)+' / '+P.length;$('question').textContent='つるとかめが合わせて'+p.n+'匹。足は全部で'+p.legs+'本。つるとかめは何匹ずつ？';$('intro').classList.toggle('hidden',started);$('game').classList.toggle('hidden',!started);renderTabs();if(!started)return;
$('animals').innerHTML=Array.from({length:p.n},(_,i)=>'<button class="animal" data-a="'+i+'" aria-label="'+(i<k?'かめ':'つる')+'を入れ替える">'+(i<k?turtle:bird)+'<small>'+(i<k?'かめ':'つる')+'</small></button>').join('');
$('birds').textContent='つる '+(p.n-k)+'匹';$('turtles').textContent='かめ '+k+'匹';const actual=2*p.n+2*k;$('legs').textContent=actual+' / '+p.legs+'本';$('difference').textContent=correct?'ぴったり！':Math.abs(p.legs-actual)+'本 '+(actual<p.legs?'足りない':'多い');$('status').textContent=correct?'正解！ つる'+(p.n-k)+'匹・かめ'+k+'匹':'つる1匹をかめに替えると、足が2本増えるよ';$('minus').disabled=k===0;$('plus').disabled=k===p.n;$('bridge').classList.toggle('hidden',!correct);$('next').classList.toggle('hidden',!correct||idx===P.length-1);if(correct){done[idx]=true;save();$('base').textContent='全部つる：'+p.n+' × 2 = '+(p.n*2)+'本';$('extra').textContent='増えた '+(p.legs-p.n*2)+'本';$('formula').textContent='('+p.legs+' − '+p.n*2+') ÷ 2 = '+k+'匹（かめ）';renderTabs();}}
$('start').onclick=()=>{started=true;render()};$('plus').onclick=()=>{k=Math.min(P[idx].n,k+1);render()};$('minus').onclick=()=>{k=Math.max(0,k-1);render()};$('reset').onclick=()=>{k=0;render()};$('next').onclick=()=>{idx=Math.min(P.length-1,idx+1);k=0;render()};$('tabs').onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;if(b.dataset.i==='free'){alert('自由モードは次のバージョンで追加します');return}idx=Number(b.dataset.i);k=0;started=true;render()};$('animals').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;k=Math.max(0,Math.min(P[idx].n,k+(Number(b.dataset.a)<k?-1:1)));render()};$('clear').onclick=()=>{if(confirm('クリア記録をリセットしますか？')){done={};save();render()}};render();
})();
</script></body></html>
