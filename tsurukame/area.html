<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面積図で解く｜つるかめ算の部屋｜miss maths</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#303538;font-family:'Hiragino Maru Gothic ProN',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:700}main{max-width:1100px;margin:auto;padding:16px 24px}.question,.panel{background:#fff;border:2px solid #ebe5da;border-radius:24px;padding:18px 20px;margin-bottom:12px}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}.tag{font-size:13px;color:#8058a5;background:#f3eafd;padding:7px 12px;border-radius:22px}.tabs{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}button,.back{font:inherit;font-size:14px;border:2px solid #e1d9cc;border-radius:30px;padding:9px 14px;background:white;color:#51483d;cursor:pointer;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.32;cursor:default}.primary{background:#f0e4fc;border-color:#ba98d6}.tabs button{padding:7px 11px}.tabs button.active{background:#f0e4fc;border-color:#ba98d6}.tabs button.done:after{content:' ✓';color:#399b4d}#question{font-size:20px;margin-top:13px}.guide{font-size:14px;color:#736d66;margin:0 0 12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}.diagram{background:#f5f8f2;border:3px solid #dce8d4;border-radius:20px;padding:12px 12px 8px;box-shadow:inset 0 0 0 3px #fff}.diagram svg{width:100%;height:auto;display:block;touch-action:manipulation}.diagram [data-col]{cursor:pointer}.diagram [data-col]:hover{fill:#ffffff25}.diagram:active{border-color:#a6caa0}.side{background:#fff7e9;border-radius:18px;padding:16px;text-align:center}.side .label{font-size:14px}.big{font-size:clamp(26px,3.6vw,43px);margin:8px 0}.difference{font-size:16px;margin:4px 0 12px}.actions{display:flex;justify-content:center;gap:8px}.actions button{padding:10px 12px}.count{margin-top:12px;font-size:17px}.hint{margin-top:8px;text-align:left;background:#f7f2fc;border-radius:12px;padding:12px;font-size:14px;line-height:1.8}.hint button{font-size:12px;padding:6px 10px}.hintText{margin-top:0}.hint{white-space:nowrap;overflow-x:auto;scrollbar-width:thin}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 2px;color:#716b65;font-size:13px}.swatch{display:inline-block;width:14px;height:14px;vertical-align:-2px;border-radius:3px;margin-right:4px}.formula{margin-top:10px;min-height:25px;font-size:15px;color:#655b6e}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px}.note{font-size:12px;color:#807970}.correct{color:#4d8c47}.successMark{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);width:154px;height:154px;border:13px solid #e6a45c;border-radius:50%;color:#d68a37;font-size:100px;line-height:125px;text-align:center;background:#fffaf2e8;pointer-events:none;z-index:99;animation:successPop 1.15s ease-out forwards}@keyframes successPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}40%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}.hidden{display:none!important}@media(max-width:700px){main{padding:10px}.question,.panel{padding:12px}.layout{grid-template-columns:1fr}.side{padding:10px}.hint{padding:8px}.big{margin:2px 0}.actions{margin-top:6px}.count{margin-top:6px}#question{font-size:17px}.tabs button{padding:6px 9px}.diagram{padding:4px}}
</style></head><body><main>
<section class="question"><div class="top"><span class="tag" id="tag">つるかめ算の部屋｜STAGE B</span><div class="tabs" id="tabs"></div></div><div id="question"></div></section>
<section class="panel"><p class="guide">タイルをタップして、足の数をゴールに合わせよう。</p>
<div class="layout"><div class="diagram"><svg id="area" viewBox="0 0 850 245" role="img" aria-label="足の本数を表す面積図。各列をタップするとかめに入れ替わります"></svg></div>
<div class="side"><div class="label">いまの足の数 / ゴール</div><div class="big" id="legs"></div><div class="difference" id="difference"></div><div class="actions"><button id="minus">− 1匹</button><button class="primary" id="plus">＋ 1匹</button></div><div class="count" id="count"></div></div></div>
<div class="formula" id="formula"></div><div class="hint hidden" id="hint"><strong>考え方：</strong><span class="hintText" id="hintText"></span></div><div class="footer"><a class="back" href="../">← ひろばに戻る</a><a class="back" href="./index.html">STAGE A｜動かして発見</a><button id="reset">はじめに戻す</button><button id="next" class="primary hidden">次の問題 →</button></div></section><p class="note">STAGE Bのクリア記録は、このブラウザに別々に保存されます。</p>
</main><script>
(()=>{'use strict';
const P=[{"n":10,"legs":28},{"n":8,"legs":24},{"n":12,"legs":34},{"n":15,"legs":42},{"n":9,"legs":26},{"n":14,"legs":40},{"n":20,"legs":56},{"n":18,"legs":48},{"n":16,"legs":44},{"n":25,"legs":70}],$=id=>document.getElementById(id);let idx=0,k=0,wasCorrect=false;let done={};try{done=JSON.parse(localStorage.getItem('tsurukame-area-done')||'{}')||{}}catch(e){}
const crane='<g id="cranePrint" fill="none" stroke="#397c91" stroke-width="2.5" stroke-linecap="round"><path d="M12 18V9M12 10L4 3M12 10L12 2M12 10L20 3M12 17L18 20"/></g>';
const turtle='<g id="turtlePrint" fill="#3c803f"><ellipse cx="12" cy="14" rx="6" ry="5"/><circle cx="4" cy="7" r="2.3"/><circle cx="9" cy="4" r="2.3"/><circle cx="15" cy="4" r="2.3"/><circle cx="20" cy="7" r="2.3"/></g>';
function save(){try{localStorage.setItem('tsurukame-area-done',JSON.stringify(done))}catch(e){}}
function renderTabs(){$('tabs').innerHTML=P.map((p,i)=>'<button data-i="'+i+'" class="'+(idx===i?'active ':'')+(done[i]?'done':'')+'">'+(i+1)+'</button>').join('')}
function renderDiagram(p){
const n=p.n,w=760/n,x0=54,y0=238,h=105,actual=2*n+2*k;
let s='<defs>'+crane+turtle+'</defs>';


s+='<line x1="49" y1="'+y0+'" x2="822" y2="'+y0+'" stroke="#a7a198" stroke-width="2"/>';
for(let i=0;i<n;i++){const x=x0+i*w,t=i<k,sc=Math.min(.85,(w-4)/50),gap=26*sc,l=x+w/2-gap/2-12*sc;
function prints(y){return '<use href="#'+(t?'turtlePrint':'cranePrint')+'" transform="translate('+l+' '+(y+53-11*sc)+') scale('+sc+')"/><use href="#'+(t?'turtlePrint':'cranePrint')+'" transform="translate('+(l+gap)+' '+(y+53-11*sc)+') scale('+sc+')"/>'}
s+='<rect x="'+x+'" y="'+(y0-h)+'" width="'+w+'" height="'+h+'" fill="'+(t?'#a6d69a':'#add8e6')+'" stroke="#ffffff" stroke-width="2.5"/>'+prints(y0-h);
if(t){s+='<rect x="'+x+'" y="'+(y0-2*h)+'" width="'+w+'" height="'+h+'" fill="#ffd1dc" stroke="white" stroke-width="1.5"/>'+prints(y0-2*h)}
s+='<rect data-col="'+i+'" x="'+x+'" y="'+(y0-2*h)+'" width="'+w+'" height="'+(2*h)+'" fill="transparent" stroke="#a5bca0" stroke-width="1" stroke-dasharray="4 4" rx="3" style="cursor:pointer"/>';
}


$('area').innerHTML=s;
$('area').setAttribute('aria-label',n+'列の面積図。かめ'+k+'匹、足'+actual+'本。目標'+p.legs+'本');
}
function celebrate(){const el=document.createElement('div');el.className='successMark';el.textContent='○';document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove())}
function render(){const p=P[idx],actual=2*p.n+2*k,correct=actual===p.legs;renderTabs();$('tag').textContent='つるかめ算の部屋｜STAGE B｜問題 '+String(idx+1).padStart(2,'0');$('question').textContent='つるとかめが合わせて'+p.n+'匹。足は全部で'+p.legs+'本。つるとかめは何匹ずつ？';$('legs').textContent=actual+' / '+p.legs+'本';$('difference').textContent=correct?'正解！ つる'+(p.n-k)+'匹・かめ'+k+'匹':Math.abs(p.legs-actual)+'本 '+(actual<p.legs?'足りない':'多い');$('difference').classList.toggle('correct',correct);$('count').textContent='かめ '+k+'匹 ／ つる '+(p.n-k)+'匹';$('minus').disabled=k===0;$('plus').disabled=k===p.n;$('hint').classList.toggle('hidden',!correct);$('hintText').textContent='全部つるなら '+p.n+' × 2 = '+(2*p.n)+'本。足りないのは '+(p.legs-2*p.n)+'本。かめ1匹につき2本増えるから、'+(p.legs-2*p.n)+' ÷ 2 = '+((p.legs-2*p.n)/2)+'匹。';$('formula').textContent=correct?'式で確認：('+p.legs+' − '+(2*p.n)+') ÷ 2 = '+k+'匹（かめ）':'青・緑のタイル '+(2*p.n)+'本 ＋ ピンク '+(2*k)+'本 = '+actual+'本';$('next').classList.toggle('hidden',!correct||idx===P.length-1);renderDiagram(p);if(correct&&!wasCorrect)celebrate();wasCorrect=correct;if(correct&&!done[idx]){done[idx]=true;save();renderTabs()}}
$('plus').onclick=()=>{k=Math.min(P[idx].n,k+1);render()};$('minus').onclick=()=>{k=Math.max(0,k-1);render()};$('reset').onclick=()=>{k=0;render()};$('next').onclick=()=>{idx=Math.min(idx+1,P.length-1);k=0;render()};$('tabs').onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;idx=Number(b.dataset.i);k=0;render()};$('area').addEventListener('click',e=>{const el=e.target.closest('[data-col]');if(!el)return;const i=Number(el.dataset.col);k=Math.max(0,Math.min(P[idx].n,k+(i<k?-1:1)));render()});render();
})();
</script></body></html>
