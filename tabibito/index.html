.panel{background:var(--card);border:2px solid var(--edge);border-radius:26px;padding:12px 22px 12px}

.first .opts{display:flex;gap:10px}
.first .opts button{font-size:18px;padding:8px 18px;background:#fff;border-color:#e8c48a;color:#7a4f12}
.first .opts .no{display:inline-block;margin-right:8px;font-size:20px;color:#c07a1c}
.successMark{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);width:154px;height:154px;border:13px solid #e6a45c;border-radius:50%;color:#d68a37;font-size:100px;line-height:125px;text-align:center;background:#fffaf2e8;pointer-events:none;z-index:99;animation:successPop 1.15s ease-out forwards}
@keyframes successPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}40%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
@media(prefers-reduced-motion:reduce){.successMark{animation:none;opacity:0}}
.first .msg{font-size:15px;font-weight:700;color:#9a5a12}
.first.ok{background:var(--green-s)}
.first.ok .q1{color:#25642c}
.first .shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.diagram{width:100%;height:auto;display:block;max-height:430px;touch-action:none;user-select:none;-webkit-user-select:none;font-family:inherit}
.diagram:focus{outline:none}
.locked .thandle{opacity:.35}

.panel-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:48px}
.back{justify-self:start;font-size:14px;padding:6px 14px;color:#5b737b;text-decoration:none;font-weight:800;border:2px solid var(--edge);border-radius:999px;background:#fff}
.check{visibility:hidden;background:var(--green-s);border-radius:16px;padding:8px 22px;text-align:center;color:#2f5f35;line-height:1.5}
.check.on{visibility:visible;animation:pop .35s ease-out}
.check b{display:block;font-size:22px;color:#25642c}

<script>
(()=>{
const $=id=>document.getElementById(id), svg=$('diagram');
/* ===== 問題 =====
   kind 'meet'  … 出会い（向かい合って進む）→ 1分で「速さの和」だけ ちぢまる
   kind 'chase' … 追いかけ（同じ向きに進む）→ 1分で「速さの差」だけ ちぢまる
   a … 兄（青）の速さ　b … 弟（ピンク）の速さ（分速m）
   d … 兄が出発するときの2人のあいだ（m）　pre … 追いかけで、弟が先に出た分数（あれば） */
const PROBLEMS=[
  {kind:'meet',tag:'出会い算',a:90,b:60,d:1200,
   text:'兄と弟が1200mはなれた所から、向かい合って同時に出発しました。兄は分速90m、弟は分速60mです。2人は何分後に出会いますか？'},
  {kind:'chase',tag:'追いかけ算',a:90,b:60,d:600,
   text:'弟が兄より600m先にいます。同じ向きに同時に出発し、兄は分速90m、弟は分速60mで進みます。兄は何分後に弟に追いつきますか？'},
  {kind:'meet',tag:'出会い算',a:80,b:70,d:1500,
   text:'1500mはなれた2地点から、兄と弟が向かい合って同時に出発しました。兄は分速80m、弟は分速70mです。2人は何分後に出会いますか？'},
  {kind:'chase',tag:'追いかけ算',a:80,b:50,d:900,
   text:'弟が兄より900m先にいます。同じ向きに同時に出発し、兄は分速80m、弟は分速50mで進みます。兄は何分後に弟に追いつきますか？'},
  {kind:'meet',tag:'出会い算',a:120,b:80,d:2000,
   text:'兄と弟が2kmはなれた所から、向かい合って同時に出発しました。兄は分速120m、弟は分速80mです。2人は何分後に出会いますか？'},
  {kind:'chase',tag:'追いかけ算｜あとから出発',a:100,b:60,pre:4,
   text:'弟が家を出てから4分後に、兄が同じ道を追いかけました。弟は分速60m、兄は分速100mです。兄は家を出てから何分後に弟に追いつきますか？'}
];
let idx=0,P=PROBLEMS[0],t=0,picked=false,drag=false;
let done={};try{done=JSON.parse(localStorage.getItem('tabibito-done')||'{}')||{};}catch(e){done={};}
const saveDone=()=>{try{localStorage.setItem('tabibito-done',JSON.stringify(done));}catch(e){}};
const gap0=()=>P.pre?P.b*P.pre:P.d;                       // 兄が出発するときのあいだ
const rate=()=>P.kind==='meet'?P.a+P.b:P.a-P.b;          // 1分でちぢまる道のり
const ans=()=>gap0()/rate();                              // 出会う（追いつく）までの分数
const tmax=()=>Math.ceil(ans()*1.5);
const solved=()=>picked&&Math.abs(t-ans())<1e-9;

const X0=80,X1=1020,RY=170;   // 道のはし・道の高さ
const txt=(x,y,s,o={})=>'<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'middle')+'" dominant-baseline="central" font-size="'+(o.fs||20)+'" font-weight="'+(o.fw||800)+'" fill="'+(o.c||'#2f3437')+'">'+s+'</text>';
const tw=(s,fs)=>{let w=0;for(const ch of String(s))w+=/[ -~]/.test(ch)?0.6:1;return w*fs;};
function dim(xa,xb,y,s,col,fs){
  fs=fs||20;const w=tw(s,fs)+16;
  if(xb-xa<4)return '';
  return '<line x1="'+xa+'" y1="'+y+'" x2="'+xb+'" y2="'+y+'" stroke="'+col+'" stroke-width="3"/>'+
    '<line x1="'+xa+'" y1="'+(y-9)+'" x2="'+xa+'" y2="'+(y+9)+'" stroke="'+col+'" stroke-width="3"/><line x1="'+xb+'" y1="'+(y-9)+'" x2="'+xb+'" y2="'+(y+9)+'" stroke="'+col+'" stroke-width="3"/>'+
    '<rect x="'+((xa+xb)/2-w/2)+'" y="'+(y-15)+'" width="'+w+'" height="30" rx="8" fill="#fff"/>'+txt((xa+xb)/2,y+1,s,{fs,c:col});
}
/* 人: まるい頭と体。dir=1 右向き。met=出会った瞬間（ブルーローズ・ひと回り大きく） */
const ROSE='#c9b8ec',ROSE_D='#7b62c4';
function person(x,y,col,dark,name,v,dir,la,met){
  la=la||'middle';const lx=la==='end'?-8:la==='start'?8:0;
  const fc=met?ROSE:col,sc=met?ROSE_D:dark,k=met?1.22:1;
  return '<g transform="translate('+x+','+y+')"><g transform="scale('+k+')">'+
    '<circle cx="0" cy="-46" r="13" fill="'+(met?'#f6f1ff':'#fff')+'" stroke="'+sc+'" stroke-width="3"/>'+
    '<rect x="-14" y="-31" width="28" height="30" rx="12" fill="'+fc+'" stroke="'+sc+'" stroke-width="3"/>'+
    '<path d="M'+(dir*18)+' -16 l'+(dir*12)+' 0 m'+(-dir*5)+' -5 l'+(dir*5)+' 5 l'+(-dir*5)+' 5" fill="none" stroke="'+sc+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>'+
    txt(lx,met?-84:-76,name+' 分速'+v+'m',{a:la,fs:16,c:dark})+'</g>';
}
function draw(){
  const g0=gap0(),r=rate(),T=tmax();
  // 道の長さ（m）: 出会い＝d、追いかけ＝あいだ＋弟が進む分
  const L=P.kind==='meet'?P.d:g0+P.b*T;
  const k=(X1-X0)/L, X=m=>X0+m*k;
  const ok=solved();
  let h='';
  // 道
  h+='<line x1="'+X0+'" y1="'+RY+'" x2="'+X1+'" y2="'+RY+'" stroke="'+(ok?'#3f9b4a':'#cfc8bb')+'" stroke-width="'+(ok?8:6)+'" stroke-linecap="round"/>';
  let xa,xb,startA=0,startB;
  if(P.kind==='meet'){startB=P.d;xa=X(P.a*t);xb=X(P.d-P.b*t);}
  else{startB=g0;xa=X(P.a*t);xb=X(g0+P.b*t);}
  // 家・スタートの印
  h+='<line x1="'+X0+'" y1="'+(RY-14)+'" x2="'+X0+'" y2="'+(RY+14)+'" stroke="#9a9184" stroke-width="3"/>';
  if(P.kind==='meet')h+='<line x1="'+X1+'" y1="'+(RY-14)+'" x2="'+X1+'" y2="'+(RY+14)+'" stroke="#9a9184" stroke-width="3"/>';
  if(P.pre)h+=txt(X0-12,RY,'家',{a:'end',fs:16,c:'#7b766d'});
  // 進んだ道のり（色の帯）と1分ごとの目盛り
  const band=(m0,m1,y,col)=>'<line x1="'+X(m0)+'" y1="'+y+'" x2="'+X(m1)+'" y2="'+y+'" stroke="'+col+'" stroke-width="10" stroke-linecap="round" opacity=".9"/>';
  if(t>0){
    h+=band(0,P.a*t,RY+26,'#add8e6');
    if(P.kind==='meet')h+=band(P.d-P.b*t,P.d,RY+26,'#ffd1dc');
    else h+=band(g0,g0+P.b*t,RY+42,'#ffd1dc');
    if(P.pre)h+='<line x1="'+X(0)+'" y1="'+(RY+42)+'" x2="'+X(g0)+'" y2="'+(RY+42)+'" stroke="#ffd1dc" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 14"/>';
    for(let i=1;i<=Math.floor(t+1e-9);i++){
      h+='<circle cx="'+X(P.a*i)+'" cy="'+(RY+26)+'" r="3" fill="#3d9cc2"/>';
      const mb=P.kind==='meet'?P.d-P.b*i:g0+P.b*i;
      h+='<circle cx="'+X(mb)+'" cy="'+(RY+(P.kind==='meet'?26:42))+'" r="3" fill="#e2708f"/>';
    }
  }
  // 追いかけ: 弟が先に出た分
  if(P.pre)h+=dim(X0,X(g0),RY+82,'先に '+P.b+'×'+P.pre+'＝'+g0+'m','#b5607a',16);
  // 2人のあいだ（いちばん大事な量）
  const gs=gap0()-rate()*t,met=Math.abs(gs)<1e-9,gp=Math.abs(gs),lo=Math.min(xa,xb),hi=Math.max(xa,xb);
  if(!met)h+=dim(lo,hi,RY-112,'あいだ '+gp+'m','#9a5a12',22);
  else h+='<rect x="'+(xa-90)+'" y="'+(RY-148)+'" width="180" height="40" rx="20" fill="#90ee90"/>'+txt(xa,RY-127,P.kind==='meet'?'出会った！':'追いついた！',{fs:22,c:'#25642c'});
  // 人
  /* 2人が近いときは、名前を左右に分けて重ならないようにする */
  const near=Math.abs(xa-xb)<150;
  h+=person(xb,RY-4,'#ffd1dc','#d9849b','弟',P.b,P.kind==='meet'?-1:1,near?'start':'middle',met);
  h+=person(xa,RY-4,'#add8e6','#3d9cc2','兄',P.a,1,near?'end':'middle',met);
  // はじめのあいだ（道の下）
  if(!P.pre)h+=dim(X(0),X(g0),RY+82,'はじめのあいだ '+g0+'m','#7b766d',16);
  // 時間のつまみ
  const TX0=160,TX1=940,TY=345,tx=TX0+(TX1-TX0)*t/T;
  h+=txt(TX0-20,TY,'時間',{a:'end',fs:18,c:'#7b766d'});
  h+='<line x1="'+TX0+'" y1="'+TY+'" x2="'+TX1+'" y2="'+TY+'" stroke="#e2dccf" stroke-width="10" stroke-linecap="round"/>';
  h+='<line x1="'+TX0+'" y1="'+TY+'" x2="'+tx+'" y2="'+TY+'" stroke="#90ee90" stroke-width="10" stroke-linecap="round"/>';
  for(let i=0;i<=T;i++){const x=TX0+(TX1-TX0)*i/T;h+='<line x1="'+x+'" y1="'+(TY+10)+'" x2="'+x+'" y2="'+(TY+16)+'" stroke="#c9c3b8" stroke-width="2"/>';}
  h+='<g class="thandle" id="th"><rect x="'+(tx-40)+'" y="'+(TY-30)+'" width="80" height="60" fill="transparent"/>'+
    '<circle cx="'+tx+'" cy="'+TY+'" r="18" fill="#fff" stroke="#3f9b4a" stroke-width="4"/>'+txt(tx,TY+1,'↔',{fs:18,c:'#3f9b4a'})+'</g>';
  h+='<rect x="'+(tx-48)+'" y="'+(TY-64)+'" width="96" height="34" rx="17" fill="#90ee90"/>'+txt(tx,TY-46,fmt(t)+'分後',{fs:19,c:'#25642c'});
  $('art').innerHTML=h;
}
const fmt=n=>Number(n.toFixed(2)).toString();

/* 初動: たす？ひく？ */
/* 初動で正解したら、大きな○ */
/* ===== 効果音（Web Audio） ===== */
let actx=null;
function audio(){
  try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC();}
  if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}
}
// tone(周波数Hz, 長さ秒, 波形, 音量, 開始の遅れ秒)
function tone(f,d,type,vol,delay){
  const c=audio();if(!c)return;
  type=type||'sine';vol=vol==null?.035:vol;delay=delay||0;
  const t0=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02);
}
// 初動の正解音（ピンポン）
const firstSound=()=>{tone(590,.10);tone(790,.13,'sine',.035,.08);};
// 出会った／追いついたときの音（ドミソド↑）
const meetSound=()=>{tone(523,.12,'sine',.034);tone(659,.12,'sine',.034,.09);tone(784,.14,'sine',.034,.18);tone(1047,.32,'sine',.038,.27);tone(1568,.30,'triangle',.012,.27);};
// iPad: 最初のタッチで音を使えるようにする
document.addEventListener('touchstart',function un(){audio();document.removeEventListener('touchstart',un);},{passive:true});
function celebrate(){const el=document.createElement('div');el.className='successMark';el.textContent='○';el.setAttribute('aria-hidden','true');document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());}
function renderFirst(){
  const A=P.a,B=P.b,el=$('first');
  el.classList.toggle('ok',picked);
  if(picked){
    $('q1').textContent='1分間に '+(P.kind==='meet'?A+'＋'+B:A+'－'+B)+'＝'+rate()+'m ちぢまる';
    $('opts').innerHTML='';
    $('msg').textContent='時間を進めて、あいだが0mになるところをさがそう';
  }else{
    $('q1').textContent='2人のあいだは、1分間に何mちぢまる？';
    $('opts').innerHTML='<button data-op="add"><span class="no">①</span>'+A+'＋'+B+'＝'+(A+B)+'m</button><button data-op="sub"><span class="no">②</span>'+A+'－'+B+'＝'+(A-B)+'m</button>';
    $('msg').textContent='';
  }
  svg.classList.toggle('locked',!picked);
}
$('opts').addEventListener('click',e=>{
  const b=e.target.closest('button[data-op]');if(!b)return;
  const right=(b.dataset.op==='add')===(P.kind==='meet');
  if(right){picked=true;renderFirst();update();celebrate();firstSound();}
  else{
    b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
    $('msg').textContent=P.kind==='meet'?'向かい合っているね。2人とも近づくよ':'同じ向きだね。兄が速い分だけ近づくよ';
  }
});

function updateCheck(){
  const el=$('check');
  if(!solved()){el.classList.remove('on');el.innerHTML='';$('nextq').hidden=true;return;}
  if(el.classList.contains('on'))return;
  if(!done[idx]){done[idx]=1;saveDone();renderTabs();}
  const head=P.kind==='meet'?'できた！ 答え '+fmt(ans())+'分後に出会う':'できた！ 答え '+fmt(ans())+'分後に追いつく';
  const op=P.kind==='meet'?'('+P.a+'＋'+P.b+')':'('+P.a+'－'+P.b+')';
  const ln=(P.pre?P.b+'×'+P.pre+'＝'+gap0()+'m ／ ':'')+gap0()+' ÷ '+op+' ＝ '+fmt(ans())+'分';
  el.innerHTML='<b>'+head+'</b><span>'+ln+'</span>';el.classList.add('on');meetSound();
  $('nextq').hidden=idx>=PROBLEMS.length-1;
}
function update(){draw();updateCheck();}
function setT(v){if(!picked)return;t=Math.max(0,Math.min(tmax(),Math.round(v)));update();}

/* 時間のつまみをドラッグ */
function localPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):null;}
svg.addEventListener('pointerdown',e=>{
  if(!picked)return;
  const l=localPt(e);if(!l||l.y<280)return;   // 時間のつまみのあたりだけ
  drag=true;svg.setPointerCapture(e.pointerId);setT((l.x-160)/(940-160)*tmax());e.preventDefault();
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const l=localPt(e);if(l)setT((l.x-160)/(940-160)*tmax());});
const stop=()=>drag=false;svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
svg.setAttribute('tabindex','0');
svg.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){setT(t+1);e.preventDefault();}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){setT(t-1);e.preventDefault();}});

function renderTabs(){
  $('tabs').innerHTML='<button class="introb" id="introOpen">はじめに</button>'+PROBLEMS.map((q,j)=>'<button data-i="'+j+'" aria-pressed="'+(j===idx)+'"'+(done[j]?' class="done"':'')+'>'+(j+1)+'</button>').join('');
}
function load(i){
  idx=i;P=PROBLEMS[i];t=0;picked=false;
  $('qTag').textContent='問題 '+String(i+1).padStart(2,'0')+'｜'+P.tag;
  $('qText').textContent=P.text;
  renderTabs();renderFirst();
  $('check').classList.remove('on');$('nextq').hidden=true;
  update();
}
$('reset').addEventListener('click',()=>load(idx));
$('nextq').addEventListener('click',()=>{if(idx<PROBLEMS.length-1)load(idx+1);});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)load(+b.dataset.i);});
$('clearRec').addEventListener('click',()=>{if(!confirm('この部屋の記録（クリアした問題の✓）を消して、はじめからにします。\nよろしいですか？'))return;done={};try{localStorage.removeItem('tabibito-done');}catch(e){}load(0);});
/* はじめに: 初回だけ自動で出す。2回目からは「はじめに」ボタンで開く */
const INTRO_KEY='mm-intro-tabibito';
let started=false;
function startRoom(){started=true;const hq=/^#q(\d+)$/.exec(location.hash);load(hq?Math.max(0,Math.min(PROBLEMS.length-1,+hq[1]-1)):0);}
function showIntro(){$('intro').hidden=false;$('roomMain').hidden=true;window.scrollTo(0,0);}
function hideIntro(){$('intro').hidden=true;$('roomMain').hidden=false;try{localStorage.setItem(INTRO_KEY,'1');}catch(e){}if(!started)startRoom();}
$('introGo').addEventListener('click',hideIntro);
$('tabs').addEventListener('click',e=>{if(e.target.closest('#introOpen'))showIntro();});
let seen=false;try{seen=localStorage.getItem(INTRO_KEY)==='1';}catch(e){}
if(seen||/^#q\d+$/.test(location.hash))startRoom();else showIntro();
})();
</script></body></html>
