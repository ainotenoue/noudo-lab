<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ニュートン算の部屋｜miss maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#f7f5ef;--ink:#2f3437;--ink2:#7b766d;--card:#fff;--edge:#ebe5da;--green-d:#3f9b4a;--green-s:#ebfbea}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Hiragino Maru Gothic ProN','M PLUS Rounded 1c',-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:1200px;margin:0 auto;padding:15px 28px 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.question{margin:0 0 10px;background:var(--card);border:2px solid var(--edge);border-radius:22px;padding:20px 26px;line-height:1.7;font-size:clamp(17px,2vw,21px);font-weight:800}
.question small{display:inline-block;font-size:13px;color:var(--green-d);background:var(--green-s);border-radius:999px;padding:2px 12px;font-weight:800}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;white-space:nowrap;border:2px solid #b9e6b9;border-radius:999px;padding:5px 14px;font-size:14px;background:var(--green-s);font-weight:800;color:#2f6f37;touch-action:manipulation}
button:active{transform:translateY(1px)}
.tabs button{width:38px;height:38px;padding:0;font-size:15px;background:#fff;border-color:var(--edge);color:var(--ink2)}
.tabs button.done{background:#f3f0e8;color:#9a9488;border-color:#e2dccf}
.tabs button.done::after{content:"✓";font-size:10px;vertical-align:super;margin-left:1px;color:var(--green-d)}
.tabs button[aria-pressed="true"]{background:var(--green-s);border-color:#9fd99f;color:#2f6f37}
.panel{background:var(--card);border:2px solid var(--edge);border-radius:26px;padding:12px 22px 12px}
/* 初動: まず「たす？ひく？」を決める */
.first{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff7e9;border-radius:18px;padding:10px 16px}
.first .q1{font-size:18px;font-weight:800}
.first .opts{display:flex;gap:10px}
.first .opts button{font-size:18px;padding:8px 18px;background:#fff;border-color:#e8c48a;color:#7a4f12}
.first .opts .no{display:inline-block;margin-right:8px;font-size:20px;color:#c07a1c}
.successMark{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);width:154px;height:154px;border:13px solid #e6a45c;border-radius:50%;color:#d68a37;font-size:100px;line-height:125px;text-align:center;background:#fffaf2e8;pointer-events:none;z-index:99;animation:successPop 1.15s ease-out forwards}
@keyframes successPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}40%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
@media(prefers-reduced-motion:reduce){.successMark{animation:none;opacity:0}}
.first .msg{font-size:15px;font-weight:700;color:#9a5a12}
.first.ok{background:var(--green-s)}
.first.ok .q1{color:#25642c}
.first .shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.diagram{width:100%;height:auto;display:block;max-height:430px;touch-action:none;user-select:none;-webkit-user-select:none;font-family:inherit}
.diagram:focus{outline:none}
.locked .thandle{opacity:.35}
.thandle{cursor:grab}
.panel-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:48px}
.back{justify-self:start;font-size:14px;padding:6px 14px;color:#5b737b;text-decoration:none;font-weight:800;border:2px solid var(--edge);border-radius:999px;background:#fff}
.check{visibility:hidden;background:var(--green-s);border-radius:16px;padding:8px 22px;text-align:center;color:#2f5f35;line-height:1.5}
.check.on{visibility:visible;animation:pop .35s ease-out}
.check b{display:block;font-size:22px;color:#25642c}
.check span{display:block;font-size:18px;font-weight:700;margin-top:2px}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.fbtns{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#nextq{background:#90ee90;border-color:#6fd16f;color:#1f5a26}
#reset{background:#fff}
.rnote{text-align:center;font-size:12px;color:var(--ink2);font-weight:700;margin:10px 0 0}
.clearrec{margin-left:10px;background:none;border:0;padding:0;font-size:12px;color:var(--ink2);text-decoration:underline;font-weight:700}
/* 式: 数字の下に、その数字が何かを小さく書く */
.fxrow{display:inline-flex;align-items:center;gap:10px;vertical-align:middle}
.fxtag{color:#fff;font-size:14px;font-weight:800;border-radius:999px;padding:4px 12px;white-space:nowrap}
.fx{display:inline-flex;align-items:flex-start;gap:7px}
.check .fx{display:flex;justify-content:center;margin-top:4px}
.fxpair{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin-top:4px}.fxpair .fx{margin-top:0}
.fx .tk{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.fx .n{font-size:20px;font-weight:800;color:#2f3437;padding:0 2px;border-bottom:2px solid #e2dccf}
.fx .c{font-size:11px;font-weight:700;color:#9a9184;margin-top:2px;white-space:nowrap}
.fx .op{font-size:18px;font-weight:800;color:#9a9184;line-height:1.3}
.fx .res .n{border-bottom-color:transparent;color:inherit;font-size:21px}
/* はじめに（解説ページ） */
.intro h2.ititle{margin:6px 0 0;font-size:clamp(19px,2.2vw,24px);font-weight:800;line-height:1.5}
.introsvg{width:100%;height:auto;display:block;max-height:560px;font-family:inherit}
.ifoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.ifoot a{font-size:14px;padding:6px 14px;color:#5b737b;text-decoration:none;font-weight:800;border:2px solid var(--edge);border-radius:999px;background:#fff}
#introGo{font-size:16px;padding:8px 22px;background:#90ee90;border-color:#6fd16f;color:#1f5a26}
.tabs button.introb{width:auto;padding:0 14px;margin-right:6px;background:#fff}
@media(max-width:760px){main{padding:12px}.question{padding:16px}.panel{padding:10px}}
@media(prefers-reduced-motion:reduce){.check.on,.first .shake{animation:none}}
</style></head><body><main><h1 class="sr">ニュートン算の部屋</h1>
<div id="intro" class="intro" hidden>
<div class="question"><small>ニュートン算の部屋｜はじめに</small><h2 class="ititle">ふえる分を引いて、1分でへる量を出す</h2></div>
<section class="panel"><svg class="introsvg" viewBox="0 0 1100 500" role="img" aria-label="ニュートン算：へらす量からふえる量を引くと、1分でへる量。はじめの量をそれで割る"><rect x="20" y="20" width="1060" height="460" rx="24" fill="#f2f9fb" stroke="#9fd2e4" stroke-width="3"/><text x="550" y="62" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#24617a">へらしている間も、ふえ続ける</text><text x="300" y="150" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="800" fill="#7b766d">1分ごとに</text><rect x="120" y="190" width="160" height="40" rx="8" fill="#dff3df" stroke="#5cbf5c" stroke-width="2.5"/><text x="200" y="211" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#2f6f37">へらす 10人</text><rect x="320" y="190" width="70" height="40" rx="8" fill="#fff1dc" stroke="#e8a24f" stroke-width="2.5"/><text x="355" y="211" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="800" fill="#9a5a12">ふえる 4</text><text x="300" y="280" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="800" fill="#2f3437">行列は 1分に 10－4＝6人 へる</text><rect x="620" y="120" width="420" height="190" rx="18" fill="#fff" stroke="#ebe5da" stroke-width="2"/><text x="830" y="160" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="800" fill="#7b766d">流水算と同じ形</text><text x="830" y="205" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#3d9cc2">上りの速さ ＝ 静水時 － 流れ</text><text x="830" y="250" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="#2f6f37">1分でへる ＝ へらす － ふえる</text><text x="550" y="400" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="800" fill="#2f3437">なくなるまで ＝ はじめの量 ÷ 1分でへる量</text></svg>
<div class="ifoot"><a href="../">← 部屋への扉</a><button id="introGo">問題へ →</button></div></section>
</div>
<div id="roomMain">
<div class="question"><div class="qtop"><small id="qTag"></small><div class="tabs" id="tabs"></div></div><div id="qText"></div></div>
<section class="panel">
  <div class="first" id="first">
    <span class="q1" id="q1">1分で、いくつへる？</span>
    <span class="opts" id="opts"></span>
    <span class="msg" id="msg"></span>
  </div>
  <svg class="diagram locked" id="diagram" viewBox="0 0 1100 400" role="img" aria-label="ニュートン算の図。つまみで時間を動かすと、のこりがへっていきます"><g id="art"></g></svg>
  <div class="panel-foot"><a class="back" href="../">← 部屋への扉</a><div class="check" id="check" role="status" aria-live="polite"></div><div class="fbtns"><button id="nextq" hidden>次の問題 →</button><button id="reset">はじめに戻す</button></div></div>
</section>
<p class="rnote">記録はこのiPadのブラウザに保存されます。<button id="clearRec" class="clearrec">記録をリセット</button></p>
</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), svg=$('diagram');
const txt=(x,y,s,o={})=>'<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'middle')+'" dominant-baseline="central" font-size="'+(o.fs||20)+'" font-weight="'+(o.fw||800)+'" fill="'+(o.c||'#2f3437')+'">'+s+'</text>';
const tw=(s,fs)=>{let w=0;for(const ch of String(s))w+=/[ -~]/.test(ch)?0.6:1;return w*fs;};
function dim(xa,xb,y,s,col,fs){
  fs=fs||20;const w=tw(s,fs)+16;
  if(xb-xa<4)return '';
  return '<line x1="'+xa+'" y1="'+y+'" x2="'+xb+'" y2="'+y+'" stroke="'+col+'" stroke-width="3"/>'+
    '<line x1="'+xa+'" y1="'+(y-9)+'" x2="'+xa+'" y2="'+(y+9)+'" stroke="'+col+'" stroke-width="3"/><line x1="'+xb+'" y1="'+(y-9)+'" x2="'+xb+'" y2="'+(y+9)+'" stroke="'+col+'" stroke-width="3"/>'+
    '<rect x="'+((xa+xb)/2-w/2)+'" y="'+(y-15)+'" width="'+w+'" height="30" rx="8" fill="#fff"/>'+txt((xa+xb)/2,y+1,s,{fs,c:col});
}
const pill=(x,y,s,fs)=>{fs=fs||22;const w=tw(s,fs)+40;return '<rect x="'+(x-w/2)+'" y="'+(y-20)+'" width="'+w+'" height="40" rx="20" fill="#90ee90"/>'+txt(x,y+1,s,{fs,c:'#25642c'});};
const ROSE='#c9b8ec',ROSE_D='#7b62c4';

/* 式を、数字と「その数字が何か」の組でならべる */
const FXOPS=['×','＋','－','＝','÷','：','＜','＞','→'];
const fx=(toks,col)=>'<div class="fx">'+toks.map((t,i)=>{const s=String(t[0]);if(FXOPS.includes(s))return '<div class="op">'+s+'</div>';
  const last=i===toks.length-1;return '<div class="tk'+(last?' res':'')+'"'+(last?' style="color:'+(col||'#25642c')+'"':'')+'><div class="n">'+s+'</div><div class="c">'+(t[1]||'&nbsp;')+'</div></div>';}).join('')+'</div>';
const fxRow=(tag,col,toks)=>'<span class="fxrow"><span class="fxtag" style="background:'+col+'">'+tag+'</span>'+fx(toks,col)+'</span>';

let idx=0,P=null,t=0,picked=false,drag=false;
const INTRO='mm-intro-newton',PRETABS='';

const KEY='newton-done';
/* ===== 問題 =====
   はじめに Q0 あって、1分に g ずつふえる。1分に s ずつへらす（窓口・ポンプ・牛）。
   1分でへる量 ＝ s－g（へらす量から、ふえる量を引く） → なくなるまで ＝ Q0÷(s－g)
   n … 窓口などの数（1つあたり s1） */
const PROBLEMS=[
  {Q0:120,g:4,n:1,s1:10,it:'行列',iu:'人',u:'分',who:'窓口',tag:'行列',text:'窓口が開いたとき、120人の行列ができていました。行列には毎分4人ずつ加わります。窓口1つで毎分10人ずつ受け付けると、何分で行列がなくなりますか？'},
  {Q0:180,g:6,n:2,s1:12,it:'行列',iu:'人',u:'分',who:'窓口',tag:'行列',text:'窓口が開いたとき、180人の行列ができていました。行列には毎分6人ずつ加わります。窓口2つで、1つの窓口が毎分12人ずつ受け付けると、何分で行列がなくなりますか？'},
  {Q0:600,g:20,n:1,s1:50,it:'水',iu:'L',u:'分',who:'ポンプ',tag:'水そう',text:'600Lの水が入った水そうに、毎分20Lずつ水が入り続けています。ポンプで毎分50Lずつくみ出すと、何分で水そうは空になりますか？'},
  {Q0:300,g:10,n:4,s1:15,it:'草',iu:'kg',u:'日',who:'牛',tag:'牧場',text:'牧場に300kgの草がはえていて、草は毎日10kgずつのびます。牛1頭は1日に15kgの草を食べます。牛4頭を放すと、何日で草はなくなりますか？'},
  {Q0:240,g:8,n:1,s1:20,it:'行列',iu:'人',u:'分',who:'改札',tag:'行列',text:'改札口に240人が並んでいて、毎分8人ずつ加わります。改札を1つ開けて、毎分20人ずつ通すと、何分で行列がなくなりますか？'},
  {Q0:450,g:15,n:3,s1:20,it:'水',iu:'L',u:'分',who:'ポンプ',tag:'水そう',text:'450Lの水が入った水そうに、毎分15Lずつ水が入り続けています。毎分20Lくみ出せるポンプ3台でくみ出すと、何分で空になりますか？'}
];
const S=()=>P.n*P.s1, R=()=>S()-P.g;
const ans=()=>P.Q0/R();
const tmin=()=>0, tmax=()=>Math.ceil(ans()*1.4);
const snap=v=>Math.round(v), tickStep=()=>tmax()>40?5:1, keyStep=()=>1;
const sliderName=()=>P.u==='日'?'日数':'時間';
const tlabel=()=>t+P.u;
const rightIsAdd=()=>false;
const pre=()=>P.n>1?P.who+P.n+'つで 1'+P.u+'に '+P.s1+'×'+P.n+'＝'+S()+P.iu+'へらす。':'';
const firstQ=()=>pre()+'1'+P.u+'で'+P.it+'はいくつへる？';
const firstOpts=()=>[S()+'＋'+P.g+'＝'+(S()+P.g)+P.iu,S()+'－'+P.g+'＝'+R()+P.iu];
const pickedQ=()=>fxRow('1'+P.u+'でへる','#3f9b4a',[[S(),'へらす（'+P.who+'）'],['－'],[P.g,'ふえる'],['＝'],[R()+P.iu]]);
const pickedMsg=()=>'つまみで'+sliderName()+'を動かして、のこりを0に';
const wrongMsg=()=>'へらしている間も、'+P.it+'はふえ続けるよ。ふえる分を引こう';
const checkHead=()=>'できた！ 答え '+ans()+P.u;
const checkLine=()=>fx([[P.Q0,'はじめの'+P.it],['÷'],[R(),'1'+P.u+'でへる'],['＝'],[ans()+P.u]]);

/* 右の計算の1行（数字の下に、その数字が何か） */
const SOPS=['×','＋','－','＝','÷','：'];
function step(y,tag,col,toks,bw){
  bw=bw||118;const X=650;
  let h='<rect x="'+X+'" y="'+(y-16)+'" width="'+bw+'" height="32" rx="16" fill="'+col+'"/>'+txt(X+bw/2,y+1,tag,{fs:14,c:'#fff'});
  let x=X+bw+12;
  toks.forEach((tk,i)=>{
    const s=String(tk[0]),last=i===toks.length-1,op=SOPS.includes(s),fs=last?23:21,w=tw(s,fs),slot=Math.max(w,tk[1]?tw(tk[1],12):0),mid=x+slot/2;
    h+=txt(mid,y,s,{fs,c:op?'#9a9184':(last?col:'#2f3437')});
    if(tk[1])h+='<line x1="'+(mid-w/2)+'" y1="'+(y+15)+'" x2="'+(mid+w/2)+'" y2="'+(y+15)+'" stroke="#e2dccf" stroke-width="2"/>'+txt(mid,y+28,tk[1],{fs:12,c:'#9a9184',fw:700});
    x+=slot+(op?7:9);
  });
  return h;
}
const BH=32;
const CB=['#add8e6','#3d9cc2'],CP=['#ffd1dc','#d9849b'],CO=['#fff1dc','#e8a24f'],CG=['#dff3df','#5cbf5c'];
const seg=(x,w,y,c,lab,lc,dash)=>w<=0.5?'':'<rect x="'+x+'" y="'+(y-BH/2)+'" width="'+w+'" height="'+BH+'" rx="6" fill="'+(dash?'#fff':c[0])+'" stroke="'+c[1]+'" stroke-width="2.5"'+(dash?' stroke-dasharray="6 5"':'')+'/>'+(lab!==''&&lab!=null&&w>tw(String(lab),15)+8?txt(x+w/2,y+1,lab,{fs:15,c:lc||c[1]}):'');
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};

const X0=130,XW=470,Y1=100,Y2=176;
function draw(){
  const ok=solved(),T=tmax(),k=XW/(P.Q0+P.g*T),add=P.g*t,out=Math.min(S()*t,P.Q0+add),rem=P.Q0+add-S()*t;
  let h='';
  h+=txt(X0-14,Y1,'来た・ある',{a:'end',fs:15,c:CB[1]})+txt(X0-14,Y2,'へらした',{a:'end',fs:15,c:'#2f6f37'});
  h+=seg(X0,P.Q0*k,Y1,CB,'はじめ '+P.Q0,'#24617a')+seg(X0+P.Q0*k,add*k,Y1,CO,add?'＋'+add:'','#9a5a12');
  h+=seg(X0,S()*t*k,Y2,CG,S()*t?S()*t+'':'','#2f6f37');
  const xr0=X0+out*k,xr1=X0+(P.Q0+add)*k;
  if(rem>0)h+='<rect x="'+xr0+'" y="'+(Y2-BH/2)+'" width="'+(xr1-xr0)+'" height="'+BH+'" rx="6" fill="#fff" stroke="#9a5a12" stroke-width="2.5" stroke-dasharray="6 5"/>'+(xr1-xr0>70?txt((xr0+xr1)/2,Y2+1,'のこり '+rem,{fs:15,c:'#9a5a12'}):'');
  h+='<line x1="'+xr1+'" y1="'+(Y1-BH/2-8)+'" x2="'+xr1+'" y2="'+(Y2+BH/2+8)+'" stroke="#9a9184" stroke-width="2" stroke-dasharray="3 5"/>';
  h+=txt(X0,Y2+BH/2+30,'ふえる '+P.g+P.iu+'／'+P.u+'　へらす '+S()+P.iu+'／'+P.u,{a:'start',fs:14,c:'#7b766d',fw:700});
  if(ok)h+=pill(880,40,'なくなった！');
  h+=step(92,'1'+P.u+'でへる','#3f9b4a',[[S(),'へらす'],['－'],[P.g,'ふえる'],['＝'],[R()+P.iu]]);
  h+=step(164,'へった','#e8a24f',[[R(),'1'+P.u+'でへる'],['×'],[t,P.u],['＝'],[R()*t+P.iu]]);
  h+=step(236,'のこり','#9a5a12',[[P.Q0,'はじめ'],['－'],[R()*t,'へった'],['＝'],[(P.Q0-R()*t)+P.iu]]);
  return h;
}

let done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){done={};}
const saveDone=()=>{try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}};
const solved=()=>picked&&Math.abs(t-ans())<1e-9;
/* ===== 効果音（Web Audio） ===== */
let actx=null;
function audio(){
  try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC();}
  if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}
}
// tone(周波数Hz, 長さ秒, 波形, 音量, 開始の遅れ秒)
function tone(f,d,type,vol,delay){
  const c=audio();if(!c)return;
  type=type||'sine';vol=vol==null?.035:vol;delay=delay||0;
  const t0=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02);
}
// 初動の正解音（ピンポン）
const firstSound=()=>{tone(590,.10);tone(790,.13,'sine',.035,.08);};
// 出会った／追いついたときの音（ドミソド↑）
const meetSound=()=>{tone(523,.12,'sine',.034);tone(659,.12,'sine',.034,.09);tone(784,.14,'sine',.034,.18);tone(1047,.32,'sine',.038,.27);tone(1568,.30,'triangle',.012,.27);};
// iPad: 最初のタッチで音を使えるようにする
document.addEventListener('touchstart',function un(){audio();document.removeEventListener('touchstart',un);},{passive:true});
function celebrate(){const el=document.createElement('div');el.className='successMark';el.textContent='○';el.setAttribute('aria-hidden','true');document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());}
/* 時間のつまみ（tmin があれば、その値から） */
const TX0=160,TX1=940,TY=345;
const tlo=()=>typeof tmin==='function'?tmin():0;
function drawSlider(){
  const T=tmax(),L0=tlo(),tx=TX0+(TX1-TX0)*(t-L0)/(T-L0);let h='';
  h+=txt(TX0-20,TY,typeof sliderName==='function'?sliderName():'時間',{a:'end',fs:18,c:'#7b766d'});
  h+='<line x1="'+TX0+'" y1="'+TY+'" x2="'+TX1+'" y2="'+TY+'" stroke="#e2dccf" stroke-width="10" stroke-linecap="round"/>';
  h+='<line x1="'+TX0+'" y1="'+TY+'" x2="'+tx+'" y2="'+TY+'" stroke="#90ee90" stroke-width="10" stroke-linecap="round"/>';
  const ts=tickStep();for(let i=L0;i<=T+1e-9;i+=ts){const x=TX0+(TX1-TX0)*(i-L0)/(T-L0);h+='<line x1="'+x+'" y1="'+(TY+10)+'" x2="'+x+'" y2="'+(TY+16)+'" stroke="#c9c3b8" stroke-width="2"/>';}
  h+='<g class="thandle"><circle cx="'+tx+'" cy="'+TY+'" r="18" fill="#fff" stroke="#3f9b4a" stroke-width="4"/>'+txt(tx,TY+1,'↔',{fs:18,c:'#3f9b4a'})+'</g>';
  const lb=tlabel(),lw=tw(lb,19)+28;
  h+='<rect x="'+(tx-lw/2)+'" y="'+(TY-64)+'" width="'+lw+'" height="34" rx="17" fill="#90ee90"/>'+txt(tx,TY-46,lb,{fs:19,c:'#25642c'});
  if(typeof extraSlider==='function')h+=extraSlider();
  return h;
}
function celebrate(){const el=document.createElement('div');el.className='successMark';el.textContent='○';el.setAttribute('aria-hidden','true');document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());}
function renderFirst(){
  const el=$('first');el.classList.toggle('ok',picked);
  if(picked){$('q1').innerHTML=pickedQ();$('opts').innerHTML='';$('msg').textContent=pickedMsg();}
  else{$('q1').textContent=firstQ();const o=firstOpts();
    $('opts').innerHTML='<button data-op="add"><span class="no">①</span>'+o[0]+'</button><button data-op="sub"><span class="no">②</span>'+o[1]+'</button>';$('msg').textContent='';}
  svg.classList.toggle('locked',!picked);
}
$('opts').addEventListener('click',e=>{
  const b=e.target.closest('button[data-op]');if(!b)return;
  if((b.dataset.op==='add')===rightIsAdd()){picked=true;renderFirst();update();celebrate();firstSound();}
  else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('msg').textContent=wrongMsg();}
});
function updateCheck(){
  const el=$('check');
  if(!solved()){el.classList.remove('on');el.innerHTML='';$('nextq').hidden=true;return;}
  if(el.classList.contains('on'))return;
  if(!done[idx]){done[idx]=1;saveDone();renderTabs();}
  const cl=checkLine();el.innerHTML='<b>'+checkHead()+'</b>'+(cl.charAt(0)==='<'?cl:'<span>'+cl+'</span>');el.classList.add('on');meetSound();
  $('nextq').hidden=idx>=PROBLEMS.length-1;
}
function update(){$('art').innerHTML=draw()+drawSlider();updateCheck();}
function setT(v){if(!picked)return;t=Math.max(tlo(),Math.min(tmax(),v));update();}
function localPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):null;}
svg.addEventListener('pointerdown',e=>{
  if(!picked)return;
  const l=localPt(e);if(!l)return;
  if(typeof hitExtra==='function'&&hitExtra(l)){e.preventDefault();return;}
  if(l.y<300)return;
  drag=true;svg.setPointerCapture(e.pointerId);setT(snap(tlo()+(l.x-TX0)/(TX1-TX0)*(tmax()-tlo())));e.preventDefault();
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const l=localPt(e);if(l)setT(snap(tlo()+(l.x-TX0)/(TX1-TX0)*(tmax()-tlo())));});
const stop=()=>drag=false;svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
svg.setAttribute('tabindex','0');
svg.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){setT(t+keyStep());e.preventDefault();}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){setT(t-keyStep());e.preventDefault();}});
function renderTabs(){
  $('tabs').innerHTML=(INTRO?'<button class="introb" id="introOpen">はじめに</button>':'')+PRETABS+PROBLEMS.map((q,j)=>'<button data-i="'+j+'" aria-pressed="'+(j===idx)+'"'+(done[j]?' class="done"':'')+'>'+(j+1)+'</button>').join('');
}
function load(i){
  idx=i;P=PROBLEMS[i];picked=false;t=typeof t0==='function'?t0():tlo();
  $('qTag').textContent='問題 '+String(i+1).padStart(2,'0')+'｜'+P.tag;
  $('qText').textContent=P.text;
  renderTabs();renderFirst();
  $('check').classList.remove('on');$('nextq').hidden=true;
  update();
}
$('reset').addEventListener('click',()=>load(idx));
$('nextq').addEventListener('click',()=>{if(idx<PROBLEMS.length-1)load(idx+1);});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)load(+b.dataset.i);});
$('clearRec').addEventListener('click',()=>{if(!confirm('この部屋の記録（クリアした問題の✓）を消して、はじめからにします。\nよろしいですか？'))return;done={};try{localStorage.removeItem(KEY);}catch(e){}load(0);});
function startRoom(){started=true;const hq=/^#q(\d+)$/.exec(location.hash);load(hq?Math.max(0,Math.min(PROBLEMS.length-1,+hq[1]-1)):0);}
let started=false;
if(!INTRO)startRoom();
else{
  /* はじめに: 初回だけ自動で出す。2回目からは「はじめに」ボタンで開く */
  const showIntro=()=>{$('intro').hidden=false;$('roomMain').hidden=true;window.scrollTo(0,0);};
  const hideIntro=()=>{$('intro').hidden=true;$('roomMain').hidden=false;try{localStorage.setItem(INTRO,'1');}catch(e){}if(!started)startRoom();};
  $('introGo').addEventListener('click',hideIntro);
  $('tabs').addEventListener('click',e=>{if(e.target.closest('#introOpen'))showIntro();});
  let seen=false;try{seen=localStorage.getItem(INTRO)==='1';}catch(e){}
  if(seen||/^#q\d+$/.test(location.hash))startRoom();else showIntro();
}
})();
</script></body></html>
