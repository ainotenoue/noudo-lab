<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平均算の部屋｜miss maths</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#303538;font-family:"Hiragino Maru Gothic ProN",-apple-system,sans-serif;font-weight:700}main{max-width:1120px;margin:auto;padding:18px 24px}section{background:white;border:2px solid #eae5da;border-radius:25px;padding:20px;margin-bottom:13px}.top,.nav,.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{background:#eaf4ef;color:#3b8062;padding:9px 15px;border-radius:25px;font-size:14px}.stage{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{font:inherit;color:#514c45;background:white;border:2px solid #e2ddd1;border-radius:30px;padding:10px 15px;cursor:pointer;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button.active,.primary{background:#dff1e7!important;border-color:#89c4a1!important}button:disabled{opacity:.3}h1{font-size:24px;margin:15px 0 4px}.sub{font-size:14px;color:#777168;margin:6px 0 12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}.play{background:#f5faf5;border:3px solid #d9e9dc;border-radius:20px;padding:12px;min-height:340px}.play svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}.play{position:relative}.dragging{cursor:grabbing}.dragHint{fill:#e7f4e9;stroke:#5eaf80;stroke-width:3;stroke-dasharray:7 5}.candy{cursor:grab}.candy:active{cursor:grabbing}.side{background:#fff7e9;border-radius:20px;padding:18px;text-align:center}.big{font-size:42px;margin:8px 0}.status{min-height:40px}.tools{justify-content:center;margin:10px 0}.formula{background:#f4effa;border-radius:14px;padding:13px 16px;margin-top:12px;line-height:1.7}.hidden{display:none}.bottom{margin-top:14px}.successMark{position:fixed;top:43%;left:50%;transform:translate(-50%,-50%);border:13px solid #e5a45d;border-radius:50%;background:#fffaf3ee;color:#d28c3c;font-size:100px;width:160px;height:160px;line-height:130px;text-align:center;pointer-events:none;z-index:5;animation:pop 1.1s forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0}}@media(max-width:720px){main{padding:10px}.layout{grid-template-columns:1fr}.play{min-height:0}.side{padding:12px}.big{font-size:32px}section{padding:12px}}</style></head><body><main>
<section><div class="top"><span class="tag">平均算の部屋｜試作 v0.2</span><div class="stage"><button id="stageA" class="active">STAGE A｜分けてそろえる</button><button id="stageB">STAGE B｜図で考える</button></div></div><h1 id="title"></h1><p class="sub" id="desc"></p></section>
<section><div class="layout"><div class="play"><svg id="visual" viewBox="0 0 740 390" role="img"></svg></div><div class="side"><div>みんなの合計</div><div class="big" id="total"></div><div>平均（1人分）</div><div class="big" id="average"></div><div class="status" id="status"></div><div class="tools"><button id="undo">↶ ひとつ戻す</button><button id="reset">最初から</button></div><p class="sub" id="guide"></p></div></div><div id="formula" class="formula hidden"></div><div class="nav bottom"><a class="btn" href="../">← ひろばへ</a><button id="next" class="primary hidden">次の問題 →</button></div></section></main>
<script>(()=>{'use strict';
const P=[[3,9,6,2],[4,8,6,10],[2,6,10,14],[5,7,9,11]],$=id=>document.getElementById(id),colors=['#add8e6','#ffd1dc','#a6d69a','#f4d49b'];
let stage='A',index=0,values=[],history=[],wasCorrect=false,selected=null,drag=null;
function avg(){return values.reduce((a,b)=>a+b,0)/values.length}
function solved(){return values.every(x=>x===avg())}
function pop(){const d=document.createElement('div');d.className='successMark';d.textContent='○';document.body.appendChild(d);d.addEventListener('animationend',()=>d.remove())}
function reset(){values=[...P[index]];history=[];wasCorrect=false;selected=null;drag=null;render()}
function move(from,to){if(from===to||to<0||values[from]<=0)return;history.push([...values]);values[from]--;values[to]++;render()}
function col(i){const n=values.length,spacing=660/n,w=Math.min(120,spacing-20);return {x:45+i*spacing+spacing/2-w/2,w,center:45+i*spacing+spacing/2}}
function point(e){const svg=$('visual'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const matrix=svg.getScreenCTM();return matrix?p.matrixTransform(matrix.inverse()):{x:-999,y:-999}}
function targetAt(p){for(let i=0;i<values.length;i++){const c=col(i);if(p.x>=c.x-14&&p.x<=c.x+c.w+14&&p.y>=24&&p.y<=386)return i}return -1}
function svg(){const baseline=310,scale=15,mean=avg(),active=drag?drag.to:-1;let s='<line x1="35" y1="'+(baseline-mean*scale)+'" x2="715" y2="'+(baseline-mean*scale)+'" stroke="#c38d51" stroke-width="3" stroke-dasharray="9 7"/><text x="705" y="'+(baseline-mean*scale-10)+'" text-anchor="end" font-size="18" fill="#ad793d">平均 '+mean+'</text>';
values.forEach((v,i)=>{const c=col(i),x=c.x,w=c.w,y=baseline-v*scale;
if(stage==='A'&&active===i&&drag.from!==i)s+='<rect class="dragHint" x="'+(x-9)+'" y="20" width="'+(w+18)+'" height="365" rx="15"/>';
s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+(v*scale)+'" rx="5" fill="'+colors[i]+'" stroke="#fff" stroke-width="2"/>';
if(stage==='A'){for(let j=0;j<v;j++){const cy=baseline-(j+.5)*scale;s+='<circle class="candy" data-from="'+i+'" cx="'+c.center+'" cy="'+cy+'" r="7" fill="#fff" stroke="'+colors[i]+'" stroke-width="3"/>'}}
s+='<text x="'+c.center+'" y="'+(y-13)+'" text-anchor="middle" font-size="23" fill="#303538">'+v+'こ</text><text x="'+c.center+'" y="347" text-anchor="middle" font-size="20" fill="#525454">'+['あお','もも','みどり','きいろ'][i]+'</text>';
if(stage==='B')s+='<rect data-i="'+i+'" x="'+x+'" y="70" width="'+w+'" height="240" fill="transparent"/>';
else s+='<rect x="'+(x-8)+'" y="324" width="'+(w+16)+'" height="61" rx="10" fill="transparent"/>';
});
s+='<line x1="35" y1="'+baseline+'" x2="715" y2="'+baseline+'" stroke="#aaa" stroke-width="2"/>';
if(drag){s+='<circle cx="'+drag.x+'" cy="'+drag.y+'" r="17" fill="'+colors[drag.from]+'" stroke="#fff" stroke-width="4" opacity=".96" style="filter:drop-shadow(0 3px 4px #7778);pointer-events:none"/><circle cx="'+drag.x-4+'" cy="'+drag.y-4+'" r="5" fill="#fff" opacity=".85" pointer-events="none"/>'}
return s}
function render(){const sum=values.reduce((a,b)=>a+b,0),mean=avg(),ok=solved();$('stageA').classList.toggle('active',stage==='A');$('stageB').classList.toggle('active',stage==='B');$('title').textContent=stage==='A'?'キャンディーを分けて、同じ数にしよう':'棒グラフの高さを、平均にそろえよう';$('desc').textContent=stage==='A'?'キャンディーをつまんで、別の子へポイッ！':'合計は変えずに、出っ張った部分を足りないところへ移そう。';$('total').textContent=sum+'こ';$('average').textContent=mean+'こ';$('visual').innerHTML=svg();$('status').textContent=ok?'正解！ 全員 '+mean+'こ':drag?'渡す相手のところで指を離そう':stage==='A'?'キャンディーをドラッグしてね':selected===null?'多い棒を選んでね':'渡す相手を選んでね';$('guide').textContent=stage==='A'?'キャンディー1こを指で運ぼう。合計は変わらないよ。':'棒を2本順にタップして、1こ移す';$('formula').classList.toggle('hidden',!ok);$('formula').textContent='考え方：合計 '+sum+'こ ÷ '+values.length+'人 = 平均 '+mean+'こ。全体の数は変わらず、出っ張りと不足がつり合うよ。';$('next').classList.toggle('hidden',!ok||index===P.length-1);$('undo').disabled=history.length===0;if(ok&&!wasCorrect)pop();wasCorrect=ok}
const visual=$('visual');
visual.addEventListener('pointerdown',e=>{if(stage!=='A'||drag)return;const el=e.target.closest('[data-from]');if(!el)return;const from=Number(el.dataset.from),p=point(e);if(values[from]<=0)return;drag={id:e.pointerId,from,to:-1,x:p.x,y:p.y};visual.setPointerCapture(e.pointerId);e.preventDefault();render()});
visual.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e);drag.x=p.x;drag.y=p.y;const t=targetAt(p);drag.to=t===drag.from?-1:t;render();e.preventDefault()});
function finish(e,cancel){if(!drag||drag.id!==e.pointerId)return;const d=drag,p=point(e),to=cancel?-1:targetAt(p);drag=null;if(visual.hasPointerCapture(e.pointerId))visual.releasePointerCapture(e.pointerId);if(to!==-1&&to!==d.from)move(d.from,to);else render();e.preventDefault()}
visual.addEventListener('pointerup',e=>finish(e,false));visual.addEventListener('pointercancel',e=>finish(e,true));visual.addEventListener('lostpointercapture',()=>{if(drag){drag=null;render()}});
visual.addEventListener('click',e=>{if(stage!=='B')return;const el=e.target.closest('[data-i]');if(!el)return;const i=Number(el.dataset.i);if(selected===null){selected=i;render()}else{const from=selected;selected=null;move(from,i);render()}});
$('stageA').onclick=()=>{stage='A';reset()};$('stageB').onclick=()=>{stage='B';reset()};$('undo').onclick=()=>{if(history.length)values=history.pop();selected=null;drag=null;render()};$('reset').onclick=reset;$('next').onclick=()=>{index++;reset()};reset();
})();</script></body></html>
