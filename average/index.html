<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平均算の部屋｜miss maths</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#303538;font-family:"Hiragino Maru Gothic ProN",-apple-system,sans-serif;font-weight:700}main{max-width:1120px;margin:auto;padding:18px 24px}section{background:white;border:2px solid #eae5da;border-radius:25px;padding:20px;margin-bottom:13px}.top,.nav,.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{background:#eaf4ef;color:#3b8062;padding:9px 15px;border-radius:25px;font-size:14px}.stage{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{font:inherit;color:#514c45;background:white;border:2px solid #e2ddd1;border-radius:30px;padding:10px 15px;cursor:pointer;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button.active,.primary{background:#dff1e7!important;border-color:#89c4a1!important}button:disabled{opacity:.3}h1{font-size:24px;margin:15px 0 4px}.sub{font-size:14px;color:#777168;margin:6px 0 12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}.play{background:#f5faf5;border:3px solid #d9e9dc;border-radius:20px;padding:12px;min-height:340px}.play svg{display:block;width:100%;height:auto;touch-action:manipulation}.side{background:#fff7e9;border-radius:20px;padding:18px;text-align:center}.big{font-size:42px;margin:8px 0}.status{min-height:40px}.tools{justify-content:center;margin:10px 0}.formula{background:#f4effa;border-radius:14px;padding:13px 16px;margin-top:12px;line-height:1.7}.hidden{display:none}.bottom{margin-top:14px}.successMark{position:fixed;top:43%;left:50%;transform:translate(-50%,-50%);border:13px solid #e5a45d;border-radius:50%;background:#fffaf3ee;color:#d28c3c;font-size:100px;width:160px;height:160px;line-height:130px;text-align:center;pointer-events:none;z-index:5;animation:pop 1.1s forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0}}@media(max-width:720px){main{padding:10px}.layout{grid-template-columns:1fr}.play{min-height:0}.side{padding:12px}.big{font-size:32px}section{padding:12px}}</style></head><body><main>
<section><div class="top"><span class="tag">平均算の部屋｜試作 v0.1</span><div class="stage"><button id="stageA" class="active">STAGE A｜分けてそろえる</button><button id="stageB">STAGE B｜図で考える</button></div></div><h1 id="title"></h1><p class="sub" id="desc"></p></section>
<section><div class="layout"><div class="play"><svg id="visual" viewBox="0 0 740 390" role="img"></svg></div><div class="side"><div>みんなの合計</div><div class="big" id="total"></div><div>平均（1人分）</div><div class="big" id="average"></div><div class="status" id="status"></div><div class="tools"><button id="undo">↶ ひとつ戻す</button><button id="reset">最初から</button></div><p class="sub" id="guide"></p></div></div><div id="formula" class="formula hidden"></div><div class="nav bottom"><a class="btn" href="../">← ひろばへ</a><button id="next" class="primary hidden">次の問題 →</button></div></section></main>
<script>(()=>{'use strict';
const P=[[3,9,6,2],[4,8,6,10],[2,6,10,14],[5,7,9,11]],$=id=>document.getElementById(id);let stage='A',index=0,values=[],history=[],wasCorrect=false;const colors=['#add8e6','#ffd1dc','#a6d69a','#f4d49b'];function reset(){values=[...P[index]];history=[];wasCorrect=false;render()}function avg(){return values.reduce((a,b)=>a+b,0)/values.length}function solved(){return values.every(x=>x===avg())}function pop(){const d=document.createElement('div');d.className='successMark';d.textContent='○';document.body.appendChild(d);d.addEventListener('animationend',()=>d.remove())}function move(from,to){if(from===to||values[from]<=0)return;history.push([...values]);values[from]--;values[to]++;render()}function svg(){const n=values.length,max=16,baseline=310,scale=15,spacing=660/n,barW=Math.min(120,spacing-20),mean=avg();let s='<line x1="35" y1="'+(baseline-mean*scale)+'" x2="715" y2="'+(baseline-mean*scale)+'" stroke="#c38d51" stroke-width="3" stroke-dasharray="9 7"/><text x="705" y="'+(baseline-mean*scale-10)+'" text-anchor="end" font-size="18" fill="#ad793d">平均 '+mean+'</text>';values.forEach((v,i)=>{const x=45+i*spacing+spacing/2-barW/2;const y=baseline-v*scale;s+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+(v*scale)+'" rx="5" fill="'+colors[i]+'" stroke="#ffffff" stroke-width="2"/>';if(stage==='A'){for(let j=0;j<v;j++)s+='<circle cx="'+(x+barW/2)+'" cy="'+(baseline-(j+.5)*scale)+'" r="5.5" fill="#fff" stroke="#9c9a89" stroke-width="1"/>'}s+='<text x="'+(x+barW/2)+'" y="'+(y-13)+'" text-anchor="middle" font-size="23" fill="#303538">'+v+'こ</text><text x="'+(x+barW/2)+'" y="347" text-anchor="middle" font-size="20" fill="#525454">'+['あお','もも','みどり','きいろ'][i]+'</text>';if(stage==='A'){s+='<rect data-i="'+i+'" x="'+x+'" y="355" width="'+barW+'" height="30" rx="15" fill="#fff" stroke="#a5c6af" stroke-width="2"/><text data-i="'+i+'" x="'+(x+barW/2)+'" y="376" text-anchor="middle" font-size="15" fill="#36784e">選ぶ</text>'}else{s+='<rect data-i="'+i+'" x="'+x+'" y="'+(baseline-max*scale)+'" width="'+barW+'" height="'+(max*scale)+'" fill="transparent"/>'}});s+='<line x1="35" y1="'+baseline+'" x2="715" y2="'+baseline+'" stroke="#aaa" stroke-width="2"/>';return s}
let selected=null;function render(){const sum=values.reduce((a,b)=>a+b,0),mean=avg(),ok=solved();$('stageA').classList.toggle('active',stage==='A');$('stageB').classList.toggle('active',stage==='B');$('title').textContent=stage==='A'?'キャンディーを分けて、同じ数にしよう':'棒グラフの高さを、平均にそろえよう';$('desc').textContent=stage==='A'?'多い子から少ない子へ、キャンディーを1こずつ渡してみよう。':'合計は変えずに、出っ張った部分を足りないところへ移そう。';$('total').textContent=sum+'こ';$('average').textContent=mean+'こ';$('visual').innerHTML=svg();$('status').textContent=ok?'正解！ 全員 '+mean+'こ':selected===null?'多いところを選んでね':'渡す相手を選んでね';$('guide').textContent=stage==='A'?'棒の下の「選ぶ」を順に2人タップ':'棒を2本順にタップして、1こ移す';$('formula').classList.toggle('hidden',!ok);$('formula').textContent='考え方：合計 '+sum+'こ ÷ '+values.length+'人 = 平均 '+mean+'こ。全体の数は変わらず、出っ張りと不足がつり合うよ。';$('next').classList.toggle('hidden',!ok||index===P.length-1);$('undo').disabled=history.length===0;if(ok&&!wasCorrect)pop();wasCorrect=ok}
$('visual').onclick=e=>{const el=e.target.closest('[data-i]');if(!el)return;const i=+el.dataset.i;if(selected===null){selected=i;render()}else{move(selected,i);selected=null;render()}};$('stageA').onclick=()=>{stage='A';selected=null;reset()};$('stageB').onclick=()=>{stage='B';selected=null;reset()};$('undo').onclick=()=>{if(history.length)values=history.pop();selected=null;render()};$('reset').onclick=()=>{selected=null;reset()};$('next').onclick=()=>{index++;selected=null;reset()};reset();
})();</script></body></html>
