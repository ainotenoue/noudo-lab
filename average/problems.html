<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平均算｜標準問題の部屋</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#303538;font-family:"Hiragino Maru Gothic ProN",-apple-system,sans-serif;font-weight:700}main{max-width:1060px;margin:auto;padding:20px}section{background:#fff;border:2px solid #e9e3d8;border-radius:24px;padding:22px;margin:12px 0}.top,.nav,.answer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{background:#e6f3e9;border-radius:24px;padding:9px 15px;color:#44835d}h1{font-size:25px;margin:14px 0 6px}.muted{color:#7b766d;font-size:14px;line-height:1.7}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,a.btn{font:inherit;border:2px solid #e2ddd1;background:#fff;color:#4b4944;border-radius:25px;padding:10px 16px;cursor:pointer;text-decoration:none;touch-action:manipulation}button.active,.primary{background:#e0f2e6;border-color:#81b998}button:disabled{opacity:.4}.question{font-size:19px;line-height:1.85;margin:12px 0 20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:17px}.figure{background:#f5faf5;border:2px solid #dbeade;border-radius:18px;padding:12px}.figure svg{display:block;width:100%;height:auto}.side{background:#fff7e9;border-radius:18px;padding:18px}.side label{display:block;margin:8px 0}.side input{width:130px;font:inherit;font-size:24px;padding:9px;border:2px solid #c8bda9;border-radius:12px;background:#fff;min-width:0}.side input:focus{outline:3px solid #9bd1ad}.result{min-height:48px;line-height:1.6;margin:14px 0}.explain{background:#f2edf9;border-radius:14px;padding:16px;line-height:1.8;margin-top:16px}.hidden{display:none}.progress{font-size:14px;color:#6b806d}.small{font-size:13px}.figure text{font-family:inherit}.nav{margin-top:20px}@media(max-width:740px){main{padding:10px}section{padding:14px}.layout{grid-template-columns:1fr}.question{font-size:17px}.side{padding:13px}}</style></head><body><main><section><div class="top"><span class="tag">平均算の部屋｜標準問題</span><a class="btn" href="./">← 均す体験へ</a></div><h1>平均の考え方で、問題を解こう</h1><p class="muted">STAGE A・Bで見つけた「均すと合計は変わらない」を使う5問。図を見て考え、答えを入れよう。</p><div class="tabs" id="tabs"></div><div class="progress" id="progress"></div></section><section><div class="top"><strong id="heading"></strong><span class="tag" id="level"></span></div><p class="question" id="question"></p><div class="layout"><div class="figure"><svg id="figure" viewBox="0 0 640 320" role="img" aria-label="問題を考えるための図"></svg><p class="muted small" id="figureNote"></p></div><div class="side"><label for="answer">答えを入力</label><div class="answer"><input id="answer" type="text" inputmode="numeric" autocomplete="off" aria-label="答え"><strong id="unit"></strong></div><div class="nav"><button class="primary" id="check">答え合わせ</button><button id="hintBtn">ヒント</button></div><div class="result" id="result" aria-live="polite"></div><p class="muted hidden" id="hint"></p></div></div><div class="explain hidden" id="explain"></div><div class="nav"><button id="prev">← 前の問題</button><button id="next" class="primary">次の問題 →</button></div></section><div class="nav"><a class="btn" href="./">← STAGE A・B</a><a class="btn" href="../">← ひろばへ</a></div></main><script>(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='average-standard-done';
const P=[
{title:'平均から合計を求める',level:'基本',q:'5人の算数のテストの平均点は76点でした。5人の合計点は何点ですか。',ans:380,unit:'点',hint:'5人全員が76点だったと考えると、合計はどうなる？',formula:'76 × 5 ＝ 380（点）',explain:'平均76点とは、5人の点数を均したとき、76点の棒が5本になること。5本分の面積（合計点）を求めよう。',kind:1},
{title:'わからない1人の点数',level:'標準',q:'5人のテストの平均点は78点でした。4人の点数は72点、85点、76点、81点です。残りの1人は何点ですか。',ans:76,unit:'点',hint:'まず5人分の合計を求めて、わかっている4人分を引こう。',formula:'78 × 5 −（72 ＋ 85 ＋ 76 ＋ 81）＝ 76（点）',explain:'平均78点の棒が5本なら合計390点。わかっている4人の合計314点を引くと、残りの1人は76点。',kind:2},
{title:'新しい人が加わる',level:'標準',q:'4人のテストの平均点は70点でした。新たに1人加わると、5人の平均点は74点になりました。加わった人は何点ですか。',ans:90,unit:'点',hint:'加わる前の合計と、加わった後の合計の差が新しい人の点数。',formula:'74 × 5 − 70 × 4 ＝ 90（点）',explain:'もとの4人の合計は280点。5人になった合計は370点。増えた90点が新しい人の点数だよ。',kind:3},
{title:'2つのグループの平均',level:'標準',q:'A組12人の平均点は70点、B組8人の平均点は80点でした。20人全員の平均点は何点ですか。',ans:74,unit:'点',hint:'組ごとに「平均×人数」で合計点を出してから、20人で割ろう。',formula:'（70 × 12 ＋ 80 × 8）÷ 20 ＝ 74（点）',explain:'A組の合計は840点、B組は640点。全体の合計1480点を20人で均すと74点。人数が違うので、70と80をそのまま平均しないことが大切。',kind:4},
{title:'平均の差から人数比を求める',level:'標準〜発展',q:'A組の平均点は70点、B組の平均点は85点でした。2組合わせた平均点は76点です。A組とB組の人数の比を、もっとも簡単な整数の比で求めなさい。',ans:'3:2',unit:'A組：B組',hint:'全体の平均76点に対して、A組は1人あたり6点不足、B組は1人あたり9点超過。合計の不足と超過がつり合う人数比は？',formula:'A組：B組 ＝（85 − 76）：（76 − 70）＝ 9：6 ＝ 3：2',explain:'A組の不足は1人6点、B組の超過は1人9点。全体で不足と超過が同じ量になるようにするので、人数は差の逆比の3：2になる。',kind:5}
];let idx=0,done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
function rect(x,y,w,h,color){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="'+color+'" stroke="#fff" stroke-width="2"/>'}
function txt(x,y,t,size=19,color='#3d4842'){return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" fill="'+color+'" text-anchor="middle">'+t+'</text>'}
function figure(p){let s='',base=268;if(p.kind<=3){let vals=p.kind===1?[76,76,76,76,76]:p.kind===2?[72,85,76,81,76]:[70,70,70,70,90];const scale=1.8;vals.forEach((v,i)=>{let x=35+i*120,y=base-v*scale;s+=rect(x,y,90,v*scale,i===4?'#f5d09b':'#a8d7e4')+txt(x+45,y-12,p.kind===2&&i===4?'？':p.kind===3&&i===4?'？':v,20)+txt(x+45,294,(i+1)+'人目',16)});s+='<line x1="18" y1="'+(base-(p.kind===1?76:p.kind===2?78:74)*scale)+'" x2="620" y2="'+(base-(p.kind===1?76:p.kind===2?78:74)*scale)+'" stroke="#b98b56" stroke-width="3" stroke-dasharray="7 6"/>';s+=txt(548,26,'平均 '+(p.kind===1?76:p.kind===2?78:74)+'点',17,'#a16b37');if(p.kind===3)s+=txt(290,313,'はじめの4人は平均70点',17)}else{const a=p.kind===4?70:70,b=p.kind===4?80:85,wa=p.kind===4?340:320,wb=p.kind===4?226:220,scale=2.15;s+=rect(30,base-a*scale,wa,a*scale,'#add8e6')+rect(30+wa,base-b*scale,wb,b*scale,'#ffd1dc');s+=txt(30+wa/2,base-a*scale-14,'A組 平均70点',18)+txt(30+wa+wb/2,base-b*scale-14,'B組 平均'+b+'点',18);s+=txt(30+wa/2,294,p.kind===4?'12人':'人数？',18)+txt(30+wa+wb/2,294,p.kind===4?'8人':'人数？',18);s+='<line x1="20" y1="'+(base-(p.kind===4?74:76)*scale)+'" x2="610" y2="'+(base-(p.kind===4?74:76)*scale)+'" stroke="#b98b56" stroke-width="3" stroke-dasharray="7 6"/>';s+=txt(320,25,'全体の平均 '+(p.kind===4?'？':'76点'),19,'#a16b37')}return s}
function render(){const p=P[idx];$('heading').textContent='問題 '+(idx+1)+'｜'+p.title;$('level').textContent=p.level;$('question').textContent=p.q;$('unit').textContent=p.kind===5?'（例 3:2）':p.unit;$('answer').value='';$('answer').placeholder=p.kind===5?'3:2':'数字';$('result').textContent='';$('hint').textContent=p.hint;$('hint').classList.add('hidden');$('explain').classList.add('hidden');$('figure').innerHTML=figure(p);$('figureNote').textContent=p.kind===2?'※ 5人目の棒は、答えを考えるための仮の高さです。':p.kind===3?'※ もとの4人の棒は、平均70点で均した姿を表しています。':p.kind===5?'※ 図の横幅は人数比の答えを表していません。':'※ 棒の高さは平均や点数、幅は人数を表すイメージです。';$('prev').disabled=idx===0;$('next').disabled=idx===P.length-1;$('tabs').innerHTML=P.map((v,i)=>'<button data-idx="'+i+'" class="'+(i===idx?'active':'')+'">'+(done[i]?'✓ ':'')+(i+1)+'</button>').join('');$('progress').textContent='クリア '+Object.keys(done).filter(k=>done[k]).length+' / '+P.length+'問'}
function check(){const p=P[idx],raw=$('answer').value.trim().replace(/：/g,':').replace(/\s/g,'');const valid=p.kind===5?/^\d+:\d+$/.test(raw):/^\d+$/.test(raw);if(!valid){$('result').textContent=p.kind===5?'人数比を「3:2」の形で入力してね。':'数字で答えてね。';return}let ok;if(p.kind===5){const [a,b]=raw.split(':').map(Number);ok=a>0&&b>0&&a*2===b*3}else ok=Number(raw)===p.ans;if(ok){$('result').textContent='○ 正解！ よくできたね。';done[idx]=true;try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}$('explain').innerHTML='<strong>式で確認：</strong> '+p.formula+'<p>'+p.explain+'</p>';$('explain').classList.remove('hidden');renderTabs()}else $('result').textContent='もう一度考えてみよう。ヒントも使えるよ。'}
function renderTabs(){$('tabs').querySelectorAll('button').forEach((b,i)=>b.textContent=(done[i]?'✓ ':'')+(i+1));$('progress').textContent='クリア '+Object.keys(done).filter(k=>done[k]).length+' / '+P.length+'問'}
$('tabs').onclick=e=>{const b=e.target.closest('[data-idx]');if(b){idx=Number(b.dataset.idx);render()}};$('check').onclick=check;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});$('hintBtn').onclick=()=>$('hint').classList.toggle('hidden');$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(idx<P.length-1){idx++;render()}};render();
})();</script></body></html>
