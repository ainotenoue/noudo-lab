<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面積図メーカー v1.1</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>面積図メーカー</h1><p>重さと濃度を動かして、面積図の変化を見てみよう。</p></header><section class="stage"><div class="pair">
<article><div class="head"><h2>A</h2><button id="lockA">🔒 基準</button></div><div class="space"><div class="vessel" id="vesselA"><b class="weight" id="weightLabelA"></b><b class="conc" id="concLabelA"></b><div class="inside"><strong id="saltA"></strong><span id="waterA"></span></div></div></div></article>
<article><div class="head"><h2>B</h2></div><div class="space"><div class="vessel" id="vesselB"><b class="weight" id="weightLabelB"></b><b class="conc" id="concLabelB"></b><div class="inside"><strong id="saltB"></strong><span id="waterB"></span></div></div></div></article>
</div><div class="table"></div></section><section class="controls">
<article class="card locked" id="cardA"><h3>A の設定</h3><label>食塩水の重さ <b id="wvA"></b><input id="weightA" type="range" min="50" max="300" step="10" value="100" disabled></label><label>濃度 <b id="cvA"></b><input id="concA" type="range" min="1" max="20" value="4" disabled></label></article>
<article class="card"><h3>B の設定</h3><label>食塩水の重さ <b id="wvB"></b><input id="weightB" type="range" min="50" max="300" step="10" value="100"></label><label>濃度 <b id="cvB"></b><input id="concB" type="range" min="1" max="20" value="4"></label></article>
</section><footer><button id="reset">最初にもどす</button><span>横＝食塩水の重さ　｜　縦＝濃度　｜　面積＝食塩の重さ</span></footer></main><script src="app.js"></script></body></html>
