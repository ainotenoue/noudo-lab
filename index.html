<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>面積図メーカー v1.5</title><style>
*{box-sizing:border-box}:root{--bg:#f7f5ef;--ink:#181818;--line:#555;--table:#806b52}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{width:min(1180px,96vw);margin:auto;padding:12px 16px 28px}header{text-align:center}h1{display:inline;font-size:clamp(30px,4vw,42px);margin:0}.ver{margin-left:12px;border:1px solid #aaa;border-radius:99px;background:#fff;padding:5px 9px;font-size:12px;font-weight:800}.stage{height:660px;display:grid;grid-template-columns:120px 185px 1fr 120px;gap:18px;align-items:end}.side{height:430px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.iconbox{height:55px}.iconbox svg{width:46px;height:46px}.vr{height:300px;width:48px;writing-mode:vertical-lr;direction:rtl;accent-color:#555;touch-action:none}.sideval{font-size:24px;font-weight:900;margin-top:6px}.concbox{height:430px;display:flex;align-items:center;justify-content:center}.fraction{width:155px;border:1px solid #ddd2bf;border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;background:#fff7}.fracIcon svg{width:48px;height:48px}.fracline{height:2px;width:100px;background:#333;margin:3px 0}.pct{font-size:34px;font-weight:900;margin-top:6px}.center{height:570px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.total{height:85px;display:flex;align-items:center;gap:10px;font-size:31px;font-weight:900}.total svg{width:64px;height:64px}.vspace{height:390px;width:100%;display:flex;align-items:flex-end;justify-content:center}.vessel{position:relative;border:3px solid var(--line);border-top-width:2px;min-width:55px;transition:width .12s,height .12s,background .15s}.inside{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:46px;overflow:hidden}.component{text-align:center;font-weight:900;font-size:22px}.component svg{display:block;width:52px;height:52px;margin:auto}.table{height:7px;background:var(--table);border-radius:5px}.reset{display:block;margin:12px auto 0;border:1px solid #aaa;background:#fff;border-radius:12px;padding:9px 16px;font-size:20px}.note{text-align:center;color:#777;font-size:13px;margin-top:8px}@media(max-width:850px){main{width:100%;padding:8px}.stage{grid-template-columns:80px 135px 1fr 80px;gap:5px}.fraction{width:125px}.vr{height:275px}.inside{gap:18px}.component svg{width:42px;height:42px}.component{font-size:18px}.total{font-size:25px}}
</style></head><body><main><header><h1>面積図メーカー</h1><span class="ver">v1.5</span></header><section class="stage">
<div class="side"><div class="iconbox" id="saltTop"></div><input id="saltBar" class="vr" type="range" min="0" max="50" step="1" value="4" aria-label="食塩量"><div id="saltVal" class="sideval">4g</div></div>
<div class="concbox"><div class="fraction"><div class="fracIcon" id="fracSalt"></div><div class="fracline"></div><div class="fracIcon" id="fracTotal"></div><div id="pct" class="pct">4%</div></div></div>
<div class="center"><div class="total"><span id="totalIcon"></span><span id="totalVal">100g</span></div><div class="vspace"><div id="vessel" class="vessel"><div class="inside"><div class="component"><span id="saltInside"></span><span id="saltInsideVal">4g</span></div><div class="component"><span id="waterInside"></span><span id="waterInsideVal">96g</span></div></div></div></div></div>
<div class="side"><div class="iconbox" id="waterTop"></div><input id="waterBar" class="vr" type="range" min="0" max="250" step="1" value="96" aria-label="水量"><div id="waterVal" class="sideval">96g</div></div>
</section><div class="table"></div><button id="reset" class="reset" aria-label="最初にもどす">↺</button><p class="note">横＝全体量　｜　縦＝濃度　｜　面積＝食塩の量</p>
<script>
const $=x=>document.getElementById(x),PG=1.58,PC=16.4;
const salt=`<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#fafaf7" stroke="#555" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></svg>`;
const water=`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#176b91" stroke-width="2"/></svg>`;
const beaker=`<svg viewBox="0 0 72 60" aria-hidden="true"><path d="M12 7h48M16 7v43c0 4 3 6 7 6h26c4 0 7-2 7-6V7" fill="#70c7ea" stroke="#555" stroke-width="2.5"/><g transform="translate(20 21) scale(.48)"><g fill="#fafaf7" stroke="#555" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></g><g transform="translate(40 23) scale(.45)"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#176b91" stroke-width="2.5"/></g></svg>`;
const f=n=>{n=Math.round(n*10)/10;return Number.isInteger(n)?String(n):n.toFixed(1)};
function color(c){let t=Math.max(0,Math.min(1,c/20));return `hsl(197 ${52+t*18}% ${98-Math.pow(t,.82)*42}%)`}
function render(){const s=+$('saltBar').value,w=+$('waterBar').value,t=s+w,c=t?100*s/t:0;$('saltVal').textContent=f(s)+'g';$('waterVal').textContent=f(w)+'g';$('totalVal').textContent=f(t)+'g';$('saltInsideVal').textContent=f(s)+'g';$('waterInsideVal').textContent=f(w)+'g';$('pct').textContent=f(c)+'%';const v=$('vessel');v.style.width=Math.max(55,t*PG)+'px';v.style.height=Math.max(2,c*PC)+'px';v.style.background=color(c)}
$('saltTop').innerHTML=salt;$('waterTop').innerHTML=water;$('saltInside').innerHTML=salt;$('waterInside').innerHTML=water;$('fracSalt').innerHTML=salt;$('fracTotal').innerHTML=beaker;$('totalIcon').innerHTML=beaker;$('saltBar').oninput=render;$('waterBar').oninput=render;$('reset').onclick=()=>{$('saltBar').value=4;$('waterBar').value=96;render()};render();
</script></main></body></html>
