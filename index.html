<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>濃度ラボ v2.0</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f7f5ef;--ink:#181818;--line:#4f4f4f;--table:#806b52}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{width:min(1240px,97vw);margin:auto;padding:12px 18px 28px}
header{text-align:center;height:82px}
h1{display:inline;font-size:clamp(32px,4vw,44px);margin:0}
.ver{margin-left:12px;border:1px solid #aaa;border-radius:99px;background:#fff;padding:5px 10px;font-size:12px;font-weight:800}

.stage{
  height:650px;
  display:grid;
  grid-template-columns:105px 105px minmax(430px,1fr) 180px;
  gap:22px;
  align-items:end;
}
.side{
  height:445px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}
.iconbox{height:58px;display:flex;align-items:center;justify-content:center}
.iconbox svg{width:48px;height:48px}
.vr{
  height:305px;width:48px;
  writing-mode:vertical-lr;direction:rtl;
  accent-color:#555;touch-action:none;
}
.sideval{font-size:25px;font-weight:900;margin-top:7px;white-space:nowrap}

.center{
  height:555px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  min-width:0;
}
.vspace{
  height:410px;width:100%;
  display:flex;align-items:flex-end;justify-content:center;
}
.vessel{
  position:relative;
  border:3px solid var(--line);
  border-top-width:2px;
  min-width:58px;
  transition:width .12s ease-out,height .12s ease-out,background .15s ease-out;
}
.inside{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  gap:42px;overflow:hidden;
}
.component{
  display:flex;flex-direction:column;align-items:center;
  font-size:22px;font-weight:900;white-space:nowrap;
}
.component svg{width:52px;height:52px;display:block;margin-bottom:2px}

.total{
  height:105px;
  display:flex;align-items:center;justify-content:center;
  gap:10px;
  font-size:31px;font-weight:900;
}
.total svg{width:68px;height:58px;display:block}

.conc{
  height:445px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.ratio{
  display:flex;align-items:center;justify-content:center;
  gap:9px;
}
.ratio .saltIcon svg{width:50px;height:50px}
.slash{
  font-size:76px;
  line-height:.8;
  font-weight:300;
  transform:translateY(-1px);
}
.ratio .beakerIcon svg{width:62px;height:54px}
.pct{font-size:38px;font-weight:900;margin-top:10px}

.table{height:7px;background:var(--table);border-radius:5px}
.reset{
  display:block;margin:12px auto 0;
  border:1px solid #aaa;background:#fff;border-radius:12px;
  padding:9px 16px;font-size:20px;cursor:pointer;
}
.note{text-align:center;color:#777;font-size:13px;margin-top:8px}

@media(max-width:900px){
  main{width:100%;padding:8px}
  .stage{grid-template-columns:78px 78px minmax(330px,1fr) 135px;gap:5px}
  .side,.conc{height:420px}
  .vr{height:280px}
  .inside{gap:18px}
  .component svg{width:42px;height:42px}
  .component{font-size:18px}
  .total{font-size:25px}
  .ratio .saltIcon svg{width:42px;height:42px}
  .ratio .beakerIcon svg{width:52px;height:46px}
  .slash{font-size:62px}
  .pct{font-size:32px}
}
</style>
</head>
<body>
<main>
<header><h1>濃度ラボ</h1><span class="ver">v2.0</span></header>

<section class="stage">
  <div class="side">
    <div class="iconbox" id="waterTop"></div>
    <input id="waterBar" class="vr" type="range" min="0" max="300" step="1" value="96" aria-label="水の量">
    <div id="waterVal" class="sideval">96g</div>
  </div>

  <div class="side">
    <div class="iconbox" id="saltTop"></div>
    <input id="saltBar" class="vr" type="range" min="0" max="50" step="1" value="4" aria-label="食塩の量">
    <div id="saltVal" class="sideval">4g</div>
  </div>

  <div class="center">
    <div class="vspace">
      <div id="vessel" class="vessel">
        <div class="inside">
          <div class="component"><span id="waterInside"></span><span id="waterInsideVal">96g</span></div>
          <div class="component"><span id="saltInside"></span><span id="saltInsideVal">4g</span></div>
        </div>
      </div>
    </div>
    <div class="total"><span id="totalIcon"></span><span id="totalVal">100g</span></div>
  </div>

  <div class="conc">
    <div class="ratio">
      <span class="saltIcon" id="ratioSalt"></span>
      <span class="slash">/</span>
      <span class="beakerIcon" id="ratioTotal"></span>
    </div>
    <div id="pct" class="pct">4%</div>
  </div>
</section>

<div class="table"></div>
<button id="reset" class="reset" aria-label="最初にもどす">↺</button>
<p class="note">横＝全体量　｜　縦＝濃度　｜　面積＝食塩の量</p>

<script>
const $=id=>document.getElementById(id);
const PG=1.58, PC=16.4;

const salt=`<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#fafaf7" stroke="#4f4f4f" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></svg>`;

const water=`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#176b91" stroke-width="2"/></svg>`;

const beaker=`<svg viewBox="0 0 72 60" aria-hidden="true">
  <path d="M12 7h48M16 7v43c0 4 3 6 7 6h26c4 0 7-2 7-6V7" fill="#70c7ea" stroke="#4f4f4f" stroke-width="2.5"/>
  <g transform="translate(18 21) scale(.48)"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#176b91" stroke-width="2.5"/></g>
  <g transform="translate(39 20) scale(.48)"><g fill="#fafaf7" stroke="#4f4f4f" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></g>
</svg>`;

const fmt=n=>{
  n=Math.round(n*10)/10;
  return Number.isInteger(n)?String(n):n.toFixed(1);
};

function color(c){
  const t=Math.max(0,Math.min(1,c/20));
  return `hsl(197 ${52+t*18}% ${98-Math.pow(t,.82)*42}%)`;
}

function render(){
  const waterG=+$("waterBar").value;
  const saltG=+$("saltBar").value;
  const total=saltG+waterG;
  const conc=total?100*saltG/total:0;

  $("waterVal").textContent=fmt(waterG)+"g";
  $("saltVal").textContent=fmt(saltG)+"g";
  $("waterInsideVal").textContent=fmt(waterG)+"g";
  $("saltInsideVal").textContent=fmt(saltG)+"g";
  $("totalVal").textContent=fmt(total)+"g";
  $("pct").textContent=fmt(conc)+"%";

  const vessel=$("vessel");
  vessel.style.width=Math.max(58,total*PG)+"px";
  vessel.style.height=Math.max(2,conc*PC)+"px";
  vessel.style.background=color(conc);
}

$("waterTop").innerHTML=water;
$("saltTop").innerHTML=salt;
$("waterInside").innerHTML=water;
$("saltInside").innerHTML=salt;
$("totalIcon").innerHTML=beaker;
$("ratioSalt").innerHTML=salt;
$("ratioTotal").innerHTML=beaker;

$("waterBar").addEventListener("input",render);
$("saltBar").addEventListener("input",render);
$("reset").addEventListener("click",()=>{
  $("waterBar").value=96;
  $("saltBar").value=4;
  render();
});

render();
</script>
</main>
</body>
</html>
