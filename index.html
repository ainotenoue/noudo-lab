<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>濃度ラボ v3.0</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f7f5ef;--ink:#181818;--line:#505050}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{position:relative;width:min(1240px,100vw);height:100vh;margin:auto;padding:8px 14px}
header{text-align:center;height:72px}
h1{display:inline;margin:0;font-size:clamp(32px,4vw,44px);font-weight:900}
.ver{margin-left:12px;padding:5px 10px;border:1px solid #aaa;border-radius:99px;background:#fff;font-size:12px;font-weight:800}

/* Fixed visual field.  The reference state (salt 4g / water 96g / 4%) defines all label positions. */
.stage{
  position:relative;
  height:calc(100vh - 80px);
  min-height:600px;
}
.vesselAnchor{
  position:absolute;
  left:59%;
  bottom:220px;
  width:0;height:0;
}
.vessel{
  position:absolute;
  right:0;bottom:0;
  border:1px solid var(--line);
  background:#dff2f8;
  overflow:visible;
  transition:background .10s linear;
}
/* Contents keep their fixed horizontal layout and move vertically with concentration. */
.contentsFixed{
  position:absolute;
  right:-20px;
  bottom:30px;
  width:210px;
  height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  pointer-events:none;
  z-index:3;
}
.component{display:flex;flex-direction:column;align-items:center;font-size:34px;font-weight:900;white-space:nowrap}
.component svg{width:47px;height:47px;display:block;margin-bottom:1px}
 
  /* 水の表示領域 */
.contentsFixed .component:last-child{
  width:110px;
  align-items:flex-start;
}

/* 水のアイコンは中央配置を維持 */
.contentsFixed .component:last-child svg{
  align-self:center;
}

/* 塩の表示領域 */
.contentsFixed .component:first-child{
  width:80px;
  align-items:flex-start;
  flex-shrink:0;
}

/* 塩のアイコンは中央配置で固定 */
.contentsFixed .component:first-child svg{
  align-self:center;
}

/* Total amount is also fixed at the reference-state position, under the vessel. */
.totalFixed{
  position:absolute;
  left:-198px;
  top:8px;
  display:flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
}
.totalFixed svg{width:62px;height:54px;display:block}
.totalVal{font-size:34px;font-weight:900}

/* Concentration: icon fraction above, number below. Fixed position. */
.concFixed{
  position:absolute;
  left:calc(59% + 30px);
  bottom:260px;
  width:142px;
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:4;
}
.ratio{display:flex;align-items:center;justify-content:center;gap:7px;height:58px}
.ratio .saltIcon svg{width:39px;height:39px}
.slash{font-size:40px;line-height:.8;font-weight:300}
.ratio .beakerIcon svg{width:51px;height:45px}
.pct{font-size:34px;font-weight:900;margin-top:5px;white-space:nowrap}

/* Right-handed touch controls. Slider bottoms align to vessel bottom. */
.controls{
  position:absolute;
  right:48px;
  bottom:240px;
  display:flex;
  gap:8px;
  align-items:flex-end;
}
.barSide{width:86px;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.iconbox{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.iconbox svg{
  width:54px;
  height:54px;
}
.vr{
  height:350px;width:46px;
  writing-mode:vertical-lr;
  direction:rtl;
  accent-color:#555;
  touch-action:none;
  
  -webkit-appearance:none;
  appearance:none;
}
  
/* スライダーのつまみ */
.vr::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#555;
  border:3px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}
  /* 塩のつまみ */
#saltBar::-webkit-slider-thumb{
  background:#E6C5A8;
}

/* 水のつまみ */
#waterBar::-webkit-slider-thumb{
  background:#A8D8EA;
}
  
.sideval{height:38px;font-size:34px;font-weight:900;margin-top:5px;white-space:nowrap}

.reset{
  position:fixed;right:16px;bottom:14px;
  width:50px;height:50px;border:1px solid #aaa;background:#fff;
  border-radius:12px;font-size:22px;z-index:20;cursor:pointer
}

@media(max-width:900px){
 main{padding:6px 8px}
 header{height:64px}
 .stage{height:calc(100vh - 70px);min-height:560px}
 .vesselAnchor{left:58%;bottom:220px}
 .contentsFixed{right:-20px;bottom:25px;width:200px;height:82px}
 .component{font-size:25px}.component svg{width:39px;height:39px}
 .totalFixed{left:-108px;top:8px}.totalFixed svg{width:53px;height:47px}.totalVal{font-size:25px}
 .concFixed{left:calc(58% + 12px);bottom:220px;width:125px}
 .ratio .saltIcon svg{width:34px;height:34px}.ratio .beakerIcon svg{width:44px;height:39px}
 .slash{font-size:40px}.pct{font-size:29px}
 .controls{right:26px;bottom:260px;gap:2px}
 .barSide{width:72px;height:370px}.vr{height:270px}
 .sideval{font-size:21px}
 .reset{right:10px;bottom:10px}
}

/* v2.5: common zero line */
.zeroLine{
  position:absolute;
  left:6%;
  right:280px;
  bottom:220px;
  height:2px;
  background:#9a9184;
  opacity:.72;
  z-index:1;
  pointer-events:none;
}
.vesselAnchor{bottom:220px}
.controls{bottom:220px}
.vesselAnchor,.controls,.concFixed{z-index:2}

@media(max-width:900px){
  .zeroLine{left:4%;right:280px;bottom:220px}
  .vesselAnchor{bottom:220px}
  .controls{bottom:260px}
}
  
/* 数値ガイドの基準位置 */
.barSide{
  position:relative;
}

/* ガイド共通 */
.sliderGuide{
  position:absolute;
  left:0px;
  bottom:0;

  min-width:75px;
  padding:7px 12px;

  background:#fff;
  border:2px solid #ddd;
  border-radius:12px;

  font-size:28px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;

  box-shadow:0 3px 10px rgba(0,0,0,.15);

  opacity:0;
  visibility:hidden;
  pointer-events:none;
  z-index:30;
}

/* 操作中だけ表示 */
.sliderGuide.active{
  opacity:1;
  visibility:visible;
}

/* 塩 */
.saltGuide{
  border-color:#E6C5A8;
}

/* 水 */
.waterGuide{
  border-color:#A8D8EA;
}
  
</style>
</head>
<body>
<main>
<header><h1>濃度ラボ</h1><span class="ver">v3.0</span></header>

<section class="stage">
  <div class="zeroLine" aria-hidden="true"></div>
  <div class="vesselAnchor">
    <div id="vessel" class="vessel"></div>

    <div class="contentsFixed">
      <div class="component"><span id="saltInside"></span><span id="saltInsideVal">4g</span></div>
      <div class="component"><span id="waterInside"></span><span id="waterInsideVal">96g</span></div>
    </div>

    <div class="totalFixed">
      <span id="totalIcon"></span><span id="totalVal" class="totalVal">100g</span>
    </div>
  </div>

  <div class="concFixed">
    <div class="ratio">
      <span class="saltIcon" id="ratioSalt"></span>
      <span class="slash">/</span>
      <span class="beakerIcon" id="ratioTotal"></span>
    </div>
    <div id="pct" class="pct">4%</div>
  </div>

  <div class="controls">
    <div class="barSide">
      <div class="iconbox" id="saltTop"></div>
      <div id="saltGuide" class="sliderGuide saltGuide">4g</div>
      <input id="saltBar" class="vr" type="range" min="0" max="50" step="1" value="4" aria-label="食塩の量">
      <div id="saltVal" class="sideval">4g</div>
    </div>
    <div class="barSide">
      <div class="iconbox" id="waterTop"></div>
      <div id="waterGuide" class="sliderGuide waterGuide">96g</div>
      <input id="waterBar" class="vr" type="range" min="0" max="300" step="1" value="96" aria-label="水の量">
      <div id="waterVal" class="sideval">96g</div>
    </div>
  </div>
</section>

<button id="reset" class="reset" aria-label="最初にもどす">↺</button>

<script>
const $=id=>document.getElementById(id);

/* Reference state 100g / 4% is deliberately large enough to contain both fixed labels cleanly. */
const PG=2.10;   // 100g -> 210px width
const PC=16.50;   // 4%   -> 68px height

const salt=`<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#fafaf7" stroke="#4f4f4f" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></svg>`;
const water=`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#176b91" stroke-width="2"/></svg>`;
const beaker=`<svg viewBox="0 0 72 60" aria-hidden="true">
<path d="M12 7h48M16 7v43c0 4 3 6 7 6h26c4 0 7-2 7-6V7" fill="#70c7ea" stroke="#4f4f4f" stroke-width="2.5"/>
<g transform="translate(18 21) scale(.48)"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#176b91" stroke-width="2.5"/></g>
<g transform="translate(39 20) scale(.48)"><g fill="#fafaf7" stroke="#4f4f4f" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></g></svg>`;

const fmt=n=>{
  n=Math.round(n*10)/10;
  return Number.isInteger(n)?String(n):n.toFixed(1);
};
function color(c){
  const t=Math.max(0,Math.min(1,c/20));
  return `hsl(197 ${52+t*18}% ${98-Math.pow(t,.82)*42}%)`;
}

function render(){
  const waterG=+$("waterBar").value;
  const saltG=+$("saltBar").value;
  const total=saltG+waterG;
  const conc=total?100*saltG/total:0;

  $("waterVal").textContent=fmt(waterG)+"g";
  $("saltVal").textContent=fmt(saltG)+"g";
  $("waterInsideVal").textContent=fmt(waterG)+"g";
  $("saltInsideVal").textContent=fmt(saltG)+"g";
  $("totalVal").textContent=fmt(total)+"g";
  $("pct").textContent=fmt(conc)+"%";

  // 4% is the lowest label position; 26% is the highest.
  // This caps only the movement, not the calculated concentration.
  const labelRiseMax=160;
  const labelRatio=Math.max(0,Math.min(1,(conc-4)/(26-4)));
  document.querySelector(".contentsFixed").style.transform=
    `translateY(${-labelRatio*labelRiseMax}px)`;

  const vessel=$("vessel");
  vessel.style.width=Math.max(2,total*PG)+"px";
  vessel.style.height=Math.max(2,conc*PC)+"px";
  vessel.style.background=color(conc);
}

$("saltTop").innerHTML=salt;
$("waterTop").innerHTML=water;
$("saltInside").innerHTML=salt;
$("waterInside").innerHTML=water;
$("totalIcon").innerHTML=beaker;
$("ratioSalt").innerHTML=salt;
$("ratioTotal").innerHTML=beaker;

$("saltBar").addEventListener("input",render);
$("waterBar").addEventListener("input",render);
$("reset").addEventListener("click",()=>{
  $("saltBar").value=4;
  $("waterBar").value=96;
  render();
});
function updateGuide(barId, guideId){
  const bar = $(barId);
  const guide = $(guideId);

  const min = Number(bar.min);
  const max = Number(bar.max);
  const value = Number(bar.value);

  const ratio = (value - min) / (max - min);

  // 縦スライダーのつまみ中心位置
  const thumbSize = 36;
  const trackHeight = bar.getBoundingClientRect().height;
  const y = thumbSize / 2
    + (1 - ratio) * (trackHeight - thumbSize);

  // barSideを基準に位置を計算
  const parentRect = bar.parentElement.getBoundingClientRect();
  const barRect = bar.getBoundingClientRect();

  const guideHeight = guide.offsetHeight;
  const guideBottom =
    parentRect.bottom - barRect.top - y
    + guideHeight + 8;

  guide.style.bottom = guideBottom + "px";
  guide.textContent = value + "g";
}

function setupGuide(barId, guideId){
  const bar = $(barId);
  const guide = $(guideId);

  bar.addEventListener("input",()=>{
    updateGuide(barId,guideId);
    guide.classList.add("active");
  });

  bar.addEventListener("pointerdown",()=>{
    updateGuide(barId,guideId);
    guide.classList.add("active");
  });

  const hide = ()=>{
    guide.classList.remove("active");
  };

  bar.addEventListener("pointerup",hide);
  bar.addEventListener("pointercancel",hide);
  bar.addEventListener("blur",hide);
}

setupGuide("saltBar","saltGuide");
setupGuide("waterBar","waterGuide");
  
render();
</script>
</main>
</body>
</html>
