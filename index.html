<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>面積図メーカー v1.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>面積図メーカー</h1>
      <p>重さと濃度を動かして、面積図の変化を見てみよう。</p>
    </header>

    <section class="stage" aria-label="面積図比較">
      <div class="vessel-area">
        <article class="vessel-column">
          <div class="label-row">
            <h2>A</h2>
            <button id="lockA" class="lock-btn" type="button" aria-pressed="true">🔒 基準</button>
          </div>
          <div class="vessel-space">
            <div id="vesselA" class="vessel">
              <span id="weightLabelA" class="weight-label">100g</span>
              <span id="concentrationLabelA" class="concentration-label">4%</span>
              <span id="saltLabelA" class="salt-label">4g</span>
            </div>
          </div>
        </article>

        <article class="vessel-column">
          <div class="label-row">
            <h2>B</h2>
          </div>
          <div class="vessel-space">
            <div id="vesselB" class="vessel">
              <span id="weightLabelB" class="weight-label">100g</span>
              <span id="concentrationLabelB" class="concentration-label">4%</span>
              <span id="saltLabelB" class="salt-label">4g</span>
            </div>
          </div>
        </article>
      </div>
      <div class="table-line" aria-hidden="true"></div>
    </section>

    <section class="controls">
      <article class="control-card locked" id="controlsA">
        <h3>A の設定</h3>
        <label>
          <span>食塩水の重さ <strong id="weightValueA">100g</strong></span>
          <input id="weightA" type="range" min="50" max="300" step="10" value="100" disabled>
        </label>
        <label>
          <span>濃度 <strong id="concentrationValueA">4%</strong></span>
          <input id="concentrationA" type="range" min="1" max="20" step="1" value="4" disabled>
        </label>
      </article>

      <article class="control-card">
        <h3>B の設定</h3>
        <label>
          <span>食塩水の重さ <strong id="weightValueB">100g</strong></span>
          <input id="weightB" type="range" min="50" max="300" step="10" value="100">
        </label>
        <label>
          <span>濃度 <strong id="concentrationValueB">4%</strong></span>
          <input id="concentrationB" type="range" min="1" max="20" step="1" value="4">
        </label>
      </article>
    </section>

    <footer>
      <button id="reset" type="button">最初にもどす</button>
      <p>横＝食塩水の重さ　｜　縦＝濃度　｜　面積＝食塩の重さ</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
