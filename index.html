<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面積図メーカー v1.4</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:1120px;margin:auto;padding:12px}header{text-align:center}h1{display:inline;font-size:40px}.ver{margin-left:12px;border:1px solid #aaa;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:bold;background:#fff}.choices{text-align:center;margin:16px}.choice,.reset{padding:9px 16px;border:1px solid #aaa;background:#fff;border-radius:12px;font-weight:bold}.choice.on{background:#333;color:#fff}.stage{height:610px;display:grid;grid-template-columns:120px 1fr 120px;gap:18px;align-items:end}.side{height:420px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.icon{height:54px}.icon svg,.frac svg,.total svg{width:42px;height:42px}.vr{height:295px;width:48px;writing-mode:vertical-lr;direction:rtl;accent-color:#555}.val{font-size:24px;font-weight:900;margin-top:5px}.center{height:540px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.total{height:72px;display:flex;align-items:center;gap:8px;font-size:31px;font-weight:900}.vspace{height:350px;width:100%;display:flex;align-items:flex-end;justify-content:center}.vessel{border:3px solid #555;border-top-width:2px;min-width:55px;transition:.12s}.fraction{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center}.frac{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:850;height:34px}.frac svg{width:30px;height:30px}.line{height:2px;width:105px;background:#333}.pct{font-size:30px;font-weight:900}.table{height:7px;background:#806b52;border-radius:5px}.reset{display:block;margin:10px auto}.note{text-align:center;color:#777;font-size:13px}@media(max-width:760px){.stage{grid-template-columns:82px 1fr 82px;gap:4px}.vr{height:270px}.stage{height:570px}.total{font-size:25px}}</style></head><body><main>
<header><h1>面積図メーカー</h1><span class="ver">v1.4 ICON TEST</span></header>
<div class="choices"><button class="choice on" data-i="shaker">A 食卓塩</button><button class="choice" data-i="crystal">B 塩の粒</button></div>
<div class="stage">
<div class="side"><div class="icon salt"></div><input id="sbar" class="vr" type="range" min="0" max="50" value="4"><div id="sv" class="val"></div></div>
<div class="center"><div class="total"><span class="beaker"></span><span id="tv"></span></div><div class="vspace"><div id="vessel" class="vessel"></div></div><div class="fraction"><div class="frac"><span class="salt"></span><span id="fs"></span></div><div class="line"></div><div class="frac"><span class="beaker"></span><span id="ft"></span></div><div id="pct" class="pct"></div></div></div>
<div class="side"><div class="icon water"></div><input id="wbar" class="vr" type="range" min="0" max="250" value="96"><div id="wv" class="val"></div></div>
</div><div class="table"></div><button id="reset" class="reset">↺</button><p class="note">A / B は塩アイコンだけを切り替えます。</p>
<script>
const $=x=>document.getElementById(x),PG=1.58,PC=16.4;
const I={
shaker:`<svg viewBox="0 0 48 48"><path d="M17 8h14l2 8H15z" fill="#eee" stroke="#555" stroke-width="2"/><circle cx="20" cy="12" r="1.2"/><circle cx="24" cy="11" r="1.2"/><circle cx="28" cy="12" r="1.2"/><path d="M14 18h20l-2 23H16z" fill="#fff" stroke="#555" stroke-width="2"/><path d="M18 32h12" stroke="#ccc" stroke-width="5"/></svg>`,
crystal:`<svg viewBox="0 0 48 48"><g fill="#fafaf7" stroke="#555" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></svg>`,
water:`<svg viewBox="0 0 48 48"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#477b8c" stroke-width="2"/></svg>`,
beaker:`<svg viewBox="0 0 48 48"><path d="M13 7h22M17 7v9L9 39c-1 3 1 5 4 5h22c3 0 5-2 4-5l-8-23V7" fill="#fff" stroke="#555" stroke-width="2"/><path d="M12 33h24l3 8H9z" fill="#bfe7f5"/><path d="M12 33h24" stroke="#477b8c" stroke-width="1.5"/></svg>`};
let mode="shaker";const f=n=>{n=Math.round(n*10)/10;return Number.isInteger(n)?n:n.toFixed(1)};
function icons(){document.querySelectorAll(".salt").forEach(e=>e.innerHTML=I[mode]);document.querySelectorAll(".water").forEach(e=>e.innerHTML=I.water);document.querySelectorAll(".beaker").forEach(e=>e.innerHTML=I.beaker)}
function color(c){let t=Math.max(0,Math.min(1,c/20));return `hsl(197 ${52+t*18}% ${98-Math.pow(t,.82)*42}%)`}
function render(){let s=+$("sbar").value,w=+$("wbar").value,t=s+w,c=t?100*s/t:0;$("sv").textContent=f(s)+"g";$("wv").textContent=f(w)+"g";$("tv").textContent=f(t)+"g";$("fs").textContent=f(s)+"g";$("ft").textContent=f(t)+"g";$("pct").textContent=f(c)+"%";let v=$("vessel");v.style.width=Math.max(55,t*PG)+"px";v.style.height=Math.max(2,c*PC)+"px";v.style.background=color(c)}
$("sbar").oninput=render;$("wbar").oninput=render;document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{document.querySelectorAll(".choice").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.i;icons()});$("reset").onclick=()=>{$("sbar").value=4;$("wbar").value=96;render()};icons();render();
</script></main></body></html>
