<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>濃度ラボ v2.7</title>
<style>
:root{--bg:#f7f5ef;--ink:#181818;--line:#505050;--panel:#ffffff;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17181a;--ink:#eee;--line:#999;--panel:#232426;}
}
:root[data-theme="dark"]{--bg:#17181a;--ink:#eee;--line:#999;--panel:#232426;}
*{box-sizing:border-box}
html,body{margin:0;width:100%;background:var(--bg);}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));}
main{max-width:960px;margin:auto;}
header{text-align:center;margin-bottom:18px;}
h1{display:inline;margin:0;font-size:clamp(22px,4vw,32px);font-weight:900;}
.ver{margin-left:10px;padding:4px 9px;border:1px solid var(--line);border-radius:99px;font-size:11px;font-weight:800;}

.stageRow{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;justify-content:center;}

.vesselCol{display:flex;flex-direction:column;align-items:center;}
#stageBox{position:relative;width:min(260px,42vw);height:min(230px,42vh);border-bottom:2px solid var(--line);}
.vessel{position:absolute;right:0;bottom:0;border:1px solid var(--line);overflow:visible;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px;
  transition:width .12s linear,height .12s linear,background .12s linear;}
.component{display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:800;white-space:nowrap;}
.component svg{width:20px;height:20px;display:block;margin-bottom:2px;}
.totalLabel{margin-top:12px;font-size:15px;font-weight:800;}

.concCol{display:flex;flex-direction:column;align-items:center;padding-bottom:6px;}
.concCol .ratio{display:flex;align-items:center;gap:6px;height:34px;}
.concCol .ratio svg{width:26px;height:26px;}
.concCol .slash{font-size:26px;font-weight:300;line-height:.8;}
.concCol .pct{font-size:26px;font-weight:900;margin-top:4px;white-space:nowrap;}

.controls{display:flex;gap:14px;align-items:flex-end;margin-left:auto;}
.barSide{display:flex;flex-direction:column;align-items:center;gap:8px;}
.barSide .iconbox svg{width:26px;height:26px;display:block}
input[type=range].vertical{
  -webkit-appearance:slider-vertical;
  writing-mode:vertical-lr;
  width:40px;height:220px;
  accent-color:var(--line);
  touch-action:none;
}
.sideval{font-size:14px;font-weight:800;}

.reset{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;
  border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:20px;}
</style>
</head>
<body>
<main>
<header><h1>濃度ラボ</h1><span class="ver">v2.7</span></header>

<div class="stageRow">
  <div class="vesselCol">
    <div id="stageBox">
      <div id="vessel" class="vessel">
        <div class="component"><span id="saltInside"></span><span id="saltInsideVal">4g</span></div>
        <div class="component"><span id="waterInside"></span><span id="waterInsideVal">96g</span></div>
      </div>
    </div>
    <div class="totalLabel">合計 <span id="totalVal">100g</span></div>
  </div>

  <div class="concCol">
    <div class="ratio">
      <span id="ratioSalt"></span><span class="slash">/</span><span id="ratioTotal"></span>
    </div>
    <div class="pct" id="pctVal">4%</div>
  </div>

  <div class="controls">
    <div class="barSide">
      <div class="iconbox" id="saltTop"></div>
      <input id="saltBar" class="vertical" type="range" min="0" max="50" step="1" value="4" aria-label="食塩の量">
      <div id="saltVal" class="sideval">4g</div>
    </div>
    <div class="barSide">
      <div class="iconbox" id="waterTop"></div>
      <input id="waterBar" class="vertical" type="range" min="0" max="300" step="1" value="96" aria-label="水の量">
      <div id="waterVal" class="sideval">96g</div>
    </div>
  </div>
</div>
</main>

<button id="reset" class="reset" aria-label="最初にもどす">↺</button>

<script>
const $=id=>document.getElementById(id);

// スライダー最大値の合計がstageBoxの幅にちょうど収まるよう換算する
const MAX_TOTAL_G = 50 + 300;
const MAX_CONC_FOR_SCALE = 25;
let PG = 1, PC = 1;

const stageBox = $("stageBox");

function computeScale(){
  const rect = stageBox.getBoundingClientRect();
  PG = rect.width / MAX_TOTAL_G;
  PC = rect.height / MAX_CONC_FOR_SCALE;
}

const salt=`<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#fafaf7" stroke="#4f4f4f" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></svg>`;
const water=`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#176b91" stroke-width="2"/></svg>`;
const beaker=`<svg viewBox="0 0 72 60" aria-hidden="true">
<path d="M12 7h48M16 7v43c0 4 3 6 7 6h26c4 0 7-2 7-6V7" fill="#70c7ea" stroke="#4f4f4f" stroke-width="2.5"/>
<g transform="translate(18 21) scale(.48)"><path d="M24 5C20 13 12 22 12 30a12 12 0 0 0 24 0c0-8-8-17-12-25z" fill="#bfe7f5" stroke="#176b91" stroke-width="2.5"/></g>
<g transform="translate(39 20) scale(.48)"><g fill="#fafaf7" stroke="#4f4f4f" stroke-width="1.8"><path d="M8 30l8-11 8 11-8 7z"/><path d="M23 25l7-10 8 10-7 8z"/><path d="M19 39l6-9 7 9-7 5z"/></g></g></svg>`;

const fmt=n=>{
  n=Math.round(n*10)/10;
  return Number.isInteger(n)?String(n):n.toFixed(1);
};
function color(c){
  const t=Math.max(0,Math.min(1,c/20));
  return `hsl(197 ${52+t*18}% ${98-Math.pow(t,.82)*42}%)`;
}

function render(){
  const waterG=+$("waterBar").value;
  const saltG=+$("saltBar").value;
  const total=saltG+waterG;
  const conc=total?100*saltG/total:0;

  $("waterVal").textContent=fmt(waterG)+"g";
  $("saltVal").textContent=fmt(saltG)+"g";
  $("waterInsideVal").textContent=fmt(waterG)+"g";
  $("saltInsideVal").textContent=fmt(saltG)+"g";
  $("totalVal").textContent=fmt(total)+"g";
  $("pctVal").textContent=fmt(conc)+"%";

  const rect = stageBox.getBoundingClientRect();
  const w = Math.min(rect.width, Math.max(2, total*PG));
  const h = Math.min(rect.height, Math.max(2, conc*PC));

  const vessel=$("vessel");
  vessel.style.width=w+"px";
  vessel.style.height=h+"px";
  vessel.style.background=color(conc);
}

$("saltTop").innerHTML=salt;
$("waterTop").innerHTML=water;
$("saltInside").innerHTML=salt;
$("waterInside").innerHTML=water;
$("ratioSalt").innerHTML=salt;
$("ratioTotal").innerHTML=beaker;

$("saltBar").addEventListener("input",render);
$("waterBar").addEventListener("input",render);
$("reset").addEventListener("click",()=>{
  $("saltBar").value=4;
  $("waterBar").value=96;
  render();
});
window.addEventListener("resize",()=>{computeScale();render();});
window.addEventListener("load",()=>{computeScale();render();});
computeScale();
render();
</script>
</body>
</html>
