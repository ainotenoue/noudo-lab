<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>食塩水の部屋 v4.2｜濃度ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#f7f5ef;--ink:#2f3437;--ink2:#7b766d;--card:#fff;--edge:#ebe5da;
  --green-d:#3f9b4a;--green-s:#ebfbea;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Hiragino Maru Gothic ProN','M PLUS Rounded 1c',-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:1200px;margin:0 auto;padding:15px 28px 26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.question{margin:0 0 10px;background:var(--card);border:2px solid var(--edge);border-radius:22px;padding:26px 26px;line-height:1.7;font-size:clamp(17px,2vw,22px);font-weight:800}
.question small{display:inline-block;font-size:13px;color:var(--green-d);background:var(--green-s);border-radius:999px;padding:2px 12px;font-weight:800}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tabs button{width:38px;height:38px;padding:0;font-size:15px;background:#fff;border-color:var(--edge);color:var(--ink2)}
.tabs button.done{background:#f3f0e8;color:#9a9488;border-color:#e2dccf}
.tabs button.done::after{content:"✓";font-size:10px;vertical-align:super;margin-left:1px;color:var(--green-d)}
.tabs button[aria-pressed="true"]{background:var(--green-s);border-color:#9fd99f;color:#2f6f37}
.tabs button.freeb{width:auto;padding:0 14px;margin-left:6px}
#snap{background:#fff}
.panel{background:var(--card);border:2px solid var(--edge);border-radius:26px;padding:10px 22px 12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head strong{font-size:17px;font-weight:800}
.hint{font-size:13px;color:var(--ink2);font-weight:700}
.hint b{color:var(--green-d)}
.legend{font-size:13px;color:var(--ink2);font-weight:700}
.legend b{color:var(--ink)}
.diagram{width:100%;height:auto;display:block;max-height:470px;touch-action:none;user-select:none;-webkit-user-select:none;font-family:inherit}
.diagram:focus{outline:none}
.handle{cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}
@keyframes nudgeX{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes nudgeY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hx .hgrip{animation:nudgeX 1.4s ease-in-out infinite}
.hy .hgrip{animation:nudgeY 1.4s ease-in-out infinite}
.moved .hgrip{animation:none}
/* できたら、長方形がくっきり濃くなる */
#after{transition:fill .35s ease,stroke .35s ease}
.panel-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:48px}
.panel-foot .back{grid-column:1;justify-self:start;font-size:14px;padding:6px 14px;color:#5b737b;text-decoration:none;font-weight:800;border:2px solid var(--edge);border-radius:999px;background:#fff}
.check{grid-column:2;text-align:center;position:relative;top:-14px;visibility:hidden;background:var(--green-s);border-radius:16px;padding:6px 16px;font-size:15px;font-weight:700;line-height:1.5;color:#2f5f35}
.check.on{visibility:visible;animation:pop .35s ease-out}
.check b{font-size:18px;color:#25642c}
.check .ln2{display:block;font-size:13px;font-weight:700;color:#3d6b42}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.fbtns{grid-column:3;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
button{font:inherit;cursor:pointer;white-space:nowrap;flex:none;border:2px solid #b9e6b9;border-radius:999px;padding:5px 14px;font-size:14px;background:var(--green-s);font-weight:800;color:#2f6f37}
button:active{transform:translateY(1px)}
#nextq{background:#90ee90;border-color:#6fd16f;color:#1f5a26}
@media(max-width:760px){main{padding:12px}.question{padding:18px 16px}.panel{padding:10px}.hint,.legend{font-size:11px}}
@media(prefers-reduced-motion:reduce){.hgrip,.check.on{animation:none}}
</style></head><body><main><h1 class="sr">食塩水の部屋</h1>
<div class="question"><div class="qtop"><small id="qTag"></small><div class="tabs" id="tabs"></div></div><div id="qText"></div></div>
<section class="panel"><div class="panel-head"><strong id="task"></strong><span class="legend">横＝<b>食塩水の重さ</b>　たて＝<b>濃度</b>　面積＝<b>食塩の量</b></span><span class="hint" id="hint"></span></div>
<svg class="diagram" id="diagram" viewBox="0 0 1100 500" role="img" aria-label="食塩水の面積図。横が食塩水の重さ、たてが濃度、面積が食塩の量">
  <g id="art"></g>
</svg>
<div class="panel-foot"><a class="back" href="../">← TOP</a><div class="check" id="check" role="status" aria-live="polite"></div><div class="fbtns"><button id="nextq" hidden>次の問題へ →</button><button id="snap" hidden>いまを「はじめ」にする</button><button id="reset">はじめに戻す</button></div></div></section>
</main><script>
(()=>{
const $=id=>document.getElementById(id), svg=$('diagram');
const X0=170,Y0=400,W=760,H=300;           // 面積図の原点（左下）と、いちばん大きいときの横・たて
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt=n=>Number((Math.round(n*100)/100).toFixed(2)).toString();

/* ===== 問題 =====
   kind 'base'  … 重さが決まっている食塩水の、食塩の量を求める（上の辺を動かす＝濃度を変える）
   kind 'salt'  … 食塩を加える（右の辺を動かす。食塩も全体も増える）
   kind 'water' … 水を加える（右の辺を動かす。食塩は同じで、全体が増える）
   kind 'evap'  … 水を蒸発させる（右の辺を左へ動かす。食塩は同じで、全体が減る）
   g0,c0 … はじめの重さ・濃度　amt … 問題で加える（蒸発させる）量　range … 動かせる範囲 */
const PROBLEMS=[
  {kind:'base',tag:'基本の濃度計算',g0:200,c0:5,amt:10,range:[0,30],step:1,start:20,
   text:'5％の食塩水200gには、食塩が何g含まれていますか？'},
  {kind:'salt',tag:'食塩を加える',g0:100,c0:4,amt:20,range:[0,40],step:1,start:0,
   text:'4％の食塩水100gに食塩を20g加えると、濃度は何％になりますか？'},
  {kind:'water',tag:'水を加えて薄める',g0:200,c0:6,amt:100,range:[0,200],step:5,start:0,
   text:'6％の食塩水200gに水を100g加えると、濃度は何％になりますか？'},
  {kind:'evap',tag:'水を蒸発させて濃くする',g0:200,c0:6,amt:50,range:[0,100],step:5,start:0,
   text:'6％の食塩水200gから水を50g蒸発させると、濃度は何％になりますか？'},
  {kind:'base',tag:'基本の濃度計算',g0:150,c0:8,amt:12,range:[0,30],step:1,start:24,
   text:'8％の食塩水150gには、食塩が何g含まれていますか？'},
  {kind:'salt',tag:'食塩を加える',g0:90,c0:10,amt:10,range:[0,30],step:1,start:0,
   text:'10％の食塩水90gに食塩を10g加えると、濃度は何％になりますか？'},
  {kind:'water',tag:'水を加えて薄める',g0:150,c0:8,amt:50,range:[0,150],step:5,start:0,
   text:'8％の食塩水150gに水を50g加えると、濃度は何％になりますか？'},
  {kind:'evap',tag:'水を蒸発させて濃くする',g0:300,c0:4,amt:100,range:[0,200],step:5,start:0,
   text:'4％の食塩水300gから水を100g蒸発させると、濃度は何％になりますか？'}
];
let idx=0,P=PROBLEMS[0],v=0,drag=false;
/* じゆうに試す: 食塩（上の辺）と水（右の辺）をどちらもドラッグで変えられる。
   「いまを『はじめ』にする」で今の状態を点線で残し、そこからの変化を比べられる */
const FDEF={s:10,w:190},FS={sMax:100,wMax:400,sStep:1,wStep:5};
let free=false,F={s:10,w:190},snap=null,dragKind='';
/* 目盛りの切りかえ（ズーム）: いまとはじめが収まる、いちばん大きく見える目盛り。ドラッグ中は固定し、はみ出したときだけ広げる */
let Zc=10,Zg=300;
function fitZoom(expandOnly){
  const cs=[fC(F)].concat(snap?[fC(snap)]:[]),gs=[F.s+F.w].concat(snap?[snap.s+snap.w]:[]);
  const nc=Math.max.apply(null,cs)*1.12,ng=Math.max.apply(null,gs)*1.04;
  const c=[10,20,30,40,60,100].find(t=>t>=nc)||100,g=[300,400,500].find(t=>t>=ng)||500;
  if(expandOnly){Zc=Math.max(Zc,c);Zg=Math.max(Zg,g);}else{Zc=c;Zg=g;}
}
let done={};try{done=JSON.parse(localStorage.getItem('lab-done')||'{}')||{};}catch(e){done={};}
const saveDone=()=>{try{localStorage.setItem('lab-done',JSON.stringify(done));}catch(e){}};

/* いまの状態（はじめ と 変えたあと） */
const salt0=()=>P.g0*P.c0/100;
function now(t){
  t=t==null?v:t;
  if(P.kind==='base')return {g:P.g0,s:t,c:t/P.g0*100};
  if(P.kind==='salt')return {g:P.g0+t,s:salt0()+t,c:(salt0()+t)/(P.g0+t)*100};
  if(P.kind==='water')return {g:P.g0+t,s:salt0(),c:salt0()/(P.g0+t)*100};
  return {g:P.g0-t,s:salt0(),c:salt0()/(P.g0-t)*100};
}
const solved=()=>Math.abs(v-P.amt)<1e-9;
/* 目盛り: この問題で動かせる範囲の、いちばん大きい重さと濃度が図に収まるように */
function scale(){
  let gMax=P.g0,cMax=P.c0;
  for(const t of [P.range[0],P.range[1]]){const n=now(t);gMax=Math.max(gMax,n.g);cMax=Math.max(cMax,n.c);}
  return {kx:W/gMax,ky:H/cMax};
}
function tint(c){const t=Math.max(0,Math.min(1,c/25));return 'hsl(197 '+(55+t*15)+'% '+(93-t*30)+'%)';}

const tw=(s,fs)=>{let w=0;for(const ch of String(s))w+=/[ -~]/.test(ch)?0.6:1;return w*fs;};
function txt(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'middle')+'" dominant-baseline="central" font-size="'+(o.fs||20)+'" font-weight="'+(o.fw||800)+'" fill="'+(o.c||'#2f3437')+'">'+s+'</text>';}
function pill(x,y,s,bg,fg,stroke,fs){const w=Math.max(70,String(s).length*(fs||24)*0.62+30);return '<rect x="'+(x-w/2)+'" y="'+(y-21)+'" width="'+w+'" height="42" rx="21" fill="'+bg+'"'+(stroke?' stroke="'+stroke+'" stroke-width="2"':'')+'/>'+txt(x,y+1,s,{fs:fs||24,c:fg});}
/* 寸法線（重さ）: 左右に小さな縦線、まん中に数字 */
function dim(xa,xb,y,s,col,fs){
  return '<line x1="'+xa+'" y1="'+y+'" x2="'+xb+'" y2="'+y+'" stroke="'+col+'" stroke-width="2"/>'+
    '<line x1="'+xa+'" y1="'+(y-8)+'" x2="'+xa+'" y2="'+(y+8)+'" stroke="'+col+'" stroke-width="2"/>'+
    '<line x1="'+xb+'" y1="'+(y-8)+'" x2="'+xb+'" y2="'+(y+8)+'" stroke="'+col+'" stroke-width="2"/>'+
    '<rect x="'+((xa+xb)/2-(tw(s,fs||20)+16)/2)+'" y="'+(y-14)+'" width="'+(tw(s,fs||20)+16)+'" height="28" fill="#fff"/>'+txt((xa+xb)/2,y+1,s,{fs:fs||20,c:col});
}

function draw(){
  const {kx,ky}=scale(),n=now(),ok=solved(),b={g:P.g0,s:salt0(),c:P.c0};
  const wA=n.g*kx,hA=n.c*ky,wB=b.g*kx,hB=b.c*ky;
  const unknownC=P.kind!=='base'&&!ok, unknownS=P.kind==='base'&&!ok;
  let h='';
  // 地面
  h+='<line x1="'+(X0-30)+'" y1="'+Y0+'" x2="'+(X0+W+40)+'" y2="'+Y0+'" stroke="#9a9184" stroke-width="2"/>';
  // 01: めあての濃度の線
  if(P.kind==='base'){
    const yt=Y0-P.c0*ky;
    h+='<line x1="'+(X0-10)+'" y1="'+yt+'" x2="'+(X0+wB+30)+'" y2="'+yt+'" stroke="#3f9b4a" stroke-width="2.5" stroke-dasharray="10 7"/>'+
      txt(X0+wB+40,yt,'めあて '+P.c0+'％',{a:'start',fs:18,c:'#3f9b4a'});
  }
  // 変えたあとの長方形（面積＝食塩）
  h+='<rect id="after" x="'+X0+'" y="'+(Y0-hA)+'" width="'+wA+'" height="'+hA+'" rx="4" fill="'+(ok?'#7cc6e0':tint(n.c))+'" stroke="'+(ok?'#2f86a8':'#7fb8ca')+'" stroke-width="'+(ok?4:3)+'"/>';
  // はじめの長方形（点線）
  if(P.kind!=='base')h+='<rect x="'+X0+'" y="'+(Y0-hB)+'" width="'+wB+'" height="'+hB+'" fill="none" stroke="#8a8478" stroke-width="2.5" stroke-dasharray="9 7"/>';
  // 面積の中の「食塩」
  const sLab='食塩 '+(unknownS?'？':fmt(n.s))+'g';
  if(hA>34)h+=txt(X0+wA/2,Y0-hA/2,sLab,{fs:Math.min(28,Math.max(18,hA*.35))});
  else h+=txt(X0+wA/2,Y0-hA-20,sLab,{fs:18});
  // 寸法線（重さ）
  if(P.kind==='base')h+=dim(X0,X0+wA,Y0+34,fmt(n.g)+'g','#2f3437',22);
  else{
    h+=dim(X0,X0+wB,Y0+30,'はじめ '+fmt(b.g)+'g','#8a8478',17);
    h+=dim(X0,X0+wA,Y0+68,fmt(n.g)+'g','#2f3437',22);
  }
  // 濃度（左側）
  if(P.kind!=='base'){
    h+='<line x1="'+(X0-12)+'" y1="'+(Y0-hB)+'" x2="'+X0+'" y2="'+(Y0-hB)+'" stroke="#8a8478" stroke-width="2"/>'+txt(X0-18,Y0-hB,'はじめ '+P.c0+'％',{a:'end',fs:16,c:'#8a8478'});
  }
  let yc=Y0-hA; if(P.kind!=='base'&&Math.abs(yc-(Y0-hB))<30)yc=(Y0-hA)+(hA>hB?-30:30);
  h+=pill(X0-80,Math.max(22,yc),(unknownC?'？':fmt(n.c))+'％','#90ee90','#25642c',null,24);
  // 操作した量（加えた・蒸発させた分）
  if(P.kind==='salt'||P.kind==='water'){
    if(v>0){
      h+='<rect x="'+(X0+wB)+'" y="'+(Y0-hA)+'" width="'+(wA-wB)+'" height="'+hA+'" fill="'+(P.kind==='salt'?'#ffd1dc':'#d7eef7')+'" opacity=".75"/>';
      h+=txt(X0+wB+(wA-wB)/2,Y0-hA-22,'＋'+(P.kind==='salt'?'食塩':'水')+' '+fmt(v)+'g',{fs:18,c:P.kind==='salt'?'#b5607a':'#3f7f93'});
    }
  }
  if(P.kind==='evap'&&v>0){
    h+='<rect x="'+(X0+wA)+'" y="'+(Y0-hB)+'" width="'+(wB-wA)+'" height="'+hB+'" fill="#fff" opacity=".7" stroke="#c9c3b8" stroke-dasharray="4 5"/>';
    h+=txt(X0+wA+(wB-wA)/2,Y0-hB-22,'－水 '+fmt(v)+'g（蒸発）',{fs:18,c:'#3f7f93'});
  }
  // 取っ手
  if(P.kind==='base'){
    const hx=X0+wA/2,hy=Y0-hA;
    h+='<g class="handle hy" id="handle"><rect x="'+X0+'" y="'+(hy-26)+'" width="'+wA+'" height="52" fill="transparent"/>'+
      '<g class="hgrip"><circle cx="'+hx+'" cy="'+hy+'" r="17" fill="#fff" stroke="#2f86a8" stroke-width="3"/>'+txt(hx,hy+1,'↕',{fs:20,c:'#2f86a8'})+'</g></g>';
  }else{
    const hx=X0+wA,hy=Y0-hA/2;
    h+='<g class="handle hx" id="handle"><rect x="'+(hx-26)+'" y="'+(Y0-hA-10)+'" width="52" height="'+(hA+20)+'" fill="transparent"/>'+
      '<g class="hgrip"><circle cx="'+hx+'" cy="'+hy+'" r="17" fill="#fff" stroke="#2f86a8" stroke-width="3"/>'+txt(hx,hy+1,'↔',{fs:20,c:'#2f86a8'})+'</g></g>';
  }
  $('art').innerHTML=h;
}

function updateCheck(){
  const el=$('check');
  if(!solved()){el.classList.remove('on');el.innerHTML='';$('nextq').hidden=true;return;}
  if(el.classList.contains('on'))return;
  if(!done[idx]){done[idx]=1;saveDone();renderTabs();}
  const n=now(),s0=salt0();
  let head,ln;
  if(P.kind==='base'){head='答え 食塩 '+fmt(n.s)+'g';ln='確かめ：'+P.g0+'g × '+fmt(P.c0/100)+' ＝ '+fmt(n.s)+'g（重さ × 濃度 ＝ 食塩）';}
  else{
    head='答え '+fmt(n.c)+'％';
    const saltTxt=P.kind==='salt'?fmt(s0)+'g → '+fmt(s0)+'＋'+fmt(v)+'＝'+fmt(n.s)+'g':fmt(s0)+'g → '+fmt(n.s)+'g（変わらない）';
    ln='確かめ：食塩 '+saltTxt+' ／ 全体 '+P.g0+'g → '+fmt(n.g)+'g ／ '+fmt(n.s)+'÷'+fmt(n.g)+'＝'+fmt(n.s/n.g)+' → '+fmt(n.c)+'％';
  }
  el.innerHTML='<b>できた！ '+head+'</b><span class="ln2">'+ln+'</span>';
  el.classList.add('on');
  $('nextq').hidden=idx>=PROBLEMS.length-1;
}
function update(){draw();updateCheck();}
function setV(t){v=Math.max(P.range[0],Math.min(P.range[1],Math.round(t/P.step)*P.step));update();}

/* ドラッグ: 01は上の辺（たて＝濃度）、ほかは右の辺（横＝重さ）が指についてくる */
function localPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):null;}
function valueFromPt(l){
  const {kx,ky}=scale();
  if(P.kind==='base')return (Y0-l.y)/ky*P.g0/100;   // 濃度 → 食塩
  const g=(l.x-X0)/kx;
  return P.kind==='evap'?P.g0-g:g-P.g0;
}
let off=0;
svg.addEventListener('pointerdown',e=>{
  if(free){
    const hd=e.target.closest('#hS,#hW');if(!hd)return;
    const l=localPt(e);if(!l)return;
    dragKind=hd.id==='hS'?'S':'W';off=freeFromPt(dragKind,l)-(dragKind==='S'?F.s:F.w);
    drag=true;svg.classList.add('moved');svg.setPointerCapture(e.pointerId);e.preventDefault();return;
  }
  if(!e.target.closest('#handle'))return;
  const l=localPt(e);if(!l)return;
  off=valueFromPt(l)-v;drag=true;svg.classList.add('moved');svg.setPointerCapture(e.pointerId);e.preventDefault();
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const l=localPt(e);if(!l)return;if(free)setFree(dragKind,freeFromPt(dragKind,l)-off);else setV(valueFromPt(l)-off);});
const stop=()=>{if(drag&&free){drag=false;fitZoom(false);drawFree();}drag=false;};svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
/* キーボード */
svg.setAttribute('tabindex','0');
svg.addEventListener('keydown',e=>{
  if(free){
    const m={ArrowUp:['S',1],ArrowDown:['S',-1],ArrowRight:['W',1],ArrowLeft:['W',-1]}[e.key];if(!m)return;
    svg.classList.add('moved');setFree(m[0],(m[0]==='S'?F.s+FS.sStep*m[1]:F.w+FS.wStep*m[1]));e.preventDefault();return;
  }
  const up=P.kind==='base'?['ArrowUp','ArrowRight']:P.kind==='evap'?['ArrowLeft','ArrowDown']:['ArrowRight','ArrowUp'];
  const all=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];if(all.indexOf(e.key)<0)return;
  svg.classList.add('moved');setV(v+(up.indexOf(e.key)>=0?P.step:-P.step));e.preventDefault();
});

const fC=(st)=>st.s+st.w>0?st.s/(st.s+st.w)*100:0;
const ap=(v,d)=>{const r=Number(v.toFixed(d));return (Math.abs(r-v)>1e-9?'約':'')+r;};
function drawFree(){
  if(fC(F)>Zc||F.s+F.w>Zg)fitZoom(true);
  const kx=W/Zg,ky=H/Zc;
  const g=F.s+F.w,c=fC(F),wA=g*kx,hA=Math.min(c,Zc)*ky,over=c>Zc;
  let h='<line x1="'+(X0-30)+'" y1="'+Y0+'" x2="'+(X0+W+40)+'" y2="'+Y0+'" stroke="#9a9184" stroke-width="2"/>';
  h+='<line x1="'+X0+'" y1="'+(Y0-H)+'" x2="'+X0+'" y2="'+Y0+'" stroke="#e2dccf" stroke-width="2"/>'+txt(X0+8,Y0-H,'たて：'+Zc+'％まで',{a:'start',fs:14,c:'#a39d91',fw:700});
  h+='<rect x="'+X0+'" y="'+(Y0-hA)+'" width="'+Math.max(2,wA)+'" height="'+Math.max(2,hA)+'" rx="4" fill="'+tint(c)+'" stroke="#7fb8ca" stroke-width="3"/>';
  if(snap){
    const gB=snap.s+snap.w,cB=fC(snap),wB=gB*kx,hB=Math.min(cB,Zc)*ky;
    h+='<rect x="'+X0+'" y="'+(Y0-hB)+'" width="'+wB+'" height="'+hB+'" fill="none" stroke="#8a8478" stroke-width="2.5" stroke-dasharray="9 7"/>';
    h+='<line x1="'+(X0-12)+'" y1="'+(Y0-hB)+'" x2="'+X0+'" y2="'+(Y0-hB)+'" stroke="#8a8478" stroke-width="2"/>'+txt(X0-18,Y0-hB,'はじめ '+ap(cB,1)+'％',{a:'end',fs:16,c:'#8a8478'});
    h+=dim(X0,X0+wB,Y0+30,'はじめ '+fmt(gB)+'g','#8a8478',17);
  }
  const sLab='食塩 '+fmt(F.s)+'g';
  if(hA>34&&wA>110)h+=txt(X0+wA/2,Y0-hA/2,sLab,{fs:Math.min(28,Math.max(18,hA*.35))});else h+=txt(X0+Math.max(wA,60)/2+10,Y0-hA-(over?40:20),sLab,{fs:18});
  h+=dim(X0,X0+Math.max(wA,40),Y0+(snap?68:34),fmt(g)+'g（食塩 '+fmt(F.s)+'＋水 '+fmt(F.w)+'）','#2f3437',19);
  let yc=Y0-hA;
  if(snap){const hB=Math.min(fC(snap),Zc)*ky;if(Math.abs(yc-(Y0-hB))<30)yc=yc+(hA>hB?-30:30);}
  h+=pill(X0-80,Math.max(22,Math.min(Y0-10,yc)),ap(c,1)+'％','#90ee90','#25642c',null,24);
  // 取っ手: 上の辺＝食塩、右の辺＝水
  const tx=X0+Math.max(wA,40)/2,ty=Y0-hA,rx=X0+wA,ry=Y0-Math.max(hA,40)/2;
  h+='<g class="handle hy" id="hS"><rect x="'+X0+'" y="'+(ty-24)+'" width="'+Math.max(wA,60)+'" height="48" fill="transparent"/>'+
    '<g class="hgrip"><circle cx="'+tx+'" cy="'+ty+'" r="17" fill="#fff" stroke="#e2708f" stroke-width="3"/>'+txt(tx,ty+1,'↕',{fs:20,c:'#b5607a'})+'</g>'+
    txt(tx+26,ty-20,'食塩',{a:'start',fs:15,c:'#b5607a'})+'</g>';
  h+='<g class="handle hx" id="hW"><rect x="'+(rx-24)+'" y="'+(Y0-Math.max(hA,40)-10)+'" width="48" height="'+(Math.max(hA,40)+20)+'" fill="transparent"/>'+
    '<g class="hgrip"><circle cx="'+rx+'" cy="'+ry+'" r="17" fill="#fff" stroke="#2f86a8" stroke-width="3"/>'+txt(rx,ry+1,'↔',{fs:20,c:'#2f86a8'})+'</g>'+
    txt(rx+24,ry-24,'水',{a:'start',fs:15,c:'#3f7f93'})+'</g>';
  $('art').innerHTML=h;
  // くらべる: はじめ → いま
  const el=$('check');
  if(snap){
    const gB=snap.s+snap.w,d=(a,b)=>{const x=b-a;return x===0?'（変わらない）':'（'+(x>0?'＋':'－')+fmt(Math.abs(x))+'g）';};
    el.innerHTML='<b>はじめ '+ap(fC(snap),1)+'％ → いま '+ap(c,1)+'％</b><span class="ln2">食塩 '+fmt(snap.s)+'g → '+fmt(F.s)+'g'+d(snap.s,F.s)+' ／ 水 '+fmt(snap.w)+'g → '+fmt(F.w)+'g'+d(snap.w,F.w)+' ／ 全体 '+fmt(gB)+'g → '+fmt(g)+'g</span>';
  }else el.innerHTML='<b>'+ap(c,1)+'％</b><span class="ln2">食塩 '+fmt(F.s)+'g ÷ 全体 '+fmt(g)+'g ＝ '+ap(g?F.s/g:0,4)+'</span>';
  el.classList.add('on');
}
/* 指の位置から値を出す: 上の辺→その濃度になる食塩の量（水はそのまま）、右の辺→その重さになる水の量（食塩はそのまま） */
function freeFromPt(kind,l){
  const kx=W/Zg,ky=H/Zc;
  if(kind==='S'){const c=Math.max(0,Math.min(99,(Y0-l.y)/ky))/100;return c>=1?FS.sMax:c*F.w/(1-c);}
  return (l.x-X0)/kx-F.s;
}
function setFree(kind,val){
  if(kind==='S')F.s=Math.max(0,Math.min(FS.sMax,Math.round(val/FS.sStep)*FS.sStep));
  else F.w=Math.max(0,Math.min(FS.wMax,Math.round(val/FS.wStep)*FS.wStep));
  if(F.s+F.w<=0)F.w=FS.wStep;
  drawFree();
}
function loadFree(){
  free=true;F={s:FDEF.s,w:FDEF.w};snap=null;fitZoom(false);
  $('qTag').textContent='じゆうに試す';
  $('qText').textContent='';$('qText').hidden=true;
  $('task').textContent='じゆうに動かそう';
  $('hint').innerHTML='<b>↕</b> 上の辺＝食塩　<b>↔</b> 右の辺＝水 をドラッグ';
  svg.classList.remove('moved');
  $('nextq').hidden=true;$('snap').hidden=false;
  $('check').classList.remove('on');
  renderTabs();drawFree();
}
function renderTabs(){
  $('tabs').innerHTML=PROBLEMS.map((q,j)=>'<button data-i="'+j+'" aria-pressed="'+(j===idx&&!free)+'"'+(done[j]?' class="done"':'')+' aria-label="問題'+(j+1)+(done[j]?'（クリア）':'')+'">'+(j+1)+'</button>').join('')+
    '<button data-i="free" class="freeb" aria-pressed="'+free+'">じゆうに試す</button>';
}
function load(i){
  idx=i;P=PROBLEMS[i];free=false;$('qText').hidden=false;$('snap').hidden=true;
  $('qTag').textContent='問題 '+String(i+1).padStart(2,'0')+'｜'+P.tag;
  $('qText').textContent=P.text;
  $('task').textContent=P.kind==='base'?'濃度を'+P.c0+'％にしよう':P.kind==='salt'?'食塩を加えよう':P.kind==='water'?'水を加えよう':'水を蒸発させよう';
  $('hint').innerHTML=P.kind==='base'?'<b>↕</b> 上の辺を指で上下にドラッグ':'<b>↔</b> 右の辺を指で左右にドラッグ';
  svg.classList.remove('moved');
  renderTabs();
  $('check').classList.remove('on');$('nextq').hidden=true;
  v=P.start;update();
}
$('reset').addEventListener('click',()=>{if(free){F={s:FDEF.s,w:FDEF.w};snap=null;fitZoom(false);drawFree();}else{v=P.start;update();}});
$('snap').addEventListener('click',()=>{snap={s:F.s,w:F.w};fitZoom(false);drawFree();});
$('nextq').addEventListener('click',()=>{if(idx<PROBLEMS.length-1)load(idx+1);});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const i=b.getAttribute('data-i');if(i==='free')loadFree();else load(+i);});
/* #free で開いたときは「じゆうに試す」から始める */
if(location.hash==='#free')loadFree();else load(0);
})();
</script></body></html>
